name: LIFE OS Jarvis tests
on:
  push:
    branches: [main]
    paths:
      - 'jarvis-core.js'
      - 'tests/**'
      - '.github/workflows/jarvis-tests.yml'
  pull_request:
    paths:
      - 'jarvis-core.js'
      - 'tests/**'
      - '.github/workflows/jarvis-tests.yml'
  workflow_dispatch:
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Jarvis unit tests
        run: node --test tests/jarvis-core.test.js
