name: LIFE OS Jarvis tests
on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'lifeos-systems.js'
      - 'lifeos-workspaces.js'
      - 'content.js'
      - 'index.html'
      - 'sw.js'
      - 'jarvis-core.js'
      - 'functions/api/jarvis.js'
      - 'workers/jarvis-worker.js'
      - 'tests/lifeos-improvements.test.js'
      - 'functions/api/jarvis.js'
      - 'workers/jarvis-worker.js'
      - 'CLOUDFLARE_JARVIS_SETUP.md'
      - 'tests/**'
      - '.github/workflows/jarvis-tests.yml'
  pull_request:
    paths:
      - 'app.js'
      - 'content.js'
      - 'index.html'
      - 'sw.js'
      - 'jarvis-core.js'
      - 'functions/api/jarvis.js'
      - 'workers/jarvis-worker.js'
      - 'tests/lifeos-improvements.test.js'
      - 'tests/**'
      - '.github/workflows/jarvis-tests.yml'
  workflow_dispatch:
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check lifeos-workspaces.js
          node --check lifeos-learning-plan.js
          node --check lifeos-systems.js
          node --check content.js
          node --check sw.js
          node --check jarvis-core.js
          node --check jarvis-mobile.js
          node --input-type=module --check < functions/api/jarvis.js
          node --input-type=module --check < workers/jarvis-worker.js
      - name: Run Jarvis unit and integration tests
        run: node --test tests/*.test.js
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android companion
        run: gradle -p android :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lifeos-jarvis-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
