name: LIFE OS Jarvis tests
on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'content.js'
      - 'index.html'
      - 'sw.js'
      - 'jarvis-core.js'
      - 'tests/**'
      - '.github/workflows/jarvis-tests.yml'
  pull_request:
    paths:
      - 'app.js'
      - 'content.js'
      - 'index.html'
      - 'sw.js'
      - 'jarvis-core.js'
      - 'tests/**'
      - '.github/workflows/jarvis-tests.yml'
  workflow_dispatch:
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check content.js
          node --check sw.js
          node --check jarvis-core.js
      - name: Run Jarvis unit and integration tests
        run: node --test tests/*.test.js
