name: LIFEOS checks

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check browser scripts
        run: |
          for file in ./*.js; do
            [ -f "$file" ] || continue
            echo "Checking $file"
            node --check "$file"
          done
          node --check sw.js
      - name: Check Worker module syntax
        run: |
          node --input-type=module --check < workers/jarvis-worker.js
          node --input-type=module --check < functions/api/jarvis.js
      - name: Run regression tests
        run: node --test tests/*.test.js
