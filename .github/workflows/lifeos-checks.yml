name: LIFEOS checks

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check browser scripts
        run: |
          node --check lifeos-intelligence-core.js\n          node --check app.js
          node --check content.js
          node --check content2.js
          node --check content3.js
          node --check jarvis-core.js
          node --check lifeos-jarvis-memory.js
          node --check lifeos-mira-skills.js
          node --check lifeos-systems.js
          node --check lifeos-rad-method.js
          node --check lifeos-workspaces.js
          node --check lifeos-learning-plan.js
          node --check lifeos-applied-mastery.js
          node --check sw.js
      - name: Check Worker module syntax
        run: |
          node --input-type=module --check < workers/jarvis-worker.js
          node --input-type=module --check < functions/api/jarvis.js
      - name: Run regression tests
        run: node --test tests/*.test.js
