name: Validate Life OS
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  syntax-and-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check content.js
          node --check content2.js
          node --check content3.js
          node --check sw.js
      - name: Validate PWA manifest
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8')); console.log('manifest.json: OK')"
      - name: Verify required PWA assets
        run: |
          test -s index.html
          test -s app.js
          test -s content.js
          test -s content2.js
          test -s content3.js
          test -s sw.js
          test -s manifest.json
          test -s icon.svg
