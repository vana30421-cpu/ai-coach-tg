/* ══════════════════════════════════════════════════════════════════
   CALENDAR
   ══════════════════════════════════════════════════════════════════ */
var calOffset = 0;

function renderCalendar() {
  var now = new Date();
  var month = new Date(now.getFullYear(), now.getMonth() + calOffset, 1);
  var year = month.getFullYear();
  var m = month.getMonth();
  var firstDay = (new Date(year, m, 1).getDay() + 6) % 7;
  var daysInMonth = new Date(year, m + 1, 0).getDate();
  var monthNames = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  var weekdays = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
  var todayStr = today();

  var events = state.schedule.filter(function(b) {
    var d = new Date(b.start_time);
    return d.getMonth() === m && d.getFullYear() === year;
  });

  var grid = '';
  for (var i = 0; i < weekdays.length; i++) {
    grid += '<div style="text-align:center;font-size:11px;font-weight:700;color:var(--text-3);padding:10px 0;text-transform:uppercase;">' + weekdays[i] + '</div>';
  }
  for (var k = 0; k < firstDay; k++) grid += '<div></div>';
  for (var day = 1; day <= daysInMonth; day++) {
    var ds = year + '-' + String(m+1).padStart(2,'0') + '-' + String(day).padStart(2,'0');
    var dayEvents = events.filter(function(b) { return new Date(b.start_time).toISOString().slice(0, 10) === ds; });
    var isToday = ds === todayStr;
    grid += '<button style="aspect-ratio:1;border-radius:16px;border:none;background:' + (isToday ? 'var(--brand)' : 'transparent') + ';color:' + (isToday ? '#fff' : 'var(--text)') + ';font-family:inherit;font-size:14px;font-weight:' + (isToday ? '800' : '600') + ';cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px;" onclick="showDayDetails(\'' + ds + '\')">';
    grid += '<span>' + day + '</span>';
    if (dayEvents.length) {
      grid += '<span style="display:flex;gap:2px;">';
      for (var j = 0; j < Math.min(3, dayEvents.length); j++) {
        grid += '<span style="width:3px;height:3px;border-radius:50%;background:' + (isToday ? '#fff' : 'var(--brand)') + ';"></span>';
      }
      grid += '</span>';
    }
    grid += '</button>';
  }

  var html = '<div class="page"><div class="title-xl">Календарь</div>';
  html += '<div class="card">';
  html += '<div class="row-between" style="margin-bottom:18px;">';
  html += '<button class="icon-btn" onclick="calOffset--;renderCalendar()">‹</button>';
  html += '<div class="title-m" style="margin:0;">' + monthNames[m] + ' ' + year + '</div>';
  html += '<button class="icon-btn" onclick="calOffset++;renderCalendar()">›</button>';
  html += '</div>';
  html += '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;">' + grid + '</div>';
  html += '</div>';

  html += '<div class="card"><h2>➕ Новое событие</h2>';
  html += '<div class="field"><input type="text" id="ev-title" placeholder="Название"/></div>';
  html += '<div class="field"><input type="datetime-local" id="ev-start"/></div>';
  html += '<div class="field"><input type="datetime-local" id="ev-end"/></div>';
  html += '<button class="btn btn-primary btn-block" onclick="addEvent()">Создать</button></div>';

  html += '<div class="card"><h2>📅 Предстоящие</h2>';
  var upcoming = state.schedule.filter(function(b) { return new Date(b.start_time) >= new Date(); })
    .sort(function(a,b) { return new Date(a.start_time) - new Date(b.start_time); }).slice(0, 8);
  if (upcoming.length) {
    for (var u = 0; u < upcoming.length; u++) {
      var b = upcoming[u];
      html += '<div class="list-row" onclick="editEvent(\'' + b.id + '\')">';
      html += '<div style="width:4px;height:42px;border-radius:2px;background:var(--brand);flex-shrink:0;"></div>';
      html += '<div class="list-body"><div class="list-title">' + esc(b.title) + '</div>';
      html += '<div class="list-subtitle">' + fmtDate(b.start_time) + ' · ' + fmtTime(b.start_time) + '–' + fmtTime(b.end_time) + '</div></div>';
      html += '<div class="list-chevron">›</div></div>';
    }
  } else {
    html += '<div class="footnote text-tertiary">Нет событий</div>';
  }
  html += '</div></div>';
  document.getElementById('app').innerHTML = html;
}

function addEvent() {
  var title = ((document.getElementById('ev-title') || {}).value || '').trim();
  var start = (document.getElementById('ev-start') || {}).value || '';
  var end = (document.getElementById('ev-end') || {}).value || '';
  if (!title || !start || !end) return toast('Заполните поля', 'error');
  if (new Date(start) >= new Date(end)) return toast('Неверный интервал', 'error');
  state.schedule.push({
    id: uid(), title: title,
    start_time: new Date(start).toISOString(),
    end_time: new Date(end).toISOString(),
    created_at: nowISO()
  });
  save();
  toast('Создано', 'success');
  haptic('success');
  renderCalendar();
}

function editEvent(id) {
  var b = state.schedule.find(function(x) { return x.id === id; });
  if (!b) return;
  openSheet('Событие',
    '<div class="field"><input type="text" id="ee-title" value="' + esc(b.title) + '"/></div>' +
    '<div class="field"><input type="datetime-local" id="ee-start" value="' + new Date(b.start_time).toISOString().slice(0,16) + '"/></div>' +
    '<div class="field"><input type="datetime-local" id="ee-end" value="' + new Date(b.end_time).toISOString().slice(0,16) + '"/></div>' +

function showDayDetails(dateStr) {
  var events = state.schedule.filter(function(b) { return new Date(b.start_time).toISOString().slice(0, 10) === dateStr; });
  var tasks = state.tasks.filter(function(t) { return t.created_at && t.created_at.slice(0, 10) === dateStr; });

/* ══════════════════════════════════════════════════════════════════
   HABITS, GOALS, TIMER, NOTES, LEARNING (legacy), FOCUS, MOOD, WATER, MEDS, WORKOUTS, MEDITATION, JOURNAL, MEDIA, FINANCE, HISTORY
   ══════════════════════════════════════════════════════════════════ */
function calcStreak(history) {
  if (!history || !history.length) return 0;
  var s = 0;
  var d = new Date();
  while (s < 365) {
    var ds = d.toISOString().slice(0, 10);
    if (history.indexOf(ds) >= 0) { s++; d.setDate(d.getDate() - 1); } else break;
  }
  return s;
}

function renderHabits() {
  var html = '<div class="page"><div class="title-xl">Привычки</div>';
  if (state.habits.length) {
    html += '<div class="card">';
    for (var i = 0; i < state.habits.length; i++) {
      var h = state.habits[i];
      var done = h.history && h.history.indexOf(today()) >= 0;
      var streak = calcStreak(h.history || []);
      html += '<div class="list-row">';
      html += '<button class="task-checkbox ' + (done ? 'checked' : '') + '" onclick="event.stopPropagation();toggleHabit(\'' + h.id + '\')">' + (done ? '✓' : '') + '</button>';
      html += '<div class="list-body"><div class="list-title">' + esc(h.title) + '</div>';
      html += '<div class="list-subtitle">' + (streak > 0 ? '🔥 ' + streak + ' дней' : 'Начни серию') + '</div></div>';
      html += '<button class="btn btn-icon btn-sm btn-ghost" onclick="event.stopPropagation();deleteHabit(\'' + h.id + '\')">🗑</button>';
      html += '</div>';
    }
    html += '</div>';
  } else {
    html += '<div class="empty"><div class="empty-icon">🔄</div><div class="empty-title">Нет привычек</div><div class="empty-text">Начни с одной</div></div>';
  }
  html += '<div class="card"><h2>Новая привычка</h2>';
  html += '<div class="field"><input type="text" id="h-title" placeholder="Например: Чтение 30 мин"/></div>';
  html += '<button class="btn btn-primary btn-block" onclick="addHabit()">Добавить</button></div></div>';
  document.getElementById('app').innerHTML = html;
}

function addHabit() {
  var title = ((document.getElementById('h-title') || {}).value || '').trim();
  if (!title) return toast('Введите название', 'error');
  state.habits.push({ id: uid(), title: title, history: [], created_at: nowISO() });
  save();
  toast('Добавлено', 'success');
  haptic('success');
  checkAchievements();
  renderHabits();
}

function toggleHabit(id) {
  var h = state.habits.find(function(x) { return x.id === id; });
  if (!h) return;
  if (!h.history) h.history = [];
  var t = today();
  if (h.history.indexOf(t) >= 0) {
    h.history = h.history.filter(function(d) { return d !== t; });
    toast('Отменено', 'info');
  } else {
    h.history.push(t);
    toast('Серия ' + calcStreak(h.history) + ' 🔥', 'success');
    haptic('success');
  }
  save();
  renderHabits();
}

function deleteHabit(id) {

  save();
  renderHabits();
}

var timerTick = null;
function computeElapsed(s) {
  if (!s) return 0;
  return Math.floor((Date.now() - new Date(s.start_time).getTime() - (s.paused_time || 0)) / 1000);
}

function renderTimer() {
  var active = state.timer.find(function(s) { return s.status === 'active' || s.status === 'paused'; });
  var body = '';
  if (active) {
    var elapsed = computeElapsed(active);
    var mins = Math.floor(elapsed / 60);
    var secs = elapsed % 60;
    body = '<div style="text-align:center;padding:36px 16px;">';
    body += '<div class="subhead text-secondary mb-2">' + esc(active.title) + '</div>';
    body += '<div style="font-size:76px;font-weight:800;font-variant-numeric:tabular-nums;background:linear-gradient(135deg,var(--brand),var(--brand-2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;margin:22px 0;">' + String(mins).padStart(2,'0') + ':' + String(secs).padStart(2,'0') + '</div>';
    body += '<div class="btn-row" style="justify-content:center;">';
    if (active.status === 'active') body += '<button class="btn btn-warning" onclick="pauseTimer()">⏸ Пауза</button>';
    else body += '<button class="btn btn-success" onclick="resumeTimer()">▶ Продолжить</button>';
    body += '<button class="btn btn-danger" onclick="stopTimer()">⏹ Завершить</button></div></div>';
  } else {
    body = '<div class="field"><input type="text" id="tm-title" placeholder="Что делаем?"/></div>';
    body += '<button class="btn btn-success btn-block" onclick="startTimer()">▶ Запустить</button>';
  }
  var history = state.timer.filter(function(s) { return s.status === 'done'; }).slice(-5).reverse();
  var html = '<div class="page"><div class="title-xl">Таймер</div>';
  html += '<div class="card">' + body + '</div>';
  html += '<div class="card"><h2>История</h2>';
  if (history.length) {
    for (var i = 0; i < history.length; i++) {
      var s = history[i];
      html += '<div class="list-row"><div class="list-body">';
      html += '<div class="list-title">' + esc(s.title) + '</div>';
      html += '<div class="list-subtitle">' + Math.floor((s.total_time||0)/60) + ' мин · ' + fmtDate(s.end_time) + '</div></div></div>';
    }
  } else {
    html += '<div class="footnote text-tertiary">Пока нет сессий</div>';
  }
  html += '</div></div>';
  document.getElementById('app').innerHTML = html;
  if (active && active.status === 'active' && !timerTick) {
    timerTick = setInterval(function() { if (currentPage === 'timer') renderTimer(); }, 1000);
  } else if (!active && timerTick) {
    clearInterval(timerTick);
    timerTick = null;
  }
}

function startTimer() {
  var title = ((document.getElementById('tm-title') || {}).value || '').trim() || 'Фокус-сессия';
  state.timer.push({ id: uid(), title: title, start_time: nowISO(), paused_time: 0, status: 'active', created_at: nowISO() });
  save();
  toast('Запущено', 'success');
  haptic('success');
  renderTimer();
}

function pauseTimer() {
  var s = state.timer.find(function(x) { return x.status === 'active'; });
  if (!s) return;
  s.paused_time += Date.now() - new Date(s.start_time).getTime() - s.paused_time;
  s.status = 'paused';
  save();
  renderTimer();
}

function resumeTimer() {
  var s = state.timer.find(function(x) { return x.status === 'paused'; });
  if (!s) return;
  s.start_time = nowISO();
  s.status = 'active';
  save();
  renderTimer();
}

function stopTimer() {
  var s = state.timer.find(function(x) { return x.status === 'active' || x.status === 'paused'; });
  if (!s) return;
  s.total_time = computeElapsed(s);
  s.status = 'done';
  s.end_time = nowISO();
  save();
  toast('Готово: ' + Math.floor(s.total_time/60) + ' мин', 'success');
  haptic('success');
  renderTimer();
}

function manageTable(table) {
  var items = state[table] || [];
  var html = '<div style="max-height:60vh;overflow-y:auto;">';
  var slice = items.slice(0, 100);
  for (var i = 0; i < slice.length; i++) {
    var item = slice[i];
    html += '<div style="padding:12px 0;border-bottom:0.5px solid var(--divider);">';
    html += '<div style="font-weight:600;margin-bottom:4px;">' + esc(item.title || item.name || item.date || (item.id ? item.id.slice(0, 12) : '')) + '</div>';
    html += '<div class="caption text-tertiary" style="font-family:monospace;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + esc(JSON.stringify(item).slice(0, 80)) + '</div></div>';
  }
  html += '</div>';
  openSheet(table + ' (' + items.length + ')', html);
}

function exportDB() {
  var blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'ai-health-' + today() + '.json';
  a.click();
  URL.revokeObjectURL(url);
  toast('Экспорт готов', 'success');
}

function importDB(e) {
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    try {
      var data = JSON.parse(ev.target.result);
      if (!confirm('Заменить все данные?')) return;
      state = Object.assign(defaultState(), data);
      save();
      toast('Импорт успешен', 'success');
      location.reload();
    } catch(err) { toast('Ошибка: ' + err.message, 'error'); }
  };
  reader.readAsText(file);
}

function renderProfile() {
  var p = state.profile;

  var totalDays = p.createdAt ? Math.max(1, Math.floor((Date.now() - new Date(p.createdAt).getTime()) / (24*60*60*1000)) + 1) : 1;
  var doneTasks = state.tasks.filter(function(t) { return t.status === 'completed'; }).length;
  var totalChats = state.chats.filter(function(c) { return c.role === 'user'; }).length;

  var html = '<div class="page">';
  html += '<div class="profile-hero">';
  html += '<div class="profile-avatar" onclick="pickEmoji()">' + p.emoji + '</div>';
  html += '<div class="profile-name">' + esc(p.name || 'Пользователь') + '</div>';
  html += '<div class="profile-sub">С нами ' + totalDays + ' дн.</div>';
  html += '</div>';

  html += '<div class="stat-grid mb-4">';
  html += '<div class="stat-item"><div class="stat-value">' + doneTasks + '</div><div class="stat-label">Задач</div></div>';
  html += '<div class="stat-item"><div class="stat-value">' + (state.stats.streak || 0) + '</div><div class="stat-label">Streak</div></div>';
  html += '<div class="stat-item"><div class="stat-value">' + totalChats + '</div><div class="stat-label">Диалогов</div></div>';
  html += '</div>';

  html += '<div class="card"><h2>✏️ Имя</h2>';
  html += '<div class="field" style="margin-bottom:0;"><input type="text" id="profile-name" value="' + esc(p.name) + '" placeholder="Как к вам обращаться?" onchange="saveProfileName(this.value)"/></div>';
  html += '</div>';

  html += '<div class="card"><h2>🏆 Достижения (' + unlocked.length + '/' + ACHIEVEMENTS.length + ')</h2>';
  html += '<div class="achieve-grid">';
  for (var i = 0; i < ACHIEVEMENTS.length; i++) {
    var a = ACHIEVEMENTS[i];
    var isUnlocked = unlocked.indexOf(a.id) >= 0;
    html += '<div class="achieve-item ' + (isUnlocked ? 'unlocked' : 'locked') + '">';
    html += '<div class="achieve-icon">' + a.icon + '</div>';
    html += '<div class="achieve-name">' + a.name + '</div>';
    html += '</div>';
  }
  html += '</div></div>';

  html += '<div class="card"><h2>⚙️ Настройки</h2>';
  html += '<div class="list-row" onclick="navigate(\'settings\')">';
  html += '<div class="list-icon" style="background:var(--surface-3);">⚙️</div>';

  html += '<div class="list-body"><div class="list-title">База данных</div></div>';
  html += '<div class="list-chevron">›</div></div>';
  html += '</div>';
  html += '</div>';

}

function pickEmoji() {
  var emojis = ['😊','😎','🤓','🧑‍💻','👨‍💼','👩‍💼','🦊','🐱','🐶','🦁','🐼','🦉','🌟','⚡','🔥','💎','🚀','🎯','🧠','💪','🌈','☕','🎨','🎮','🎧','📚','🏃','🧘','🍀','🌸','🦄','🐉','👑','🥇','🎓','💡'];
  var html = '<div class="emoji-grid">';
  for (var i = 0; i < emojis.length; i++) {
    var sel = emojis[i] === state.profile.emoji ? ' selected' : '';
    html += '<button class="emoji-pick' + sel + '" onclick="setEmoji(\'' + emojis[i] + '\')">' + emojis[i] + '</button>';
  }
  html += '</div>';
  openSheet('Выберите аватар', html);
}

function setEmoji(e) {
  state.profile.emoji = e;

  updateHeaderAvatar();
}

function saveProfileName(name) {
  state.profile.name = (name || '').trim() || 'Пользователь';
  save();
  toast('Сохранено', 'success');

}

function updateHeaderAvatar() {
  var el = document.getElementById('headerAvatar');
  if (el) el.textContent = state.profile.emoji || '👤';
}

function applyTheme(theme) {
  document.body.classList.toggle('light', theme === 'light');
  var btn = document.getElementById('themeBtn');
  if (btn) btn.textContent = theme === 'light' ? '☀️' : '🌙';
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', theme === 'light' ? '#f5f5fa' : '#000000');
}

function toggleTheme() {
  state.settings.theme = state.settings.theme === 'light' ? 'dark' : 'light';
  applyTheme(state.settings.theme);
  save();
  haptic('light');
  if (currentPage === 'settings') renderSettings();
}

function showWelcome() {
  var overlay = document.createElement('div');
  overlay.className = 'welcome-screen';
  overlay.innerHTML = 
    '<div class="welcome-logo">🧠</div>' +
    '<div class="welcome-title">AI Health</div>' +
    '<div class="welcome-sub">Экосистема: коуч + врач + психолог с 80-летним опытом. Пути развития, курсы, трекинг, матрица Эйзенхауэра.</div>' +
    '<input type="text" class="welcome-input" id="welcome-name" placeholder="Как тебя зовут?" maxlength="30"/>' +
    '<button class="btn btn-primary btn-block mt-4" style="max-width:340px;margin-top:16px;" onclick="finishWelcome()">Начать</button>';
  document.body.appendChild(overlay);
  setTimeout(function() {
    var inp = document.getElementById('welcome-name');
    if (inp) inp.focus();
  }, 300);
}

function finishWelcome() {
  var inp = document.getElementById('welcome-name');
  var name = inp ? inp.value.trim() : '';
  if (!name) return toast('Введите имя', 'error');
  state.profile.name = name;
  state.settings.onboardingDone = true;
  save();
  var w = document.querySelector('.welcome-screen');
  if (w) {
    w.style.opacity = '0';
    w.style.transition = 'opacity 0.4s';
    setTimeout(function() { w.remove(); }, 400);
  }
  haptic('success');
  toast('Добро пожаловать, ' + name + '!', 'success');
  renderTabBar();
  renderDashboard();
  updateHeaderAvatar();
}

function init() {
  try {
    applyTheme(state.settings.theme);
    updateHeaderAvatar();
    
    if (!state.profile.name && !state.settings.onboardingDone) {
      showWelcome();
      return;
    }
    
    if (state.profile.name && !state.settings.onboardingDone) {
      state.settings.onboardingDone = true;
      save();
    }
    
    if (!state.profile.name && window.__tgName) {
      state.profile.name = window.__tgName;
      save();
    }
    
    if (state.tasks.length === 0) {
      state.tasks = [
        { id: uid(), title: 'Завершить отчёт', category: 'Работа', planned_time: 45, actual_time: 0, status: 'pending', priority: 'high', created_at: nowISO(), due_date: new Date(Date.now() + 24*60*60*1000).toISOString() },
        { id: uid(), title: 'Повторить 10 слов', category: 'Обучение', planned_time: 15, actual_time: 0, status: 'pending', priority: 'medium', created_at: nowISO() },
        { id: uid(), title: 'Позвонить маме', category: 'Личное', planned_time: 10, actual_time: 0, status: 'pending', priority: 'high', created_at: nowISO() }
      ];
      save();
    }
    
    renderTabBar();
    renderDashboard();
    
    var t = today();
    if (state.stats.lastActiveDay !== t) {
      var y = new Date();
      y.setDate(y.getDate() - 1);
      state.stats.streak = state.stats.lastActiveDay === y.toISOString().slice(0, 10)
        ? (state.stats.streak || 0) + 1
        : 1;
      state.stats.lastActiveDay = t;
      state.stats.totalDays = (state.stats.totalDays || 0) + 1;
      save();
    }
    
    checkAchievements();
  } catch(e) {
    console.error('Init error:', e);
    var app = document.getElementById('app');
    if (app) app.innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-title">Ошибка загрузки</div><div class="empty-text">' + esc(e.message) + '</div></div>';
  }
}

function attachRipple() {
  document.addEventListener('pointerdown', function(e) {
    var target = e.target.closest('.btn, .list-row, .chip, .tab-item, .task-item, .card, .icon-btn, .avatar-btn, .persona-item, .segmented-item, .stat-item, .achieve-item, .emoji-pick, .path-step, .matrix-quadrant, .course-card, .lesson-row');
    if (!target) return;
    target.classList.add('tap-ripple');
    var rect = target.getBoundingClientRect();
    var x = ((e.clientX - rect.left) / rect.width) * 100;
    var y = ((e.clientY - rect.top) / rect.height) * 100;
    target.style.setProperty('--rx', x + '%');
    target.style.setProperty('--ry', y + '%');
    target.classList.remove('rippling');
    void target.offsetWidth;
    target.classList.add('rippling');
    setTimeout(function() { target.classList.remove('rippling'); }, 700);
  }, { passive: true });
}
