.page{animation:pageIn .55s var(--spring-snap) both}

function checkLevelComplete(s,levelId){var level=LEARNING_LEVELS.find(function(l){return l.id===levelId});if(!level)return false;for(var m=0;m<level.modules.length;m++){var mod=level.modules[m];for(var l=0;l<mod.lessons.length;l++){var key=levelId+'_'+mod.id+'_'+l;if(!s.levelProgress||!s.levelProgress[key])return false}}return true}

function checkAchievements(){var unlocked=state.profile.achievements||[];var newOnes=[];for(var i=0;i<ACHIEVEMENTS.length;i++){var a=ACHIEVEMENTS[i];if(unlocked.indexOf(a.id)<0&&a.check(state)){unlocked.push(a.id);newOnes.push(a)}}state.profile.achievements=unlocked;if(newOnes.length){save();newOnes.forEach(function(a,idx){setTimeout(function(){toast('🏆 '+a.name,'success',3500);haptic('success')},idx*800)})}}

function getLevelProgress(levelId){var level=LEARNING_LEVELS.find(function(l){return l.id===levelId});if(!level)return{done:0,total:0,pct:0};var total=0,done=0;level.modules.forEach(function(mod){mod.lessons.forEach(function(l,idx){total++;if(state.levelProgress&&state.levelProgress[levelId+'_'+mod.id+'_'+idx])done++})});return{done:done,total:total,pct:total>0?Math.round(done/total*100):0}}
function isLevelUnlocked(levelId){var idx=LEARNING_LEVELS.findIndex(function(l){return l.id===levelId});if(idx<=0)return true;var prev=LEARNING_LEVELS[idx-1];return getLevelProgress(prev.id).pct===100}
function isModuleUnlocked(level,moduleIdx){if(moduleIdx===0)return true;var prevMod=level.modules[moduleIdx-1];return prevMod.lessons.every(function(l,idx){return state.levelProgress[level.id+'_'+prevMod.id+'_'+idx]})}
function isLessonUnlocked(level,module,lessonIdx){if(lessonIdx===0)return true;var key=level.id+'_'+module.id+'_'+(lessonIdx-1);return !!state.levelProgress[key]}

function renderLearning(){var totalDone=0,totalLessons=0;LEARNING_LEVELS.forEach(function(level){var p=getLevelProgress(level.id);totalDone+=p.done;totalLessons+=p.total});var overallPct=totalLessons?Math.round(totalDone/totalLessons*100):0;var html='<div class="page"><div class="title-xl">Обучение</div>';html+='<div class="card card-gradient"><div style="opacity:.9;font-size:13px;margin-bottom:6px;">Общий прогресс</div><div style="font-size:44px;font-weight:800;line-height:1;margin-bottom:12px;">'+overallPct+'%</div><div style="opacity:.9;font-size:13px;">'+totalDone+' из '+totalLessons+'</div><div class="progress" style="margin-top:14px;background:rgba(255,255,255,.25);height:8px;"><div class="progress-fill" style="width:'+overallPct+'%;background:#fff;"></div></div></div>';LEARNING_LEVELS.forEach(function(level){var p=getLevelProgress(level.id);var unlocked=isLevelUnlocked(level.id);var completed=p.pct===100;var cls='level-card';if(completed)cls+=' completed';else if(!unlocked)cls+=' locked';else if(p.pct>0)cls+=' active';html+='<div class="'+cls+'" onclick="'+(unlocked?'openLevel(\''+level.id+'\')':'toast(\'Заверши предыдущий\',\'warning\')')+'"><div class="level-header"><div class="level-num">'+(completed?'✓':level.num)+'</div><div class="level-info"><div class="level-title">'+level.emoji+' '+level.title+'</div><div class="level-subtitle">'+level.subtitle+'</div><div class="level-meta"><span>'+level.modules.length+' модулей</span></div></div></div><div class="level-desc">'+level.desc+'</div>';if(unlocked&&p.pct>0)html+='<div class="progress"><div class="progress-fill" style="width:'+p.pct+'%;"></div></div>';html+='</div>'});html+='</div>';document.getElementById('app').innerHTML=html}

function renderLevelDetail(){var level=LEARNING_LEVELS.find(function(l){return l.id===currentLevelId});if(!level){navigate('learning');return}var p=getLevelProgress(level.id);var html='<div class="page">';html+='<button class="btn btn-ghost btn-sm" onclick="navigate(\'learning\')" style="margin-bottom:16px;">← Все уровни</button>';html+='<div style="text-align:center;margin-bottom:24px;"><div style="font-size:64px;margin-bottom:12px;">'+level.emoji+'</div><div class="title-xl" style="margin-bottom:8px;">Уровень '+level.num+': '+level.title+'</div><div class="footnote text-secondary" style="max-width:340px;margin:0 auto;">'+level.desc+'</div></div>';html+='<div class="card"><div class="row-between mb-2"><span class="subhead">Прогресс</span><span class="subhead text-secondary">'+p.done+'/'+p.total+'</span></div><div class="progress"><div class="progress-fill" style="width:'+p.pct+'%;"></div></div></div>';html+='<div class="card"><h2>📦 Модули</h2>';level.modules.forEach(function(mod,i){var unlocked=isModuleUnlocked(level,i);var modDone=mod.lessons.every(function(l,idx){return state.levelProgress[level.id+'_'+mod.id+'_'+idx]});var modCount=mod.lessons.filter(function(l,idx){return state.levelProgress[level.id+'_'+mod.id+'_'+idx]}).length;var cls='module-card';if(modDone)cls+=' completed';else if(!unlocked)cls+=' locked';html+='<div class="'+cls+'" onclick="'+(unlocked?'openModule(\''+level.id+'\',\''+mod.id+'\')':'toast(\'Сначала предыдущий\',\'warning\')')+'"><div class="module-header"><div class="module-icon">'+(modDone?'✓':mod.emoji)+'</div><div class="module-info"><div class="module-title">'+mod.title+'</div><div class="module-meta">'+modCount+'/'+mod.lessons.length+' уроков'+(unlocked?'':' · 🔒')+'</div></div></div><div class="module-desc">'+mod.desc+'</div></div>'});html+='</div></div>';document.getElementById('app').innerHTML=html}

function openLesson(idx){currentLessonIdx=idx;var level=LEARNING_LEVELS.find(function(l){return l.id===currentLevelId});if(!level)return;var module=level.modules.find(function(m){return m.id===currentModuleId});if(!module)return;var lesson=module.lessons[idx];if(!lesson)return;var key=level.id+'_'+module.id+'_'+idx;var isDone=!!state.levelProgress[key];var html='<div class="page">';html+='<button class="btn btn-ghost btn-sm" onclick="navigate(\'moduleDetail\')" style="margin-bottom:16px;">← К урокам</button>';html+='<div style="margin-bottom:20px;"><div class="footnote text-tertiary" style="margin-bottom:8px;">Уровень '+level.num+' · '+module.title+' · Урок '+(idx+1)+'/'+module.lessons.length+'</div><div style="font-size:26px;font-weight:800;line-height:1.2;">'+lesson.title+'</div></div>';html+='<div class="card" style="padding:20px;">';html+='<div class="lesson-section"><div class="lesson-section-title">📚 Теория</div><div class="lesson-content">'+formatLesson(lesson.theory)+'</div></div>';html+='<div class="lesson-section practice"><div class="lesson-section-title">🎯 Практика</div><div class="lesson-content">'+esc(lesson.practice)+'</div></div>';html+='<div class="lesson-section reflection"><div class="lesson-section-title">💭 Рефлексия</div><div class="lesson-content">'+esc(lesson.reflection)+'</div></div></div>';if(!isDone){html+='<button class="btn btn-primary btn-block" onclick="completeLesson()">✓ Изучено</button>'}else{html+='<div class="badge badge-success" style="display:block;text-align:center;padding:14px;font-size:14px;">✓ Урок изучен</div>';if(idx<module.lessons.length-1){html+='<button class="btn btn-primary btn-block mt-3" onclick="openLesson('+(idx+1)+')">Следующий →</button>'}else{html+='<button class="btn btn-success btn-block mt-3" onclick="navigate(\'moduleDetail\')">Модуль завершён ✓</button>'}}html+='</div>';document.getElementById('app').innerHTML=html;window.scrollTo({top:0})}

function formatLesson(text){var h=esc(text);h=h.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');h=h.replace(/^• (.+)$/gm,'<li>$1</li>');h=h.replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g,'<ul>$1</ul>');h=h.replace(/\n\n/g,'</p><p>');h=h.replace(/\n/g,'<br>');return '<p>'+h+'</p>'}

function renderPathDetail(){var p=PATHS_LIBRARY.find(function(x){return x.id===currentPathId});if(!p){navigate('paths');return}var userPath=state.paths.find(function(x){return x.id===p.id});if(!userPath){userPath={id:p.id,completedSteps:[],startedAt:nowISO()};state.paths.push(userPath);save()}var completed=userPath.completedSteps||[];var progress=Math.round(completed.length/p.steps.length*100);var html='<div class="page">';html+='<button class="btn btn-ghost btn-sm" onclick="navigate(\'paths\')" style="margin-bottom:16px;">← Все пути</button>';html+='<div style="text-align:center;margin-bottom:24px;"><div style="font-size:64px;margin-bottom:12px;">'+p.emoji+'</div><div class="title-xl" style="margin-bottom:8px;">'+p.title+'</div></div>';html+='<div class="card"><div class="row-between mb-2"><span class="subhead">Прогресс</span><span class="subhead text-secondary">'+progress+'%</span></div><div class="progress"><div class="progress-fill" style="width:'+progress+'%;"></div></div></div>';html+='<div class="card"><h2>Шаги</h2>';p.steps.forEach(function(step,i){var isDone=completed.indexOf(i)>=0;var isActive=!isDone&&(i===0||completed.indexOf(i-1)>=0);var isLocked=!isDone&&!isActive;var cls='path-step';if(isDone)cls+=' completed';else if(isActive)cls+=' active';else if(isLocked)cls+=' locked';html+='<div class="'+cls+'" onclick="'+(isLocked?'':'openStep('+i+')')+'"><div class="path-step-num">'+(isDone?'✓':(i+1))+'</div><div class="path-step-body"><div class="path-step-title">'+step.title+'</div><div class="path-step-desc">'+(isDone||isActive?step.desc:'🔒 Откроется')+'</div></div></div>'});html+='</div></div>';document.getElementById('app').innerHTML=html}

function openStep(idx){var p=PATHS_LIBRARY.find(function(x){return x.id===currentPathId});if(!p)return;var step=p.steps[idx];if(!step)return;var userPath=state.paths.find(function(x){return x.id===p.id});var isDone=userPath&&(userPath.completedSteps||[]).indexOf(idx)>=0;var html='<div style="text-align:center;margin-bottom:20px;"><div style="font-size:42px;margin-bottom:8px;">'+(isDone?'✅':'🔓')+'</div><div class="footnote text-secondary">Шаг '+(idx+1)+' из '+p.steps.length+'</div></div>';html+='<div class="card" style="margin-bottom:14px;"><h2>📋 Задача</h2><div style="font-size:15px;line-height:1.6;">'+step.desc+'</div></div>';html+='<div class="insight-card"><div class="insight-title">💎 Секрет</div><div class="insight-text">'+step.secret+'</div></div>';if(!isDone){html+='<button class="btn btn-primary btn-block mt-4" onclick="completeStep('+idx+')">✓ Отметить</button>'}else{html+='<div class="badge badge-success" style="display:block;text-align:center;padding:12px;">✓ Выполнено</div>'}openSheet(step.title,html)}

function completeStep(idx){var userPath=state.paths.find(function(x){return x.id===currentPathId});if(!userPath)return;if(!userPath.completedSteps)userPath.completedSteps=[];if(userPath.completedSteps.indexOf(idx)<0){userPath.completedSteps.push(idx);save();toast('✓ Шаг выполнен!','success');haptic('success');checkAchievements();closeSheet();renderPathDetail()}}

function completeCourseLesson(courseId,idx){var userCourse=state.courses.find(function(x){return x.id===courseId});if(!userCourse)return;if(!userCourse.completedLessons)userCourse.completedLessons=[];if(userCourse.completedLessons.indexOf(idx)<0){userCourse.completedLessons.push(idx);save();toast('✓ Урок изучен!','success');haptic('success');checkAchievements();closeSheet();openCourse(courseId)}}

/* ДОМЕНЫ */
function getAverageDomainScore(domainId){var history=state.domainHistory||{};var dates=Object.keys(history).slice(-7);if(dates.length===0)return 5;var sum=0,count=0;dates.forEach(function(d){if(history[d]&&history[d][domainId]!==undefined){sum+=history[d][domainId];count++}});return count>0?Math.round(sum/count*10)/10:5}

function renderDomains(){var html='<div class="page"><div class="title-xl">9 доменов</div><div class="footnote text-secondary" style="margin-bottom:16px;">Оцени 1-10. План строится автоматически.</div>';var todayScores=(state.domainScores||{})[today()]||{};var totalScore=0,count=0;DOMAINS.forEach(function(d){if(todayScores[d.id]){totalScore+=todayScores[d.id];count++}});var avg=count>0?Math.round(totalScore/count*10)/10:0;html+='<div class="card card-gradient"><div style="opacity:.9;font-size:13px;margin-bottom:6px;">Средний балл</div><div style="font-size:44px;font-weight:800;line-height:1;">'+avg+'/10</div><div style="opacity:.9;font-size:13px;margin-top:8px;">'+count+' из 9 оценено</div></div>';DOMAINS.forEach(function(d){var score=todayScores[d.id]||0;var pct=score*10;var avgScore=getAverageDomainScore(d.id);html+='<div class="domain-card" onclick="openDomain(\''+d.id+'\')"><div class="domain-header"><div class="domain-icon" style="background:'+d.color+'20;color:'+d.color+';">'+d.emoji+'</div><div style="flex:1;min-width:0;"><div class="domain-title">'+d.name+'</div><div class="domain-score">'+(score>0?'Сегодня: '+score+'/10':'Не оценено')+(avgScore>0?' · Среднее: '+avgScore:'')+'</div></div><div class="list-chevron">›</div></div><div class="domain-bar"><div class="domain-bar-fill" style="width:'+pct+'%;background:'+d.color+';"></div></div></div>'});html+='</div>';document.getElementById('app').innerHTML=html}

function openDomain(domainId){var d=DOMAINS.find(function(x){return x.id===domainId});if(!d)return;var todayScores=(state.domainScores||{})[today()]||{};var score=todayScores[domainId]||5;var html='<div style="text-align:center;margin-bottom:20px;"><div style="font-size:56px;margin-bottom:12px;">'+d.emoji+'</div><div style="font-size:22px;font-weight:800;margin-bottom:6px;">'+d.name+'</div><div class="footnote text-secondary">'+d.desc+'</div></div>';html+='<div class="card"><h2>Оцени сегодня</h2><div style="text-align:center;padding:16px 0;"><div style="font-size:48px;font-weight:800;color:'+d.color+';" id="domainScoreDisplay">'+score+'</div><div class="footnote text-secondary">из 10</div></div><input type="range" min="1" max="10" value="'+score+'" style="width:100%;margin:12px 0;" oninput="document.getElementById(\'domainScoreDisplay\').textContent=this.value;" id="domainScoreRange"/><button class="btn btn-primary btn-block" onclick="saveDomainScore(\''+domainId+'\')">Сохранить</button></div>';html+='<div class="card"><h2>📊 Метрики</h2>';d.metrics.forEach(function(m){var todayMetrics=(state.metrics||{})[today()]||{};var val=todayMetrics[m.id]||'—';html+='<div class="metric-row"><div><div class="metric-label">'+m.label+'</div><div class="metric-target">Цель: '+m.target+'</div></div><div class="metric-value">'+val+'</div></div>'});html+='</div>';openSheet(d.name,html)}

function saveDomainScore(domainId){var range=document.getElementById('domainScoreRange');if(!range)return;var score=parseInt(range.value);var t=today();if(!state.domainScores)state.domainScores={};if(!state.domainScores[t])state.domainScores[t]={};state.domainScores[t][domainId]=score;if(!state.domainHistory)state.domainHistory={};if(!state.domainHistory[t])state.domainHistory[t]={};state.domainHistory[t][domainId]=score;save();toast('✓ Сохранено','success');haptic('success');closeSheet();renderDomains()}

function renderMetrics(){var html='<div class="page"><div class="title-xl">Метрики</div><div class="footnote text-secondary" style="margin-bottom:16px;">Все показатели за сегодня.</div>';var todayMetrics=(state.metrics||{})[today()]||{};DOMAINS.forEach(function(d){html+='<div class="metric-card"><div class="metric-card-title">'+d.emoji+' '+d.name+'</div>';d.metrics.forEach(function(m){var val=todayMetrics[m.id]||'';html+='<div class="metric-input-row"><label>'+m.label+'</label><input type="text" id="m_'+m.id+'" value="'+esc(val)+'" placeholder="'+m.target+'"/></div>'});html+='</div>'});html+='<button class="btn btn-primary btn-block" onclick="saveMetrics()">💾 Сохранить</button></div>';document.getElementById('app').innerHTML=html}

function saveMetrics(){var t=today();if(!state.metrics)state.metrics={};if(!state.metrics[t])state.metrics[t]={};DOMAINS.forEach(function(d){d.metrics.forEach(function(m){var el=document.getElementById('m_'+m.id);if(el&&el.value)state.metrics[t][m.id]=el.value})});save();toast('💾 Сохранено','success');haptic('success')}

/* DASHBOARD */
function renderDashboard(){var todayTasks=state.tasks.filter(function(t){return t.created_at&&t.created_at.slice(0,10)===today()});var doneToday=todayTasks.filter(function(t){return t.status==='completed'}).length;var hour=new Date().getHours();var greet=hour<6?'Доброй ночи':hour<12?'Доброе утро':hour<18?'Добрый день':'Добрый вечер';var progress=todayTasks.length?Math.round(doneToday/todayTasks.length*100):0;var userName=state.profile.name?', '+state.profile.name:'';var totalDone=0,totalLessons=0;LEARNING_LEVELS.forEach(function(level){var p=getLevelProgress(level.id);totalDone+=p.done;totalLessons+=p.total});var overallPct=totalLessons?Math.round(totalDone/totalLessons*100):0;var currentLevel=LEARNING_LEVELS.find(function(l){var p=getLevelProgress(l.id);return p.pct>0&&p.pct<100&&isLevelUnlocked(l.id)})||LEARNING_LEVELS[0];var todayScores=(state.domainScores||{})[today()]||{};var avgDomain=0,countDomains=0;DOMAINS.forEach(function(d){if(todayScores[d.id]){avgDomain+=todayScores[d.id];countDomains++}});avgDomain=countDomains>0?Math.round(avgDomain/countDomains*10)/10:0;var html='<div class="page"><div class="title-xl">'+greet+userName+'</div>';html+='<div class="card card-gradient"><div class="row-between" style="margin-bottom:14px;"><div><div style="font-size:13px;opacity:.85;font-weight:600;margin-bottom:6px;">Прогресс дня</div><div style="font-size:40px;font-weight:800;line-height:1;">'+doneToday+'/'+todayTasks.length+'</div></div><div style="font-size:48px;font-weight:800;">'+progress+'%</div></div><div class="progress" style="background:rgba(255,255,255,.25);height:8px;"><div class="progress-fill" style="width:'+progress+'%;background:#fff;"></div></div></div>';html+='<div class="stat-grid mb-4"><div class="stat-item"><div class="stat-value">'+(state.stats.streak||0)+'</div><div class="stat-label">Streak</div></div><div class="stat-item"><div class="stat-value">'+overallPct+'%</div><div class="stat-label">Обучение</div></div><div class="stat-item"><div class="stat-value">'+(avgDomain||'—')+'</div><div class="stat-label">Домены</div></div></div>';html+='<div class="card" style="background:linear-gradient(135deg,rgba(167,139,250,.15),rgba(91,158,255,.1));border-color:rgba(167,139,250,.3);"><h2>🎓 Обучение</h2><div class="footnote text-secondary" style="margin-bottom:12px;">Сейчас: <strong>'+currentLevel.emoji+' Уровень '+currentLevel.num+'</strong></div><button class="btn btn-primary btn-block" onclick="'+(isLevelUnlocked(currentLevel.id)?'openLevel(\''+currentLevel.id+'\')':'navigate(\'learning\')')+'">Продолжить</button></div>';if(!state.profile.surveyDone){html+='<div class="card" style="background:linear-gradient(135deg,rgba(255,169,64,.15),rgba(255,107,107,.1));border-color:rgba(255,169,64,.3);"><h2>📋 Заполни профиль</h2><div class="footnote text-secondary" style="margin-bottom:12px;">25 вопросов → персональный план</div><button class="btn btn-primary btn-block" onclick="startSurvey()">Начать опрос</button></div>'}else{html+='<div class="card" style="background:linear-gradient(135deg,rgba(61,220,151,.15),rgba(91,158,255,.1));border-color:rgba(61,220,151,.3);"><h2>🎯 Персональный план</h2><button class="btn btn-primary btn-block" onclick="navigate(\'plan\')">Открыть</button></div>'}html+='<div class="insight-card"><div class="insight-title">💎 Мудрость дня</div><div class="insight-text">"Ты не ленивый. Ты либо устал, либо не видишь смысла, либо боишься."</div></div>';html+='<div class="card"><h2>⚡ Быстрые действия</h2><div class="btn-row"><button class="btn btn-ghost btn-sm" onclick="navigate(\'domains\')">🌐 Домены</button><button class="btn btn-ghost btn-sm" onclick="addTask()">➕ Задача</button><button class="btn btn-ghost btn-sm" onclick="navigate(\'matrix\')">🔢 Матрица</button><button class="btn btn-ghost btn-sm" onclick="navigate(\'integrations\')">🔗 Интеграции</button></div></div>';html+='<div class="card"><h2>📋 Задачи</h2>';var pending=state.tasks.filter(function(t){return t.status==='pending'}).slice(0,5);if(pending.length){pending.forEach(function(t){html+=taskRow(t)})}else{html+='<div class="empty"><div class="empty-icon">✨</div><div class="empty-title">Всё выполнено</div></div>'}html+='</div></div>';document.getElementById('app').innerHTML=html}

function taskRow(t){var pColors={high:'high',medium:'medium',low:'low'};var checked=t.status==='completed';return '<div class="task-item '+(checked?'completed':'')+'" onclick="editTask(\''+t.id+'\')"><div class="priority-bar '+(pColors[t.priority]||'medium')+'"></div><button class="task-checkbox '+(checked?'checked':'')+'" onclick="event.stopPropagation();toggleTask(\''+t.id+'\')">'+(checked?'✓':'')+'</button><div class="task-content"><div class="task-title">'+esc(t.title)+'</div><div class="task-meta"><span>'+(t.planned_time||0)+' мин</span>'+(t.category?'<span>· '+esc(t.category)+'</span>':'')+'</div></div></div>'}

/* TASKS */
var taskFilter='all';var taskSearch='';
function renderTasks(){var counts={all:state.tasks.length,pending:state.tasks.filter(function(t){return t.status==='pending'}).length,completed:state.tasks.filter(function(t){return t.status==='completed'}).length};var filtered=state.tasks.slice();if(taskFilter!=='all')filtered=filtered.filter(function(t){return t.status===taskFilter});if(taskSearch){var q=taskSearch.toLowerCase();filtered=filtered.filter(function(t){return t.title.toLowerCase().indexOf(q)>=0})}var html='<div class="page"><div class="row-between" style="margin-bottom:20px;"><div class="title-xl" style="margin:0;">Задачи</div><button class="btn btn-primary btn-sm" onclick="addTask()">+ Новая</button></div>';html+='<div class="search-bar"><span style="color:var(--text-3);font-size:18px;">🔍</span><input type="search" placeholder="Поиск..." value="'+esc(taskSearch)+'" oninput="taskSearch=this.value;renderTasks()"/></div>';html+='<div class="segmented" style="margin-bottom:18px;"><button class="segmented-item '+(taskFilter==='all'?'active':'')+'" onclick="taskFilter=\'all\';renderTasks()">Все ('+counts.all+')</button><button class="segmented-item '+(taskFilter==='pending'?'active':'')+'" onclick="taskFilter=\'pending\';renderTasks()">Активные ('+counts.pending+')</button><button class="segmented-item '+(taskFilter==='completed'?'active':'')+'" onclick="taskFilter=\'completed\';renderTasks()">Готовые ('+counts.completed+')</button></div>';if(filtered.length){filtered.forEach(function(t){html+=taskRow(t)})}else{html+='<div class="empty"><div class="empty-icon">📋</div><div class="empty-title">'+(taskSearch?'Ничего':'Нет задач')+'</div></div>'}html+='</div>';document.getElementById('app').innerHTML=html}

function addTask(){openSheet('Новая задача','<div class="field"><input type="text" id="t-title" placeholder="Название" autofocus/></div><div class="row" style="gap:8px;"><div style="flex:1;"><label class="field-label">Время</label><input type="number" id="t-time" value="30" min="5" step="5"/></div><div style="flex:1;"><label class="field-label">Приоритет</label><select id="t-priority"><option value="low">🟢</option><option value="medium" selected>🟡</option><option value="high">🔴</option></select></div></div><button class="btn btn-primary btn-block mt-3" onclick="saveTask()">Добавить</button>');setTimeout(function(){var el=document.getElementById('t-title');if(el)el.focus()},100)}

function saveTask(){var title=((document.getElementById('t-title')||{}).value||'').trim();if(!title)return toast('Введите название','error');state.tasks.unshift({id:uid(),title:title,planned_time:parseInt((document.getElementById('t-time')||{}).value)||30,actual_time:0,status:'pending',priority:(document.getElementById('t-priority')||{}).value||'medium',category:'Работа',created_at:nowISO()});save();closeSheet();toast('Задача добавлена','success');haptic('success');checkAchievements();if(currentPage==='tasks')renderTasks();else renderDashboard()}

function toggleTask(id){var t=state.tasks.find(function(x){return x.id===id});if(!t)return;t.status=t.status==='completed'?'pending':'completed';t.actual_time=t.status==='completed'?(t.planned_time||0):0;save();haptic('success');if(t.status==='completed')toast('✓ Выполнено','success');checkAchievements();if(currentPage==='tasks')renderTasks();else renderDashboard()}

function editTask(id){var t=state.tasks.find(function(x){return x.id===id});if(!t)return;openSheet('Редактировать','<div class="field"><input type="text" id="e-title" value="'+esc(t.title)+'"/></div><button class="btn btn-primary btn-block" onclick="updateTask(\''+id+'\')">Сохранить</button><button class="btn btn-danger btn-block mt-2" onclick="deleteTask(\''+id+'\')">Удалить</button>')}

/* AI */
function renderAI(){var active=state.settings.activePersona||'coach';var persona=PERSONAS[active]||PERSONAS.coach;var messages=state.chats.filter(function(c){return c.persona===active});var hasKey=!!(state.settings.apiKey||(state.integrations.gemini&&state.integrations.gemini.apiKey));var html='<div class="page"><div class="title-xl">AI</div><div class="persona-bar">';Object.keys(PERSONAS).forEach(function(k){var p=PERSONAS[k];html+='<button class="persona-item '+(active===k?'active':'')+'" data-p="'+k+'" onclick="switchPersona(\''+k+'\')">'+p.name+'</button>'});html+='</div>';html+='<div class="card" style="padding:16px 18px;"><div class="row-between"><div class="row" style="gap:12px;"><div style="font-size:28px;">'+persona.emoji+'</div><div><div style="font-weight:700;font-size:16px;">'+persona.name+'</div><div class="caption text-tertiary">'+persona.label+(hasKey?'':' · Demo')+'</div></div></div><button class="btn btn-ghost btn-sm" onclick="openAISettings()">⚙️</button></div></div>';html+='<div class="card" style="min-height:360px;max-height:62vh;overflow-y:auto;padding:18px;" id="chatBox"><div class="chat">';if(messages.length){messages.forEach(function(m){html+='<div class="msg msg-'+(m.role==='user'?'user':'bot')+'">'+(m.role==='user'?esc(m.text):renderMd(m.text))+'</div>'})}else{html+='<div class="empty"><div class="empty-icon">'+persona.emoji+'</div><div class="empty-title">'+persona.name+'</div><div class="empty-text">Задай вопрос</div></div>'}html+='</div></div>';html+='<div class="row" style="margin-top:14px;"><input type="text" id="chatInput" placeholder="Сообщение..." style="flex:1;" onkeydown="if(event.key===\'Enter\'){event.preventDefault();sendMsg();}"/><button class="btn btn-primary btn-icon" onclick="sendMsg()">➤</button></div></div>';document.getElementById('app').innerHTML=html;var box=document.getElementById('chatBox');if(box)box.scrollTop=box.scrollHeight}

function switchPersona(p){state.settings.activePersona=p;save();renderAI()}

async function sendMsg(){var input=document.getElementById('chatInput');if(!input)return;var text=input.value.trim();if(!text)return;input.value='';input.disabled=true;var persona=state.settings.activePersona||'coach';state.chats.push({id:uid(),persona:persona,role:'user',text:text,timestamp:nowISO()});save();renderAI();var box=document.getElementById('chatBox');var typing=document.createElement('div');typing.className='typing';typing.innerHTML='<span></span><span></span><span></span>';if(box){box.appendChild(typing);box.scrollTop=box.scrollHeight}var reply=await callAI(persona,text);if(typing)typing.remove();state.chats.push({id:uid(),persona:persona,role:'coach',text:reply,timestamp:nowISO()});save();checkAchievements();renderAI()}

async function callAI(persona,userText){var key=state.settings.apiKey||(state.integrations.gemini&&state.integrations.gemini.apiKey);var provider=state.settings.provider||'gemini';if(!key)return fallbackReply(persona,userText);var p=PERSONAS[persona];var history=state.chats.filter(function(c){return c.persona===persona}).slice(-10);var messages=[{role:'system',content:p.prompt}];history.forEach(function(m){messages.push({role:m.role==='user'?'user':'assistant',content:m.text})});try{if(provider==='openai'){var resp=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model:'gpt-4o-mini',messages:messages,temperature:.8,max_tokens:800})});var data=await resp.json();return (data.choices&&data.choices[0]&&data.choices[0].message&&data.choices[0].message.content)||fallbackReply(persona,userText)}else{var sys=p.prompt;var rest=history.map(function(m){return{role:m.role==='user'?'user':'model',parts:[{text:m.text}]}});var model=(state.integrations.gemini&&state.integrations.gemini.model)||'gemini-1.5-flash';var resp3=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent?key='+key,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({system_instruction:{parts:[{text:sys}]},contents:rest})});var data3=await resp3.json();return (data3.candidates&&data3.candidates[0]&&data3.candidates[0].content&&data3.candidates[0].content.parts&&data3.candidates[0].content.parts[0]&&data3.candidates[0].content.parts[0].text)||fallbackReply(persona,userText)}}catch(e){console.error(e);return fallbackReply(persona,userText)}}

function fallbackReply(persona,text){text=text||'';if(/суицид|покончить|не хочу жить|умереть/i.test(text)){return '🆘 Позвони: 8-800-2000-122 (РФ) · 103 · findahelpline.com. Ты важен.'}if(persona==='doctor')return 'Я — AI-консультант. Опиши симптомы.\n\n*⚠️ Не заменяет врача.*';if(persona==='psych')return 'Слышу тебя. Что происходит?';return 'Слышу тебя. Расскажи подробнее.'}

function renderMd(text){if(!text)return '';var h=esc(text);h=h.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');h=h.replace(/^[•\-] (.+)$/gm,'<li>$1</li>');h=h.replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g,'<ul>$1</ul>');h=h.replace(/\n\n/g,'</p><p>');h=h.replace(/\n/g,'<br>');return '<p>'+h+'</p>'}

/* SURVEY */
function startSurvey(){state.profile.surveyStep=0;save();renderSurvey()}
function renderSurvey(){var step=state.profile.surveyStep||0;var q=SURVEY_QUESTIONS[step];if(!q){finishSurvey();return}var answers=state.profile.surveyAnswers||{};var html='<div class="welcome-screen" id="surveyScreen"><div class="survey-container"><div class="survey-progress">';for(var i=0;i<SURVEY_QUESTIONS.length;i++){var cls='survey-dot';if(i<step)cls+=' done';else if(i===step)cls+=' active';html+='<div class="'+cls+'"></div>'}html+='</div>';html+='<div class="survey-question">'+q.question+'</div>';if(q.hint)html+='<div class="survey-hint">'+q.hint+'</div>';if(q.type==='text'){html+='<input type="text" id="surveyInput" class="welcome-input" style="max-width:100%;text-align:left;font-size:16px !important;" placeholder="Напиши..." value="'+esc(answers[q.id]||'')+'"/><button class="btn btn-primary btn-block mt-3" onclick="saveSurveyAnswer()">Далее →</button>'}else if(q.type==='options'){q.options.forEach(function(opt){var sel=answers[q.id]===opt.value?' selected':'';html+='<div class="survey-option'+sel+'" onclick="selectSurveyOption(\''+q.id+'\',\''+opt.value+'\')"><span class="survey-option-emoji">'+opt.emoji+'</span><span class="survey-option-label">'+opt.label+'</span></div>'})}else if(q.type==='multi'){q.options.forEach(function(opt){var arr=answers[q.id]||[];var sel=arr.indexOf(opt.value)>=0?' selected':'';html+='<div class="survey-option'+sel+'" onclick="toggleSurveyMulti(\''+q.id+'\',\''+opt.value+'\')"><span class="survey-option-emoji">'+opt.emoji+'</span><span class="survey-option-label">'+opt.label+'</span></div>'});html+='<button class="btn btn-primary btn-block mt-3" onclick="nextSurveyStep()">Далее →</button>'}if(step>0){html+='<button class="btn btn-ghost btn-block mt-2" onclick="prevSurveyStep()">← Назад</button>'}html+='</div></div>';var existing=document.getElementById('surveyScreen');if(existing)existing.remove();document.body.insertAdjacentHTML('beforeend',html);setTimeout(function(){var inp=document.getElementById('surveyInput');if(inp)inp.focus()},200)}

function selectSurveyOption(qid,val){if(!state.profile.surveyAnswers)state.profile.surveyAnswers={};state.profile.surveyAnswers[qid]=val;save();haptic('light');nextSurveyStep()}
function toggleSurveyMulti(qid,val){if(!state.profile.surveyAnswers)state.profile.surveyAnswers={};var arr=state.profile.surveyAnswers[qid]||[];var idx=arr.indexOf(val);if(idx>=0)arr.splice(idx,1);else arr.push(val);state.profile.surveyAnswers[qid]=arr;save();haptic('light');renderSurvey()}
function saveSurveyAnswer(){var inp=document.getElementById('surveyInput');var val=inp?inp.value.trim():'';if(!val)return toast('Заполни поле','error');var q=SURVEY_QUESTIONS[state.profile.surveyStep];if(!state.profile.surveyAnswers)state.profile.surveyAnswers={};state.profile.surveyAnswers[q.id]=val;if(q.id==='name')state.profile.name=val;save();nextSurveyStep()}
function nextSurveyStep(){state.profile.surveyStep=(state.profile.surveyStep||0)+1;save();if(state.profile.surveyStep>=SURVEY_QUESTIONS.length)finishSurvey();else renderSurvey()}
function prevSurveyStep(){state.profile.surveyStep=Math.max(0,(state.profile.surveyStep||0)-1);save();renderSurvey()}

function finishSurvey(){var existing=document.getElementById('surveyScreen');if(existing)existing.remove();state.profile.surveyDone=true;state.profile.personalPlan=generatePlan(state.profile.surveyAnswers);save();haptic('success');toast('🎉 Профиль заполнен! План готов.','success',4000);checkAchievements();updateHeaderAvatar();navigate('plan')}

function generatePlan(answers){if(!answers)answers={};var plan={days:[],focusDomains:[],metrics:[]};if(answers.biggestChallenge){var challengeMap={procrastination:'physical',anxiety:'emotional',burnout:'emotional',sleep:'recovery',focus:'mental',energy:'physical',money:'financial',relationships:'social',meaning:'spiritual',discipline:'mental'};plan.focusDomains.push(challengeMap[answers.biggestChallenge]||'mental')}if(answers.mainGoal){var goalMap={health:'physical',productivity:'mental',mental:'emotional',career:'career',relationships:'social',meaning:'spiritual',discipline:'recovery'};if(plan.focusDomains.indexOf(goalMap[answers.mainGoal])<0)plan.focusDomains.push(goalMap[answers.mainGoal])}var morning=[];var wake=answers.wakeTime||'7-9';if(wake==='before-6')morning.push({time:'5:30',title:'Пробуждение',desc:'Вода + свет'});else morning.push({time:'7:30',title:'Пробуждение',desc:'Вода + свет'});morning.push({time:'+15 мин',title:'Дыхание 4-7-8',desc:'4 цикла'});morning.push({time:'+30 мин',title:'Движение',desc:'Прогулка 15 мин'});morning.push({time:'+1 ч',title:'Чтение',desc:'10 страниц'});morning.push({time:'+1.5 ч',title:'Deep Work',desc:'90 минут'});var day=[{time:'12:00',title:'Обед',desc:'Белок + овощи'},{time:'14:00',title:'Медитация',desc:'10 минут'},{time:'15:00',title:'Deep Work #2',desc:'50 минут'},{time:'17:00',title:'Прогулка',desc:'20 минут'}];var evening=[{time:'19:00',title:'Ужин',desc:'Легкий'},{time:'20:00',title:'Рефлексия',desc:'Дневник'},{time:'21:00',title:'Без экранов',desc:'Книга'},{time:'22:30',title:'Сон',desc:'18-20°C'}];plan.days=[{title:'🌅 Утро',items:morning},{title:'☀️ День',items:day},{title:'🌙 Вечер',items:evening}];DOMAINS.forEach(function(d){if(plan.focusDomains.indexOf(d.id)>=0){plan.metrics.push({domain:d.name,items:d.metrics.slice(0,3)})}});return plan}

function renderPersonalPlan(){var plan=state.profile.personalPlan;if(!plan){return placeholderPage('🎯','Персональный план','Пройди опросник в профиле')}var html='<div class="page"><div class="title-xl">Твой план</div>';html+='<div class="insight-card"><div class="insight-title">✨ Фокус</div><div class="insight-text">'+plan.focusDomains.map(function(d){var dom=DOMAINS.find(function(x){return x.id===d});return dom?dom.emoji+' '+dom.name:d}).join(', ')+'</div></div>';plan.days.forEach(function(block){html+='<div class="card"><h2>'+block.title+'</h2>';block.items.forEach(function(item){html+='<div class="plan-day"><div class="plan-time">'+item.time+'</div><div class="plan-title">'+item.title+'</div><div class="plan-desc">'+item.desc+'</div></div>'});html+='</div>'});if(plan.metrics.length){html+='<div class="card"><h2>📏 Метрики</h2>';plan.metrics.forEach(function(m){html+='<div class="footnote text-secondary" style="margin-bottom:8px;font-weight:700;">'+m.domain+'</div>';m.items.forEach(function(item){html+='<div class="metric-row"><span class="metric-label">'+item.label+'</span><span class="metric-value">'+item.target+'</span></div>'})});html+='</div>'}html+='<button class="btn btn-ghost btn-block" onclick="navigate(\'metrics\')">📏 Заполнить метрики</button></div>';document.getElementById('app').innerHTML=html}

/* PROFILE */
function renderProfile(){var p=state.profile;var unlocked=p.achievements||[];var doneTasks=state.tasks.filter(function(t){return t.status==='completed'}).length;var lessonsDone=Object.keys(state.levelProgress||{}).length;var html='<div class="page"><div class="profile-hero"><div class="profile-avatar" onclick="pickEmoji()">'+p.emoji+'</div><div class="profile-name">'+esc(p.name||'Пользователь')+'</div></div>';html+='<div class="stat-grid mb-4"><div class="stat-item"><div class="stat-value">'+doneTasks+'</div><div class="stat-label">Задач</div></div><div class="stat-item"><div class="stat-value">'+lessonsDone+'</div><div class="stat-label">Уроков</div></div><div class="stat-item"><div class="stat-value">'+(state.stats.streak||0)+'</div><div class="stat-label">Streak</div></div></div>';html+='<div class="card"><h2>✏️ Имя</h2><div class="field" style="margin-bottom:0;"><input type="text" id="profile-name" value="'+esc(p.name)+'" onchange="saveProfileName(this.value)"/></div></div>';if(!p.surveyDone){html+='<div class="card" style="background:linear-gradient(135deg,rgba(255,169,64,.15),rgba(255,107,107,.1));border-color:rgba(255,169,64,.3);"><h2>📋 Опросник</h2><button class="btn btn-primary btn-block" onclick="startSurvey()">Начать</button></div>'}else{html+='<div class="card"><h2>📋 Профиль заполнен</h2><button class="btn btn-ghost btn-block" onclick="if(confirm(\'Заново?\')){state.profile.surveyDone=false;state.profile.surveyStep=0;save();startSurvey();}">Пройти заново</button></div>'}html+='<div class="card"><h2>🏆 Достижения ('+unlocked.length+'/'+ACHIEVEMENTS.length+')</h2><div class="achieve-grid">';ACHIEVEMENTS.forEach(function(a){var isUnlocked=unlocked.indexOf(a.id)>=0;html+='<div class="achieve-item '+(isUnlocked?'unlocked':'locked')+'"><div class="achieve-icon">'+a.icon+'</div><div class="achieve-name">'+a.name+'</div></div>'});html+='</div></div></div>';document.getElementById('app').innerHTML=html}

function pickEmoji(){var emojis=['😊','😎','🤓','🧑‍💻','👨‍💼','👩‍💼','🦊','🐱','🐶','🦁','🐼','🦉','🌟','⚡','🔥','💎','🚀','🎯','🧠','💪','🌈','☕','🎨','🎮','🎧','📚','🏃','🧘','🍀','🌸'];var html='<div class="emoji-grid">';emojis.forEach(function(e){var sel=e===state.profile.emoji?' selected':'';html+='<button class="emoji-pick'+sel+'" onclick="setEmoji(\''+e+'\')">'+e+'</button>'});html+='</div>';openSheet('Аватар',html)}

function setEmoji(e){state.profile.emoji=e;save();closeSheet();toast('Обновлено','success');renderProfile();updateHeaderAvatar()}
function saveProfileName(name){state.profile.name=(name||'').trim()||'Пользователь';save();toast('Сохранено','success');updateHeaderAvatar()}
function updateHeaderAvatar(){var el=document.getElementById('headerAvatar');if(el)el.textContent=state.profile.emoji||'👤'}

/* SETTINGS */
function renderSettings(){var html='<div class="page"><div class="title-xl">Настройки</div>';html+='<div class="card"><h2>Профиль</h2><div class="field"><label class="field-label">Имя</label><input type="text" id="s-name" value="'+esc(state.profile.name)+'" onchange="saveProfileName(this.value)"/></div><div class="list-row" onclick="openThemePicker()"><div class="list-icon" style="background:var(--surface-3);">🎨</div><div class="list-body"><div class="list-title">Тема</div></div><div class="list-value">'+(THEMES.find(function(t){return t.id===state.settings.theme})||{}).name+'</div></div></div>';html+='<div class="card"><h2>AI</h2><div class="list-row" onclick="openAISettings()"><div class="list-icon" style="background:var(--brand);">✨</div><div class="list-body"><div class="list-title">'+state.settings.provider+'</div><div class="list-subtitle">'+(state.settings.apiKey?'Ключ установлен':'Не задан')+'</div></div><div class="list-chevron">›</div></div></div>';html+='<div class="card"><h2>Интеграции</h2><div class="list-row" onclick="navigate(\'integrations\')"><div class="list-icon" style="background:var(--surface-3);">🔗</div><div class="list-body"><div class="list-title">Google, Obsidian, Gemini</div></div><div class="list-chevron">›</div></div></div>';html+='<div class="card"><h2>Данные</h2><div class="list-row" onclick="navigate(\'dbmanager\')"><div class="list-icon" style="background:var(--coach);color:#000;">🗄</div><div class="list-body"><div class="list-title">База данных</div></div><div class="list-chevron">›</div></div></div>';html+='<div class="footnote text-tertiary" style="text-align:center;margin-top:36px;">AI Health v25</div></div>';document.getElementById('app').innerHTML=html}

function renderDBManager(){var total=state.tasks.length+state.chats.length+state.notes.length+Object.keys(state.levelProgress||{}).length;var html='<div class="page"><div class="title-xl">База данных</div><div class="card"><div class="list-row"><div class="list-icon" style="background:var(--success);color:#000;">✓</div><div class="list-body"><div class="list-title">LocalStorage</div><div class="list-subtitle">'+STORAGE_KEY+'</div></div></div><div class="list-row"><div class="list-icon" style="background:var(--brand);">📦</div><div class="list-body"><div class="list-title">Записей</div></div><div class="list-value">'+total+'</div></div></div>';html+='<div class="card"><h2>Операции</h2><button class="btn btn-primary btn-block mb-2" onclick="exportDB()">📤 Экспорт</button><button class="btn btn-ghost btn-block mb-2" onclick="document.getElementById(\'importDB\').click()">📥 Импорт</button><input type="file" id="importDB" accept=".json" style="display:none" onchange="importDB(event)"/><button class="btn btn-danger btn-block" onclick="if(confirm(\'Сброс?\')){localStorage.removeItem(\''+STORAGE_KEY+'\');location.reload();}">🗑 Сброс</button></div></div>';document.getElementById('app').innerHTML=html}

function exportDB(){var blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='ai-health-'+today()+'.json';a.click();URL.revokeObjectURL(url);toast('Экспорт готов','success')}
function importDB(e){var file=e.target.files[0];if(!file)return;var reader=new FileReader();reader.onload=function(ev){try{var data=JSON.parse(ev.target.result);if(!confirm('Заменить?'))return;state=Object.assign(defaultState(),data);save();toast('Импорт успешен','success');location.reload()}catch(err){toast('Ошибка','error')}};reader.readAsText(file)}

/* WELCOME */
function showWelcome(){var overlay=document.createElement('div');overlay.className='welcome-screen';overlay.innerHTML='<div class="welcome-logo">🧠</div><div class="welcome-title">AI Health Ecosystem</div><div class="welcome-sub">5 уровней · 9 доменов · 15 путей · 40+ методик · AI-коуч, психолог, врач.</div><button class="btn btn-primary btn-block" style="max-width:340px;" onclick="startOnboarding()">Начать</button>';document.body.appendChild(overlay)}

function startOnboarding(){var w=document.querySelector('.welcome-screen');if(w)w.remove();var name=window.__tgName||'';if(!name){var overlay=document.createElement('div');overlay.className='welcome-screen';overlay.innerHTML='<div class="welcome-logo">👤</div><div class="welcome-title">Как тебя зовут?</div><input type="text" class="welcome-input" id="welcome-name" placeholder="Имя" maxlength="30"/><button class="btn btn-primary btn-block mt-4" style="max-width:340px;margin-top:16px;" onclick="finishOnboarding()">Далее</button>';document.body.appendChild(overlay);setTimeout(function(){var i=document.getElementById('welcome-name');if(i)i.focus()},300)}else{state.profile.name=name;state.settings.onboardingDone=true;save();updateHeaderAvatar();renderTabBar();renderDashboard();toast('Добро пожаловать, '+name+'!','success')}}

function finishOnboarding(){var inp=document.getElementById('welcome-name');var name=inp?inp.value.trim():'';if(!name)return toast('Введи имя','error');state.profile.name=name;state.settings.onboardingDone=true;save();var w=document.querySelector('.welcome-screen');if(w)w.remove();updateHeaderAvatar();renderTabBar();renderDashboard();haptic('success');toast('Добро пожаловать, '+name+'!','success')}

/* INIT */
function init(){try{applyTheme(state.settings.theme);updateHeaderAvatar();if(!state.profile.name&&!state.settings.onboardingDone){showWelcome();return}if(state.profile.name&&!state.settings.onboardingDone){state.settings.onboardingDone=true;save()}if(!state.profile.name&&window.__tgName){state.profile.name=window.__tgName;save();updateHeaderAvatar()}if(state.tasks.length===0){state.tasks=[{id:uid(),title:'Завершить отчёт',category:'Работа',planned_time:45,actual_time:0,status:'pending',priority:'high',created_at:nowISO()},{id:uid(),title:'Повторить 10 слов',category:'Обучение',planned_time:15,actual_time:0,status:'pending',priority:'medium',created_at:nowISO()},{id:uid(),title:'Дневник: 3 победы',category:'Личное',planned_time:5,actual_time:0,status:'pending',priority:'medium',created_at:nowISO()}];save()}renderTabBar();renderDashboard();var t=today();if(state.stats.lastActiveDay!==t){var y=new Date();y.setDate(y.getDate()-1);state.stats.streak=state.stats.lastActiveDay===y.toISOString().slice(0,10)?(state.stats.streak||0)+1:1;state.stats.lastActiveDay=t;save()}checkAchievements()}catch(e){console.error('Init:',e);var app=document.getElementById('app');if(app)app.innerHTML='<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-title">Ошибка</div><div class="empty-text">'+esc(e.message)+'</div></div>'}}

function attachRipple(){document.addEventListener('pointerdown',function(e){var target=e.target.closest('.btn, .list-row, .chip, .tab-item, .task-item, .card, .icon-btn, .avatar-btn, .persona-item, .segmented-item, .level-card, .module-card, .lesson-row, .category-chip, .emoji-pick, .domain-card, .method-card, .course-card, .path-step, .survey-option');if(!target)return;target.classList.add('tap-ripple');var rect=target.getBoundingClientRect();target.style.setProperty('--rx',((e.clientX-rect.left)/rect.width)*100+'%');target.style.setProperty('--ry',((e.clientY-rect.top)/rect.height)*100+'%');target.classList.remove('rippling');void target.offsetWidth;target.classList.add('rippling');setTimeout(function(){target.classList.remove('rippling')},700)},{passive:true})}

window.navigate=navigate;window.openSheet=openSheet;window.closeSheet=closeSheet;window.openThemePicker=openThemePicker;window.setTheme=setTheme;window.openLevel=openLevel;window.openModule=openModule;window.openLesson=openLesson;window.completeLesson=completeLesson;window.openPath=openPath;window.openStep=openStep;window.completeStep=completeStep;window.openCourse=openCourse;window.openCourseLesson=openCourseLesson;window.completeCourseLesson=completeCourseLesson;window.openMethod=openMethod;window.openDomain=openDomain;window.saveDomainScore=saveDomainScore;window.saveMetrics=saveMetrics;window.openPersona=openPersona;window.addWater=addWater;window.quickMoodLog=quickMoodLog;window.saveMood=saveMood;window.addTask=addTask;window.saveTask=saveTask;window.toggleTask=toggleTask;window.editTask=editTask;window.updateTask=updateTask;window.deleteTask=deleteTask;window.switchPersona=switchPersona;window.sendMsg=sendMsg;window.openAISettings=openAISettings;window.saveAISettings=saveAISettings;window.pickEmoji=pickEmoji;window.setEmoji=setEmoji;window.saveProfileName=saveProfileName;window.finishOnboarding=finishOnboarding;window.startOnboarding=startOnboarding;window.startSurvey=startSurvey;window.saveSurveyAnswer=saveSurveyAnswer;window.selectSurveyOption=selectSurveyOption;window.toggleSurveyMulti=toggleSurveyMulti;window.nextSurveyStep=nextSurveyStep;window.prevSurveyStep=prevSurveyStep;window.finishSurvey=finishSurvey;window.saveGCal=saveGCal;window.saveObsidian=saveObsidian;window.exportNotesToObsidian=exportNotesToObsidian;window.saveGemini=saveGemini;window.exportDB=exportDB;window.importDB=importDB;

if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',function(){init();attachRipple()})}else{init();attachRipple()}
