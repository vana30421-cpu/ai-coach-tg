*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.effect-float{position:absolute;font-size:16px;top:-10%;animation:floatDown linear infinite}

.app-header{position:sticky;top:0;z-index:100;padding-top:var(--safe-top);background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:saturate(200%) blur(30px);-webkit-backdrop-filter:saturate(200%) blur(30px);border-bottom:.5px solid var(--divider)}

.brand-logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:grid;place-items:center;color:#fff;box-shadow:0 6px 20px var(--brand-glow);font-size:20px}

.app-main{position:relative;z-index:2;max-width:700px;margin:0 auto;width:100%;padding:22px;padding-bottom:calc(var(--tabbar-h) + var(--safe-bottom) + 96px) !important;min-height:calc(100dvh - var(--header-h) - var(--safe-top))}
.page{animation:pageIn .55s var(--spring-snap) both}

input[type="text"],input[type="number"],input[type="datetime-local"],input[type="date"],input[type="time"],input[type="password"],input[type="email"],input[type="url"],input[type="search"],input[type="range"],select,textarea{width:100%;padding:16px 18px;background:var(--surface-2);border:1.5px solid transparent;border-radius:var(--r-lg);color:var(--text);font-family:inherit;font-size:16px;font-weight:500;-webkit-appearance:none;appearance:none}

/* TELEGRAM */
try{var tg=window.Telegram&&window.Telegram.WebApp;if(tg){tg.expand();tg.ready();var u=tg.initDataUnsafe&&tg.initDataUnsafe.user;if(u&&u.first_name)window.__tgName=u.first_name}}catch(e){}

/* УТИЛИТЫ */
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function nowISO(){return new Date().toISOString()}
function today(){return new Date().toISOString().slice(0,10)}
function fmtDate(d){try{return new Date(d).toLocaleDateString('ru-RU',{day:'numeric',month:'short'})}catch(e){return '—'}}
function fmtTime(d){try{return new Date(d).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}catch(e){return '—'}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

/* ЗВУК */
var audioCtx=null;var soundEnabled=true;
function initAudio(){if(audioCtx)return;try{audioCtx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
function playSound(type){if(!soundEnabled)return;initAudio();if(!audioCtx)return;try{var o=audioCtx.createOscillator();var g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);var now=audioCtx.currentTime;if(type==='click'){o.frequency.setValueAtTime(800,now);o.frequency.exponentialRampToValueAtTime(400,now+.08);g.gain.setValueAtTime(.06,now);g.gain.exponentialRampToValueAtTime(.001,now+.08);o.start(now);o.stop(now+.08)}else if(type==='success'){o.frequency.setValueAtTime(523,now);o.frequency.setValueAtTime(659,now+.1);o.frequency.setValueAtTime(784,now+.2);g.gain.setValueAtTime(.08,now);g.gain.exponentialRampToValueAtTime(.001,now+.35);o.start(now);o.stop(now+.35)}else if(type==='error'){o.frequency.setValueAtTime(300,now);o.frequency.exponentialRampToValueAtTime(150,now+.2);g.gain.setValueAtTime(.08,now);g.gain.exponentialRampToValueAtTime(.001,now+.25);o.start(now);o.stop(now+.25)}else if(type==='levelup'){o.frequency.setValueAtTime(523,now);o.frequency.setValueAtTime(659,now+.12);o.frequency.setValueAtTime(784,now+.24);o.frequency.setValueAtTime(1047,now+.36);g.gain.setValueAtTime(.1,now);g.gain.exponentialRampToValueAtTime(.001,now+.6);o.start(now);o.stop(now+.6)}}catch(e){}}
function toggleSound(){soundEnabled=!soundEnabled;state.settings.soundEnabled=soundEnabled;save();var btn=document.getElementById('soundBtn');if(btn)btn.textContent=soundEnabled?'🔊':'🔇';toast(soundEnabled?'Звук включён':'Звук выключен','info')}

/* TOAST */
function toast(msg,type,duration){type=type||'info';duration=duration||2500;var c=document.getElementById('toasts');if(!c)return;var el=document.createElement('div');el.className='toast '+type;el.textContent=msg;c.appendChild(el);playSound(type==='success'?'success':type==='error'?'error':'click');setTimeout(function(){el.style.opacity='0';el.style.transform='translate(-50%,-16px)';el.style.transition='all .4s';setTimeout(function(){el.remove()},400)},duration)}
function haptic(type){try{var h=window.Telegram&&window.Telegram.WebApp&&window.Telegram.WebApp.HapticFeedback;if(!h)return;if(type==='success')h.notificationOccurred('success');else if(type==='error')h.notificationOccurred('error');else h.impactOccurred(type||'light')}catch(e){}}

/* СОСТОЯНИЕ */

tasks:[],chats:[],notes:[],water:[],mood:[],levelProgress:{},englishProgress:{},
profile:{name:'',emoji:'😊',createdAt:nowISO(),achievements:[],surveyDone:false,surveyStep:0,surveyAnswers:{},personalPlan:null},
settings:{theme:'dark',apiKey:'',activePersona:'coach',soundEnabled:true,effectsEnabled:true,onboardingDone:false},
stats:{streak:0,lastActiveDay:null}
}}
var state;
try{var raw=localStorage.getItem(STORAGE_KEY);if(raw){var parsed=JSON.parse(raw);var def=defaultState();state={};for(var k in def)state[k]=def[k];for(var k in parsed)state[k]=parsed[k];state.settings=Object.assign({},def.settings,parsed.settings||{});state.stats=Object.assign({},def.stats,parsed.stats||{});state.profile=Object.assign({},def.profile,parsed.profile||{});if(!state.levelProgress)state.levelProgress={};if(!state.englishProgress)state.englishProgress={}}else{state=defaultState()}}catch(e){state=defaultState()}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(e){}}

};

/* ОБУЧЕНИЕ — 5 уровней, 15 модулей, 40+ уроков */
var LEARNING_LEVELS=[
{id:'l1',num:1,title:'Дофамин и мозг',subtitle:'Новичок',emoji:'🧠',desc:'Механизмы мотивации.',modules:[
{id:'l1m1',title:'Дофамин',emoji:'⚡',desc:'Как работает мотивация',lessons:[
{title:'Что такое дофамин',mechanism:'Дофамин — <strong>нейромедиатор мотивации и предвкушения</strong>, а не "гормон удовольствия". Учёный Вольфрам Шульц показал: обезьяна получает дофамин ДО награды, при виде сигнала.\n\n<strong>Вывод:</strong> дофамин движет тобой в предвкушении, а не в момент удовольствия. Скроллинг ленты затягивает, потому что каждый свайп = новое предсказание.',steps:['Замечай, что ты делаешь в предвкушении, а что в момент получения','Сколько раз за день ты берёшь телефон на автомате?','Где дофамин работает против тебя?','Где за тебя?'],practice:'Дневник дофамина 3 дня. Каждый раз при тяге к телефону — что предвкушаешь? Что получил?',reflection:'Сколько действий в день из предвкушения?'},
{title:'Дофаминовая яма',mechanism:'<strong>Дофаминовая яма</strong> — когда базовый уровень дофамина падает после пиковых стимулов. Получил 10 единиц (соцсети, сахар) — мозг снижает базу на 2-3. Обычная еда и работа кажутся скучными.\n\nАнна Лембке (Stanford): "Dopamine Nation". Лечение — <strong>дофаминовое голодание</strong> 24-48 ч.',steps:['Определи источники пикового дофамина','Выбери 1-2 и откажись на 24 часа','Заметь, как меняется восприятие','Ломка длится 3-7 дней'],practice:'24 часа без главного источника. Прогулка, чтение, разговор.',reflection:'Что ты чувствуешь в первые 6 часов?'},
{title:'Управление дофамином',mechanism:'3 принципа:\n\n<strong>1. Отложенная награда.</strong> Не за 5 сек, а за 30-60 мин действия.\n<strong>2. Переменное подкрепление.</strong> За усилие, а не за результат.\n<strong>3. Правило "после дела".</strong> Награда только после полезного.',steps:['Телефон не беру первые 30 мин после пробуждения','Награду — только после дела','Тренировка ради процесса','1 раз в неделю детокс 4-6 ч'],practice:'Неделя: 30 мин после пробуждения без телефона.',reflection:'Что с тревожностью к концу недели?'}
]},
{id:'l1m2',title:'Прокрастинация',emoji:'⏳',desc:'Реальные причины',lessons:[
{title:'Причины прокрастинации',mechanism:'Не лень. 3 причины:\n\n<strong>1. Конфликт "сейчас vs потом".</strong> Лимбическая система видит только СЕЙЧАС. Кора — будущее.\n<strong>2. Синдром "неприятной задачи" (Тим Пичил, 2016).</strong> Прокрастинируем не "полезное", а "неприятное".\n<strong>3. Перфекционизм.</strong> Высокая планка = страх начать.',steps:['Раздели задачи: интересные и неприятные','Для неприятных — право делать плохо','Уменьши планку до смешного','Награди после даже минимального'],practice:'Возьми неприятную задачу. Сделай её на 20%. Только 20%.',reflection:'Что страшнее — делать или думать?'},
{title:'5 триггеров',mechanism:'<strong>Триггеры прокрастинации:</strong>\n1. Скука → геймификация\n2. Тревога → разбить на части\n3. Неясность → план\n4. Усталость → отдых\n5. Сопротивление → свой смысл\n\nОпределение триггера = 50% решения.',steps:['Какой триггер сегодня?','Подбери технику','Попробуй 1 раз','Дневник триггеров'],practice:'7 дней записывай: триггер + техника + результат.',reflection:'Какой триггер главный?'},
{title:'6 техник против прокрастинации',mechanism:'<strong>Проверены исследованиями:</strong>\n\n<strong>Правило 2 мин (Дэвид Аллен).</strong> Если ≤2 мин — делай сразу.\n<strong>Pomodoro (Чирилло).</strong> 25/5.\n<strong>Eat That Frog (Трейси).</strong> Сложное первым.\n<strong>Time-blocking.</strong> "С 10 до 10:25".\n<strong>Habit stacking (Фогг).</strong> После [старая] — [новая].\n<strong>Do the worst first.</strong> Начни с неприятной части.',steps:['Выбери 1 технику на неделю','Применяй ежедневно','Записывай результат','Оцени через неделю'],practice:'Неделя Pomodoro: запись каждого помидора.',reflection:'Что работает лично для тебя?'}
]},
{id:'l1m3',title:'Кортизол и стресс',emoji:'⚡',desc:'Гормон выживания',lessons:[
{title:'Кортизол',mechanism:'<strong>Кортизол</strong> — гормон стресса. Не враг. Утром даёт энергию. В опасности мобилизует.\n\nХронически высокий разрушает:\n• Мозг (гиппокамп → память)\n• Иммунитет\n• Сердце\n• Вес (жир на животе)\n• Сон\n\nРоберт Сапольски: хронический стресс убивает.',steps:['Как часто напряжение в теле?','Хронический или острый?','Начни с 5 мин дыхания 4-7-8','Через неделю — 2 раза в день'],practice:'Неделю отслеживай стресс 1-10 утром/днём/вечером.',reflection:'В какие часы кортизол максимальный?'},
{title:'Снижение кортизола',mechanism:'<strong>Работает:</strong>\n1. Дыхание 4-7-8 (Вейл) — за 2 мин\n2. Медитация 10 мин (Lazar: -25%)\n3. Движение 30 мин\n4. Природа 2 ч/нед (синрин-йоку: -16%)\n5. Соцсвязи\n6. Сон 7-9 ч\n\n<strong>НЕ работает:</strong> алкоголь, соцсети, сахар.',steps:['Выбери 2 техники','Применяй 7 дней','Записывай эффект','Усиль, что работает'],practice:'Дыхание 4-7-8 утром + прогулка 30 мин днём. 7 дней.',reflection:'Что изменилось?'}
]},
{id:'l1m4',title:'Сон',emoji:'😴',desc:'Треть жизни',lessons:[
{title:'Стадии сна',mechanism:'Мэттью Уокер ("Why We Sleep"): сон — активная работа.\n\n<strong>4 стадии:</strong>\nN1 — засыпание\nN2 — лёгкий (50%)\nN3 — глубокий (25%) → тело, иммунитет\nREM — быстрый (25%) → память, эмоции\n\n<strong>Циклы:</strong> 90 мин × 4-5.\n<strong>Без сна:</strong> 24 ч = -30% когнитивных.\n<6 ч = риск деменции ×1.5.',steps:['Сколько спишь?','Сколько циклов?','+30 мин в неделю','Цель: 7-9 ч'],practice:'Неделя: режим ±30 мин. Запись качества 1-10.',reflection:'Что мешает спать 8 часов?'},
{title:'Правила глубокого сна',mechanism:'<strong>8 правил:</strong>\n1. Свет утром 10-30 мин\n2. Кофеин до 14:00\n3. Алкоголь — нет\n4. Экраны — стоп за час\n5. Температура 18-20°C\n6. Спальня только для сна\n7. Тёмно\n8. Еда за 3 часа',steps:['3 правила на неделю','Записывай результат','Добавь ещё'],practice:'Свет утром + 18°C + экран-стоп.',reflection:'Что изменилось?'}
]},
{id:'l1m5',title:'Эмоции и тревога',emoji:'🌊',desc:'Как работают чувства',lessons:[
{title:'Анатомия эмоций',mechanism:'<strong>Эмоция живёт 90 секунд</strong> (Джилл Болти Тейлор). Химический сигнал проходит и исчезает. Дольше — интерпретация.\n\n<strong>Миндалевидное тело</strong> — 100 мс. <strong>Кора</strong> — 6 сек. Сначала чувствуем, потом думаем.\n\n<strong>7 базовых (Экман):</strong> радость, грусть, страх, злость, удивление, отвращение, презрение.',steps:['Засеки 90 сек','Заметь, что происходит','Дольше — это мысль','Работай с мыслью'],practice:'Неделю отслеживай длительность тревоги физически.',reflection:'Застреваешь в интерпретации?'},
{title:'Тревога: механизм',mechanism:'Предсказание опасности. Полезная функция.\n\n<strong>Проблема:</strong>\n• Угроза нереальна\n• Постоянно "включена"\n• Тело реагирует как на реальную\n\n<strong>Круг:</strong> мысль → тревога → тело → ещё мысль → паника.\n\nРазорвать с любой точки: тело, мысль, поведение.',steps:['Реальна ли угроза?','Что в моей власти?','Техника заземления','Не избегай — столкнись'],practice:'5-4-3-2-1 при тревоге.',reflection:'Что запускает твою тревогу?'},
{title:'КПТ',mechanism:'<strong>КПТ (Бек, 1960-е)</strong> — самая изученная терапия.\n\nФормула: Ситуация → Мысль → Эмоция → Поведение.\n\n<strong>5 искажений:</strong>\n1. Катастрофизация\n2. Чёрно-белое\n3. Чтение мыслей\n4. Обобщение\n5. Обесценивание',steps:['Записывай мысли','Определяй искажение','Оспаривай фактами','Записывай альтернативу'],practice:'Дневник мыслей 7 дней.',reflection:'Какое искажение главное?'}
]}
]},

{title:'4 закона Клира',mechanism:'<strong>1. Очевидной.</strong> Книга на подушку.\n<strong>2. Привлекательной.</strong> Свяжи с любимым.\n<strong>3. Простой.</strong> 2 мин на старте.\n<strong>4. Приятной.</strong> Награда сразу.\n\nОбратные — убрать плохое.',steps:['4 закона','Записывай','66 дней'],practice:'Внедри 1 привычку через 4 закона.',reflection:'Что убрать?'}

{id:'l2m2',title:'Энергия',emoji:'🔋',desc:'Откуда берётся',lessons:[
{title:'4 вида энергии',mechanism:'<strong>Тони Шварц:</strong> не время, а энергия.\n\n1. Физическая — сон, еда, движение\n2. Эмоциональная — настроение, связи\n3. Ментальная — фокус\n4. Духовная — смысл\n\nЕсли одна на нуле — все падают.',steps:['Оцени 4 энергии','Найди провал','Восстанавливай ритмично'],practice:'Дневник энергии: 3 раза в день.',reflection:'Что проседает?'},
{title:'Ультрадианные ритмы',mechanism:'90-120 мин циклы. После — 15-20 отдых.\n\n<strong>Правило:</strong> 90/15.\n\nОтдых без экранов: встать, вода, окно.',steps:['Раздели день на блоки','Отдых обязательно'],practice:'90/15 неделю.',reflection:'Что чувствуешь?'}

{id:'l3m2',title:'Деньги',emoji:'💰',desc:'Система',lessons:[
{title:'Финансовая система',mechanism:'<strong>50/30/20 (Уоррен):</strong>\n50% нужды, 30% желания, 20% сбережения.\n\n<strong>Снежный ком (Рамси):</strong> мелкий долг — максимум, потом следующий.\n\n<strong>Подушка:</strong> 3-6 мес. Только вклады.\n\n<strong>Сложный процент:</strong> $100/мес × 30 лет × 7% = $120 000.',steps:['Записывай расходы 3 мес','Норма сбережений','Подушка','Индексы'],practice:'Записывай расходы неделю.',reflection:'Сколько импульсивных покупок?'}

function markWord(levelId,moduleId,idx){var key=levelId+'_'+moduleId+'_'+idx;if(!state.englishProgress)state.englishProgress={};state.englishProgress[key]=true;save();playSound('success');haptic('success');toast('✓ Слово изучено','success');renderEngModule()}

/* ХРАНИЛИЩЕ */
function renderStorage(){var tables=['tasks','chats','notes','water','mood'];var total=0;tables.forEach(function(t){if(Array.isArray(state[t]))total+=state[t].length});var lessons=Object.keys(state.levelProgress||{}).length;var words=Object.keys(state.englishProgress||{}).length;var size=new Blob([JSON.stringify(state)]).size;var html='<div class="page"><div class="title-xl">🗄 Хранилище</div><div class="card card-gradient"><div style="opacity:.9;font-size:13px;">Всего записей</div><div style="font-size:44px;font-weight:800;margin:8px 0;">'+total+'</div><div style="opacity:.9;font-size:13px;">Размер: '+(size/1024).toFixed(1)+' KB</div></div><div class="card"><h2>📊 Таблицы</h2>';tables.forEach(function(t){var count=Array.isArray(state[t])?state[t].length:0;html+='<div class="storage-item"><div class="storage-icon">📋</div><div class="storage-info"><div class="storage-name">'+t+'</div></div><div class="storage-size">'+count+'</div></div>'});html+='</div><div class="card"><h2>📈 Данные</h2><div class="storage-item"><div class="storage-icon">🎓</div><div class="storage-info"><div class="storage-name">Уроки</div></div><div class="storage-size">'+lessons+'</div></div><div class="storage-item"><div class="storage-icon">🇬🇧</div><div class="storage-info"><div class="storage-name">Слова</div></div><div class="storage-size">'+words+'</div></div></div><div class="card"><h2>💾 Операции</h2><button class="btn btn-primary btn-block mb-2" onclick="exportDB()">📤 Экспорт JSON</button><button class="btn btn-ghost btn-block mb-2" onclick="document.getElementById(\'importDB\').click()">📥 Импорт</button><input type="file" id="importDB" accept=".json" style="display:none" onchange="importDB(event)"/><button class="btn btn-danger btn-block" onclick="if(confirm(\'Сбросить ВСЕ данные?\')){localStorage.removeItem(\''+STORAGE_KEY+'\');location.reload();}">🗑 Полный сброс</button></div></div>';document.getElementById('app').innerHTML=html}

function exportDB(){var blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='ai-health-'+today()+'.json';a.click();URL.revokeObjectURL(url);toast('Экспорт готов','success');playSound('success')}
function importDB(e){var file=e.target.files[0];if(!file)return;var reader=new FileReader();reader.onload=function(ev){try{var data=JSON.parse(ev.target.result);if(!confirm('Заменить данные?'))return;state=Object.assign(defaultState(),data);save();toast('Импорт успешен','success');location.reload()}catch(err){toast('Ошибка','error')}};reader.readAsText(file)}

/* RECOVERY */
function renderRecovery(){var html='<div class="page"><div class="title-xl">🌿 Восстановление</div><div class="card"><h2>🎬 Фильмы</h2>';RECOVERY_MOVIES.forEach(function(m){html+='<div class="rec-item"><div class="rec-icon">🎬</div><div class="rec-body"><div class="rec-title">'+m.title+'</div><div class="rec-meta">'+m.year+' · '+m.genre+' · '+m.desc+'</div></div></div>'});html+='</div><div class="card"><h2>📚 Книги</h2>';RECOVERY_BOOKS.forEach(function(b){html+='<div class="rec-item"><div class="rec-icon">📖</div><div class="rec-body"><div class="rec-title">'+b.title+'</div><div class="rec-meta">'+b.author+' · '+b.desc+'</div></div></div>'});html+='</div><div class="card"><h2>🧘 Активности</h2>';RECOVERY_ACTIVITIES.forEach(function(a){html+='<div class="rec-item" onclick="toast(\''+a.title+' ✓\',\'success\')"><div class="rec-icon">✨</div><div class="rec-body"><div class="rec-title">'+a.title+'</div><div class="rec-meta">'+a.duration+' · '+a.benefit+'</div></div></div>'});html+='</div></div>';document.getElementById('app').innerHTML=html}

/* DASHBOARD */
function renderDashboard(){var todayTasks=state.tasks.filter(function(t){return t.created_at&&t.created_at.slice(0,10)===today()});var doneToday=todayTasks.filter(function(t){return t.status==='completed'}).length;var hour=new Date().getHours();var greet=hour<6?'Доброй ночи':hour<12?'Доброе утро':hour<18?'Добрый день':'Добрый вечер';var progress=todayTasks.length?Math.round(doneToday/todayTasks.length*100):0;var userName=state.profile.name?', '+state.profile.name:'';var totalDone=0,totalLessons=0;LEARNING_LEVELS.forEach(function(level){var p=getLevelProgress(level.id);totalDone+=p.done;totalLessons+=p.total});var overallPct=totalLessons?Math.round(totalDone/totalLessons*100):0;var html='<div class="page"><div class="title-xl">'+greet+userName+'</div><div class="card card-gradient"><div class="row-between" style="margin-bottom:14px;"><div><div style="font-size:13px;opacity:.85;">Прогресс дня</div><div style="font-size:40px;font-weight:800;">'+doneToday+'/'+todayTasks.length+'</div></div><div style="font-size:48px;font-weight:800;">'+progress+'%</div></div><div class="progress" style="background:rgba(255,255,255,.25);height:8px;"><div class="progress-fill" style="width:'+progress+'%;background:#fff;"></div></div></div><div class="stat-grid mb-4"><div class="stat-item"><div class="stat-value">'+(state.stats.streak||0)+'</div><div class="stat-label">Streak</div></div><div class="stat-item"><div class="stat-value">'+overallPct+'%</div><div class="stat-label">Обучение</div></div><div class="stat-item"><div class="stat-value">'+Object.keys(state.englishProgress||{}).length+'</div><div class="stat-label">English</div></div></div><div class="card"><h2>⚡ Быстрые действия</h2><div class="btn-row"><button class="btn btn-ghost btn-sm" onclick="navigate(\'learning\')">🎓 Обучение</button><button class="btn btn-ghost btn-sm" onclick="navigate(\'english\')">🇬🇧 English</button><button class="btn btn-ghost btn-sm" onclick="navigate(\'recovery\')">🌿 Восстановление</button><button class="btn btn-ghost btn-sm" onclick="navigate(\'storage\')">🗄 Хранилище</button></div></div>';var pending=state.tasks.filter(function(t){return t.status==='pending'}).slice(0,5);html+='<div class="card"><h2>📋 Задачи</h2>';if(pending.length){pending.forEach(function(t){html+=taskRow(t)})}else{html+='<div class="empty"><div class="empty-icon">✨</div><div class="empty-text">Всё выполнено</div></div>'}html+='</div></div>';document.getElementById('app').innerHTML=html}

function taskRow(t){var checked=t.status==='completed';return '<div class="task-item '+(checked?'completed':'')+'" onclick="editTask(\''+t.id+'\')"><div class="priority-bar medium"></div><button class="task-checkbox '+(checked?'checked':'')+'" onclick="event.stopPropagation();toggleTask(\''+t.id+'\')">'+(checked?'✓':'')+'</button><div class="task-content"><div class="task-title">'+esc(t.title)+'</div><div class="task-meta"><span>'+(t.planned_time||0)+' мин</span></div></div></div>'}

/* TASKS */
function renderTasks(){var html='<div class="page"><div class="row-between" style="margin-bottom:20px;"><div class="title-xl" style="margin:0;">Задачи</div><button class="btn btn-primary btn-sm" onclick="addTask()">+ Новая</button></div>';if(state.tasks.length){state.tasks.forEach(function(t){html+=taskRow(t)})}else{html+='<div class="empty"><div class="empty-icon">📋</div><div class="empty-text">Нет задач</div></div>'}html+='</div>';document.getElementById('app').innerHTML=html}

function addTask(){openSheet('Новая задача','<div class="field"><input type="text" id="t-title" placeholder="Название" autofocus/></div><div class="field"><input type="number" id="t-time" value="30"/></div><button class="btn btn-primary btn-block" onclick="saveTask()">Добавить</button>')}

function saveTask(){var title=((document.getElementById('t-title')||{}).value||'').trim();if(!title)return toast('Введите название','error');state.tasks.unshift({id:uid(),title:title,planned_time:parseInt((document.getElementById('t-time')||{}).value)||30,actual_time:0,status:'pending',priority:'medium',created_at:nowISO()});save();closeSheet();toast('Добавлено','success');playSound('success');renderTasks()}

function toggleTask(id){var t=state.tasks.find(function(x){return x.id===id});if(!t)return;t.status=t.status==='completed'?'pending':'completed';save();playSound('success');haptic('success');if(currentPage==='tasks')renderTasks();else renderDashboard()}

function editTask(id){var t=state.tasks.find(function(x){return x.id===id});if(!t)return;openSheet('Редактировать','<div class="field"><input type="text" id="e-title" value="'+esc(t.title)+'"/></div><button class="btn btn-primary btn-block" onclick="updateTask(\''+id+'\')">Сохранить</button><button class="btn btn-danger btn-block mt-2" onclick="deleteTask(\''+id+'\')">Удалить</button>')}

function updateTask(id){var t=state.tasks.find(function(x){return x.id===id});if(!t)return;t.title=(document.getElementById('e-title')||{}).value||t.title;save();closeSheet();toast('Сохранено','success');renderTasks()}
function deleteTask(id){if(!confirm('Удалить?'))return;state.tasks=state.tasks.filter(function(t){return t.id!==id});save();closeSheet();toast('Удалено','info');renderTasks()}

/* AI */
function renderAI(){var active=state.settings.activePersona||'coach';var persona=PERSONAS[active]||PERSONAS.coach;var messages=state.chats.filter(function(c){return c.persona===active});var html='<div class="page"><div class="title-xl">AI</div><div class="persona-bar">';Object.keys(PERSONAS).forEach(function(k){var p=PERSONAS[k];html+='<button class="persona-item '+(active===k?'active':'')+'" data-p="'+k+'" onclick="switchPersona(\''+k+'\')">'+p.name+'</button>'});html+='</div><div class="card" style="padding:16px 18px;"><div class="row-between"><div class="row" style="gap:12px;"><div style="font-size:28px;">'+persona.emoji+'</div><div><div style="font-weight:700;">'+persona.name+'</div><div class="caption text-tertiary">'+persona.label+'</div></div></div><button class="btn btn-ghost btn-sm" onclick="openAISettings()">⚙️</button></div></div><div class="card" style="min-height:360px;max-height:62vh;overflow-y:auto;padding:18px;" id="chatBox"><div class="chat">';if(messages.length){messages.forEach(function(m){html+='<div class="msg msg-'+(m.role==='user'?'user':'bot')+'">'+(m.role==='user'?esc(m.text):renderMd(m.text))+'</div>'})}else{html+='<div class="empty"><div class="empty-icon">'+persona.emoji+'</div><div class="empty-text">Задай вопрос</div></div>'}html+='</div></div><div class="row" style="margin-top:14px;"><input type="text" id="chatInput" placeholder="Сообщение..." style="flex:1;" onkeydown="if(event.key===\'Enter\'){event.preventDefault();sendMsg();}"/><button class="btn btn-primary btn-icon" onclick="sendMsg()">➤</button></div></div>';document.getElementById('app').innerHTML=html;var box=document.getElementById('chatBox');if(box)box.scrollTop=box.scrollHeight}

function switchPersona(p){state.settings.activePersona=p;save();renderAI()}

async function sendMsg(){var input=document.getElementById('chatInput');if(!input)return;var text=input.value.trim();if(!text)return;input.value='';input.disabled=true;var persona=state.settings.activePersona||'coach';state.chats.push({id:uid(),persona:persona,role:'user',text:text,timestamp:nowISO()});save();renderAI();var reply=await callAI(persona,text);state.chats.push({id:uid(),persona:persona,role:'coach',text:reply,timestamp:nowISO()});save();checkAchievements();renderAI()}

async function callAI(persona,userText){var key=state.settings.apiKey;if(!key)return fallbackReply(persona,userText);var p=PERSONAS[persona];var history=state.chats.filter(function(c){return c.persona===persona}).slice(-10);try{var sys=p.prompt;var rest=history.map(function(m){return{role:m.role==='user'?'user':'model',parts:[{text:m.text}]}});var resp=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key='+key,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({system_instruction:{parts:[{text:sys}]},contents:rest})});var data=await resp.json();return (data.candidates&&data.candidates[0]&&data.candidates[0].content&&data.candidates[0].content.parts&&data.candidates[0].content.parts[0]&&data.candidates[0].content.parts[0].text)||fallbackReply(persona,userText)}catch(e){return fallbackReply(persona,userText)}}

function fallbackReply(persona,text){text=text||'';if(/суицид|покончить|не хочу жить/i.test(text)){return '🆘 8-800-2000-122 · findahelpline.com'}if(persona==='doctor')return 'Я — AI-консультант. *⚠️ Не заменяет врача.*';if(persona==='psych')return 'Слышу тебя. Что происходит?';return 'Слышу тебя. Расскажи подробнее.'}

function renderMd(text){if(!text)return '';var h=esc(text);h=h.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');h=h.replace(/\n/g,'<br>');return '<p>'+h+'</p>'}

function openAISettings(){openSheet('Настройки AI','<div class="field"><label class="field-label">API ключ Gemini</label><input type="password" id="ai-k" value="'+esc(state.settings.apiKey||'')+'" placeholder="AIza..."/></div><div class="footnote text-tertiary mb-3"><a href="https://aistudio.google.com/app/apikey" target="_blank" style="color:var(--brand)">Получить бесплатно</a></div><button class="btn btn-primary btn-block" onclick="saveAISettings()">Сохранить</button>')}
function saveAISettings(){state.settings.apiKey=((document.getElementById('ai-k')||{}).value||'').trim();save();closeSheet();toast('Сохранено','success');renderAI()}

/* MORE */
function renderMore(){var groups=[{title:'🌿 Восстановление',items:[{key:'recovery',emoji:'🌿',label:'Фильмы, книги, отдых'}]},{title:'🎓 Обучение',items:[{key:'learning',emoji:'🎓',label:'5 уровней'},{key:'english',emoji:'🇬🇧',label:'Английский'}]},{title:'🗄 Система',items:[{key:'storage',emoji:'🗄',label:'Хранилище'},{key:'profile',emoji:'👤',label:'Профиль'},{key:'settings',emoji:'⚙️',label:'Настройки'}]}];var html='<div class="page"><div class="title-xl">Все разделы</div>';groups.forEach(function(g){html+='<div class="card"><h2>'+g.title+'</h2>';g.items.forEach(function(it){html+='<div class="list-row" onclick="navigate(\''+it.key+'\')"><div class="list-icon" style="background:var(--surface-2);">'+it.emoji+'</div><div class="list-body"><div class="list-title">'+it.label+'</div></div><div class="list-chevron">›</div></div>'});html+='</div>'});html+='</div>';document.getElementById('app').innerHTML=html}

/* PROFILE */
function renderProfile(){var p=state.profile;var unlocked=p.achievements||[];var html='<div class="page"><div class="profile-hero"><div class="profile-avatar" onclick="pickEmoji()">'+p.emoji+'</div><div class="profile-name">'+esc(p.name||'Пользователь')+'</div></div><div class="card"><h2>✏️ Имя</h2><input type="text" id="profile-name" value="'+esc(p.name)+'" onchange="saveProfileName(this.value)"/></div><div class="card"><h2>🏆 Достижения ('+unlocked.length+'/'+ACHIEVEMENTS.length+')</h2><div class="achieve-grid">';ACHIEVEMENTS.forEach(function(a){var isUnlocked=unlocked.indexOf(a.id)>=0;html+='<div class="achieve-item '+(isUnlocked?'unlocked':'locked')+'"><div class="achieve-icon">'+a.icon+'</div><div class="achieve-name">'+a.name+'</div></div>'});html+='</div></div></div>';document.getElementById('app').innerHTML=html}

function pickEmoji(){var emojis=['😊','😎','🤓','🧑‍💻','🦊','🐱','🐶','🦁','🐼','🦉','🌟','⚡','🔥','💎','🚀','🎯','🧠','💪'];var html='<div class="emoji-grid">';emojis.forEach(function(e){var sel=e===state.profile.emoji?' selected':'';html+='<button class="emoji-pick'+sel+'" onclick="setEmoji(\''+e+'\')">'+e+'</button>'});html+='</div>';openSheet('Аватар',html)}
function setEmoji(e){state.profile.emoji=e;save();closeSheet();renderProfile();updateHeaderAvatar()}
function saveProfileName(name){state.profile.name=(name||'').trim()||'Пользователь';save();toast('Сохранено','success');updateHeaderAvatar()}
function updateHeaderAvatar(){var el=document.getElementById('headerAvatar');if(el)el.textContent=state.profile.emoji||'👤'}

/* SETTINGS */
function renderSettings(){var html='<div class="page"><div class="title-xl">Настройки</div><div class="card"><h2>🎨 Тема</h2><button class="btn btn-primary btn-block" onclick="openThemePicker()">Сменить</button></div><div class="card"><h2>🔊 Звук</h2><button class="btn btn-ghost btn-block" onclick="toggleSound()">'+(soundEnabled?'Выключить':'Включить')+'</button></div><div class="card"><h2>🤖 AI</h2><button class="btn btn-primary btn-block" onclick="openAISettings()">Настроить API</button></div><div class="footnote text-tertiary" style="text-align:center;margin-top:36px;">AI Health v26</div></div>';document.getElementById('app').innerHTML=html}

/* WELCOME */
function showWelcome(){var overlay=document.createElement('div');overlay.className='welcome-screen';overlay.innerHTML='<div class="welcome-logo">🧠</div><div class="welcome-title">AI Health v26</div><div class="welcome-sub">5 уровней обучения · Английский · Хранилище · Звук · AI-коуч, психолог, врач</div><button class="btn btn-primary btn-block" style="max-width:340px;" onclick="startOnboarding()">Начать</button>';document.body.appendChild(overlay)}

function startOnboarding(){var w=document.querySelector('.welcome-screen');if(w)w.remove();var name=window.__tgName||'';if(!name){var overlay=document.createElement('div');overlay.className='welcome-screen';overlay.innerHTML='<div class="welcome-logo">👤</div><div class="welcome-title">Как тебя зовут?</div><input type="text" class="welcome-input" id="welcome-name" placeholder="Имя" maxlength="30"/><button class="btn btn-primary btn-block mt-4" style="max-width:340px;margin-top:16px;" onclick="finishOnboarding()">Далее</button>';document.body.appendChild(overlay);setTimeout(function(){var i=document.getElementById('welcome-name');if(i)i.focus()},300)}else{state.profile.name=name;state.settings.onboardingDone=true;save();updateHeaderAvatar();renderTabBar();renderDashboard();toast('Добро пожаловать!','success')}}

function finishOnboarding(){var inp=document.getElementById('welcome-name');var name=inp?inp.value.trim():'';if(!name)return toast('Введи имя','error');state.profile.name=name;state.settings.onboardingDone=true;save();var w=document.querySelector('.welcome-screen');if(w)w.remove();updateHeaderAvatar();renderTabBar();renderDashboard();playSound('levelup');toast('Добро пожаловать, '+name+'!','success')}

/* INIT */
function init(){try{applyTheme(state.settings.theme);updateHeaderAvatar();soundEnabled=state.settings.soundEnabled!==false;var sb=document.getElementById('soundBtn');if(sb)sb.textContent=soundEnabled?'🔊':'🔇';if(!state.profile.name&&!state.settings.onboardingDone){showWelcome();return}if(state.profile.name&&!state.settings.onboardingDone){state.settings.onboardingDone=true;save()}if(!state.profile.name&&window.__tgName){state.profile.name=window.__tgName;save();updateHeaderAvatar()}if(state.tasks.length===0){state.tasks=[{id:uid(),title:'Первый урок: Дофамин',planned_time:10,actual_time:0,status:'pending',priority:'high',created_at:nowISO()},{id:uid(),title:'Английский: 5 слов',planned_time:10,actual_time:0,status:'pending',priority:'medium',created_at:nowISO()},{id:uid(),title:'Прогулка 20 минут',planned_time:20,actual_time:0,status:'pending',priority:'medium',created_at:nowISO()}];save()}renderTabBar();renderDashboard();var t=today();if(state.stats.lastActiveDay!==t){var y=new Date();y.setDate(y.getDate()-1);state.stats.streak=state.stats.lastActiveDay===y.toISOString().slice(0,10)?(state.stats.streak||0)+1:1;state.stats.lastActiveDay=t;save()}checkAchievements()}catch(e){console.error('Init:',e);var app=document.getElementById('app');if(app)app.innerHTML='<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-title">Ошибка</div><div class="empty-text">'+esc(e.message)+'</div></div>'}}

function attachRipple(){document.addEventListener('pointerdown',function(e){var target=e.target.closest('.btn,.list-row,.chip,.tab-item,.task-item,.card,.icon-btn,.avatar-btn,.persona-item,.segmented-item,.level-card,.module-card,.lesson-row,.emoji-pick,.word-card,.rec-item,.course-card,.storage-item');if(!target)return;target.classList.add('tap-ripple');var rect=target.getBoundingClientRect();target.style.setProperty('--rx',((e.clientX-rect.left)/rect.width)*100+'%');target.style.setProperty('--ry',((e.clientY-rect.top)/rect.height)*100+'%');target.classList.remove('rippling');void target.offsetWidth;target.classList.add('rippling');setTimeout(function(){target.classList.remove('rippling')},700)},{passive:true})}

/* EXPORTS */
window.navigate=navigate;window.openSheet=openSheet;window.closeSheet=closeSheet;window.openThemePicker=openThemePicker;window.setTheme=setTheme;window.openLevel=openLevel;window.openModule=openModule;window.openLesson=openLesson;window.completeLesson=completeLesson;window.openEngLevel=openEngLevel;window.openEngModule=openEngModule;window.speakWord=speakWord;window.markWord=markWord;window.addTask=addTask;window.saveTask=saveTask;window.toggleTask=toggleTask;window.editTask=editTask;window.updateTask=updateTask;window.deleteTask=deleteTask;window.switchPersona=switchPersona;window.sendMsg=sendMsg;window.openAISettings=openAISettings;window.saveAISettings=saveAISettings;window.pickEmoji=pickEmoji;window.setEmoji=setEmoji;window.saveProfileName=saveProfileName;window.finishOnboarding=finishOnboarding;window.startOnboarding=startOnboarding;window.exportDB=exportDB;window.importDB=importDB;window.toggleSound=toggleSound;

if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',function(){init();attachRipple()})}else{init();attachRipple()}
</script>
</body>
