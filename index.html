{title:'Нейропластичность',theory:'Мозг меняется всю жизнь. Каждый раз, когда ты учишься новому, создаются новые связи.\n\n**Ключевой принцип:** "Neurons that fire together, wire together" — нейроны, которые активируются вместе, соединяются.\n\n**Что это значит для тебя:**\n• Ты можешь переучить мозг\n• Старые привычки не исчезают, но ослабевают\n• Новые пути укрепляются через повторение\n• Возраст не барьер — 80-летние создают новые нейроны\n\n**Практика:** Выучи 10 новых слов сегодня. Завтра повтори. Через неделю повтори. Связи укрепятся.',practice:'Выучи 10 новых фактов/слов. Повтори 3 дня подряд.',reflection:'Что нового ты узнал о себе за последний год?'},
{title:'Дофамин — молекула мотивации',theory:'Дофамин — НЕ молекула удовольствия. Это молекула **предвкушения** и **мотивации**.\n\n**Как работает:**\n• Ты видишь стимул → дофамин выделяется → ты действуешь → получаешь награду\n• Дофамин выделяется ДО награды, а не после\n• Это заставляет нас искать, стремиться, хотеть\n\n**Проблемы современности:**\n• Соцсети, игры, фастфуд — суперстимулы, которые дают огромные выбросы дофамина\n• Реальные достижения меркнут на фоне\n• Развивается "дофаминовая яма" — ничего не радует\n\n**Что делать:**\n• Дофаминовое голодание — снизь суперстимулы\n• Замени быстрые награды на медленные (спорт, обучение, творчество)\n• Создавай ритуалы предвкушения\n• Празднуй маленькие победы',practice:'24 часа без соцсетей. Запиши, что чувствовал.',reflection:'Что даёт тебе быстрый дофамин? Как заменить?'},
{title:'Кортизол — гормон стресса',theory:'Кортизол — не враг. Это гормон, который мобилизует энергию.\n\n**Норма:** Утром высокий (просыпаемся), вечером низкий (засыпаем).\n\n**Хронический стресс:**\n• Кортизол постоянно высокий\n• Разрушается гиппокамп (память)\n• Ослабляется иммунитет\n• Нарушается сон\n• Растёт живот\n\n**Как снизить:**\n• Сон 7-9 часов\n• Физическая активность\n• Медитация (снижает кортизол на 25%)\n• Природа (2 часа в неделю)\n• Социальные связи\n• Ограничение новостей',practice:'Измерь уровень стресса утром и вечером 1-10. Неделю.',reflection:'Что повышает твой кортизол?'},
{title:'Серотонин и окситоцин',theory:'**Серотонин** — "гормон счастья". Отвечает за:\n• Настроение\n• Сон\n• Аппетит\n• Социальное поведение\n\n**Как повысить:**\n• Солнечный свет (15 мин утром)\n• Триптофан (индейка, бананы, овсянка)\n• Физическая активность\n• Медитация\n\n**Окситоцин** — "гормон объятий". Отвечает за:\n• Доверие\n• Привязанность\n• Спокойствие\n• Роды и лактацию\n\n**Как повысить:**\n• Объятия (20 секунд)\n• Время с близкими\n• Помощь другим\n• Домашние животные\n• Массаж',practice:'15 минут солнца утром. 3 объятия сегодня.',reflection:'Что даёт тебе чувство связи?'},
{title:'Сон — фундамент всего',theory:'Сон — не пассивное время. Мозг работает!\n\n**Стадии сна:**\n1. Засыпание (5-10 мин)\n2. Лёгкий сон (50%)\n3. Глубокий сон (20%) — восстановление тела\n4. REM-сон (25%) — обработка эмоций, память\n\n**Цикл:** 90 минут. За ночь 4-6 циклов.\n\n**Что происходит при недосыпе:**\n• Когнитивные способности -30%\n• Иммунитет -50%\n• Риск депрессии +40%\n• Набор веса\n• Диабет 2 типа\n\n**Гигиена сна:**\n• Ложиться и вставать в одно время\n• Темнота (мелатонин)\n• Прохлада (18-20°C)\n• Без экранов за час до сна\n• Кофеин до 14:00\n• Алкоголь разрушает сон',practice:'Установи режим сна на неделю. Записывай.',reflection:'Что мешает тебе спать?'}]},
{id:'l1m2',title:'Эмоциональный интеллект',emoji:'❤️',desc:'Понимание и управление эмоциями',lessons:[
{title:'Что такое эмоции',theory:'Эмоции — это **сигналы**, а не слабость.\n\n**7 базовых эмоций (Экман):**\n1. Радость 😊\n2. Грусть 😢\n3. Гнев 😠\n4. Страх 😨\n5. Удивление 😲\n6. Отвращение 🤢\n7. Презрение 😒\n\n**Функции эмоций:**\n• Сообщают о потребностях\n• Мотивируют к действию\n• Помогают в общении\n• Защищают\n\n**Миф:** "Негативные эмоции — плохо".\n**Реальность:** Все эмоции полезны. Проблема — в реакции.\n\n**Правило 90 секунд:** Любая эмоция длится 90 секунд. Дальше — ты сам её продлеваешь.',practice:'Дневник эмоций: записывай эмоцию, триггер, реакцию. 7 дней.',reflection:'Какую эмоцию ты подавляешь?'},
{title:'Тревога — механизм выживания',theory:'Тревога — это **предсказание будущей угрозы**.\n\n**Как работает:**\n• Миндалевидное тело (амигдала) — детектор угроз\n• При тревоге: сердцебиение, потливость, напряжение\n• Мозг не отличает реальную угрозу от воображаемой\n\n**Виды тревоги:**\n• Ситуативная (перед экзаменом)\n• Генерализованная (постоянно)\n• Паническая (приступы)\n• Социальная (в обществе)\n\n**Методы:**\n• Дыхание 4-7-8\n• Заземление 5-4-3-2-1\n• КПТ: мысль → доказательства → альтернатива\n• Физическая активность\n• Ограничение кофеина\n\n**Когда к врачу:** Если тревога мешает жить >2 недель.',practice:'Практикуй дыхание 4-7-8 при тревоге. 4 цикла.',reflection:'Что запускает твою тревогу?'},
{title:'Гнев — энергия защиты',theory:'Гнев — это **реакция на нарушение границ**.\n\n**Что стоит за гневом:**\n• Боль\n• Страх\n• Беспомощность\n• Стыд\n\n**Как управлять:**\n1. Пауза 6 секунд (нейроны успокаиваются)\n2. Дыхание\n3. "Я-сообщение": "Я чувствую гнев, когда..."\n4. Физическая разрядка\n5. Анализ: что нарушено?\n\n**Что НЕ работает:**\n• Подавление (→ депрессия)\n• Взрыв (→ проблемы)\n• Алкоголь\n\n**Стоицизм:** "Ты не можешь контролировать другого. Ты можешь контролировать свою реакцию."',practice:'Вспомни ситуацию гнева. Напиши "Я-сообщение".',reflection:'Что стоит за твоим гневом?'},
{title:'Депрессия — не лень',theory:'Депрессия — **медицинский диагноз**, а не слабость.\n\n**Симптомы (>2 недель):**\n• Подавленность\n• Ангедония (ничего не радует)\n• Нарушения сна\n• Усталость\n• Чувство вины\n• Проблемы с концентрацией\n• Суицидальные мысли\n\n**Что происходит в мозге:**\n• Нарушение нейропластичности\n• Воспаление\n• Дисбаланс нейромедиаторов\n\n**Лечение:**\n• Психотерапия (КПТ, 70% эффективность)\n• Антидепрессанты (при необходимости)\n• Физическая активность\n• Светотерапия\n• Социальная поддержка\n\n**Важно:** Депрессия лечится! Обратись к специалисту.',practice:'Оцени своё состояние по шкале 1-10. Если <5 — обратись.',reflection:'Что приносило радость раньше?'},
{title:'Выгорание — истощение ресурсов',theory:'Выгорание — **хронический стресс без восстановления**.\n\n**3 компонента (ВОЗ):**\n1. Истощение\n2. Цинизм\n3. Снижение эффективности\n\n**Стадии:**\n1. Напряжение\n2. Истощение\n3. Деперсонализация\n4. Кризис\n\n**Что делать:**\n• Отдых (недели, не дни)\n• Снижение нагрузки на 50%\n• Границы\n• Сон 8-9 часов\n• Питание\n• Смысл\n• Помощь специалиста\n\n**Профилактика:**\n• Регулярный отдых\n• Хобби\n• Социальные связи\n• Физическая активность\n• Медитация',practice:'Оцени уровень выгорания 1-10. Что можно снизить?',reflection:'Что забирает твою энергию?'}]},
{id:'l1m3',title:'Продуктивность',emoji:'⚡',desc:'Система работы',lessons:[
{title:'Целеполагание SMART',theory:'**SMART:**\n• S — Specific (Конкретная)\n• M — Measurable (Измеримая)\n• A — Achievable (Достижимая)\n• R — Relevant (Актуальная)\n• T — Time-bound (Ограниченная по времени)\n\n**Пример:**\n❌ "Хочу похудеть"\n✅ "Сбросить 5 кг за 3 месяца через дефицит 300 ккал и 3 тренировки в неделю"\n\n**OKR:**\n• Objective — качественная цель\n• Key Results — 3-5 измеримых результатов\n\n**Пирамида:**\n• Миссия (10 лет)\n• Долгосрочные цели (3-5 лет)\n• Годовые\n• Месячные\n• Недельные\n• Ежедневные',practice:'Сформулируй 3 SMART-цели на месяц.',reflection:'Какая цель действительно важна?'},
{title:'Матрица Эйзенхауэра',theory:'**4 квадранта:**\n\n🔥 Q1: Важно + Срочно\n• Кризисы, дедлайны\n• Делать немедленно\n\n📌 Q2: Важно + Не срочно\n• Развитие, планирование\n• **Самый важный квадрант**\n• Планировать\n\n⚡ Q3: Не важно + Срочно\n• Чужие дела, встречи\n• Делегировать\n\n🗑 Q4: Не важно + Не срочно\n• Зависание, соцсети\n• Удалить\n\n**Правило:** 60-70% времени в Q2.\n\n**Вопросы:**\n• Что случится, если не сделать?\n• Кто ещё может это сделать?\n• Можно ли автоматизировать?',practice:'Распредели 10 текущих задач по матрице.',reflection:'Почему ты застреваешь в Q1?'},
{title:'Deep Work — глубокая работа',theory:'Deep Work (Кэл Ньюпорт) — **концентрация без отвлечений**.\n\n**Почему важно:**\n• 1 час Deep Work = 3-5 часов поверхностной\n• Развивает навыки быстро\n• Создаёт ценность\n\n**Методы:**\n1. Монашеский — полная изоляция\n2. Двухрежимный — дни Deep Work\n3. Ритмический — блоки каждый день\n4. Журналистский — в любое время\n\n**Правила:**\n• Телефон в другой комнате\n• Блок 90 минут\n• Одна задача\n• Ритуал входа\n• 15 минут отдыха\n\n**Метрики:**\n• Часы Deep Work\n• Задачи выполнены\n• Уровень фокуса',practice:'Проведи 90-минутный блок Deep Work. Без телефона.',reflection:'Что тебя отвлекает чаще всего?'},
{title:'GTD — Getting Things Done',theory:'GTD (Дэвид Аллен) — **система управления задачами**.\n\n**5 шагов:**\n1. **Capture** — Собери всё в inbox\n2. **Clarify** — Что это? Действие?\n3. **Organize** — Проекты, контексты, даты\n4. **Reflect** — Обзор еженедельно\n5. **Engage** — Делай\n\n**Принципы:**\n• Голова — для идей, не для памяти\n• Всё вне головы\n• Контексты (@дом, @работа, @звонки)\n• 2-минутное правило\n• Weekly review\n\n**Инструменты:** Notion, Obsidian, Todoist',practice:'Собери все задачи в один список. Обработай.',reflection:'Что ты держишь в голове?'},
{title:'Pomodoro Technique',theory:'Pomodoro (Франческо Чирилло) — **интервальная работа**.\n\n**Схема:**\n• 25 минут работа\n• 5 минут перерыв\n• 4 цикла\n• 30 минут большой перерыв\n\n**Почему работает:**\n• Снижает тревогу ("только 25 минут")\n• Учитывает ультрадианные ритмы\n• Даёт структуру\n• Учит оценке времени\n\n**Вариации:**\n• 50/10\n• 90/15\n• Custom\n\n**Правила:**\n• Одна задача\n• Не прерывать\n• Записывать отвлечения\n• Отдых без экрана',practice:'Сделай 4 помидора. Запиши результат.',reflection:'Сколько помидоров комфортно?'}]}]},
{id:'l2',num:2,title:'База',subtitle:'Ученик',emoji:'📚',desc:'Эмоции, привычки, энергия.',modules:[
{id:'l2m1',title:'Эмоциональная регуляция',emoji:'🌊',desc:'Управление состоянием',lessons:[
{title:'КПТ — Когнитивно-поведенческая терапия',theory:'КПТ (Аарон Бек) — **самый исследованный метод**.\n\n**Модель:**\nСитуация → Мысль → Эмоция → Реакция\n\n**Искажения:**\n1. Катастрофизация ("всё пропало")\n2. Чёрно-белое ("или всё, или ничего")\n3. Сверхобобщение ("всегда так")\n4. Чтение мыслей\n5. Предсказание будущего\n\n**Техника:**\n1. Запиши ситуацию\n2. Автоматическая мысль\n3. Доказательства за/против\n4. Альтернативная мысль\n5. Проверь\n\n**Эффективность:** 70% при депрессии и тревоге.',practice:'Заполни таблицу КПТ для 3 ситуаций.',reflection:'Какое искажение твоё самое частое?'},
{title:'ACT — Принятие и ответственность',theory:'ACT (Стивен Хейс) — **терапия принятия**.\n\n**6 процессов:**\n1. Принятие (не борьба)\n2. Когнитивное разделение\n3. Настоящий момент\n4. Наблюдатель (Self)\n5. Ценности\n6. Действие\n\n**Техники:**\n• "Я замечаю мысль, что..."\n• Листья на реке\n• Дыхание\n• Заземление\n\n**Отличие от КПТ:** Не меняем мысли, меняем отношение.\n\n**Ключ:** Мысли — не факты. Ты — не свои мысли.',practice:'Практикуй "Я замечаю мысль, что..." неделю.',reflection:'С какой мыслью ты борешься?'},
{title:'Дневник эмоций',theory:'**Назови эмоцию — снизь её силу на 30%.**\n\n**Структура:**\n• Что произошло?\n• Что я почувствовал?\n• Где в теле?\n• Что я подумал?\n• Что сделал?\n• Что можно было иначе?\n\n**Зачем:**\n• Осознанность\n• Паттерны\n• Регуляция\n• Рост\n\n**Советы:**\n• 5-10 минут в день\n• Без цензуры\n• Честно\n• Регулярно\n\n**Инструменты:** Приложение, блокнот, Obsidian.',practice:'Веди дневник 7 дней. По 5 минут.',reflection:'Какой паттерн ты замечаешь?'},
{title:'Медитация и осознанность',theory:'Медитация — **тренировка внимания**.\n\n**Виды:**\n• Фокус на дыхании\n• Сканирование тела\n• Метта (любящая доброта)\n• Открытое наблюдение\n\n**Что происходит в мозге:**\n• Утолщается префронтальная кора\n• Уменьшается амигдала\n• Улучшается память\n• Снижается стресс\n\n**8 недель:**\n• -25% кортизола\n• +20% концентрации\n• +30% эмпатии\n\n**Начни с 5 минут.**',practice:'5 минут медитации утром. 7 дней.',reflection:'Что чувствуешь после?'}]},
{id:'l2m2',title:'Привычки',emoji:'🔄',desc:'Наука изменений',lessons:[
{title:'Петля привычки',theory:'**Петля:**\n1. Триггер (Cue)\n2. Желание (Craving)\n3. Действие (Response)\n4. Награда (Reward)\n\n**Открытие:** Привычки формируются в базальных ганглиях. \n\n**Правила изменения:**\n• Триггер — сделай незаметным\n• Желание — сделай непривлекательным\n• Действие — сделай сложным\n• Награда — сделай неудовлетворительной\n\n**Для новых привычек:**\n• Триггер — очевидным\n• Желание — привлекательным\n• Действие — лёгким\n• Награда — приятной',practice:'Разбери 3 свои привычки по петле.',reflection:'Какая привычка хочешь изменить?'},
{title:'Habit Stacking',theory:'**Привязка новой привычки к старой.**\n\n**Формула:**\n"После [СТАРАЯ ПРИВЫЧКА], я буду [НОВАЯ ПРИВЫЧКА]"\n\n**Примеры:**\n• После кофе → 5 минут медитации\n• После душа → 10 отжиманий\n• После ужина → прогулка\n• После чистки зубов → 1 страница\n\n**Почему работает:**\n• Старая привычка = триггер\n• Не нужно помнить\n• Встраивается в рутину\n\n**Правило:** Начни с 2 минут.',practice:'Создай 3 привязки. Запиши.',reflection:'Какая рутина уже автоматическая?'},
{title:'Правило 2 минут',theory:'**Любую привычку можно свести к 2 минутам.**\n\n**Примеры:**\n• Чтение → 1 страница\n• Бег → надеть кроссовки\n• Медитация → 3 вдоха\n• Уборка → убрать 1 вещь\n\n**Почему работает:**\n• Преодолевает сопротивление старта\n• Мозг не боится\n• Создаёт identity\n• Можно увеличить позже\n\n**Ключ:** Не важно, сколько сделал. Важно — начал.\n\n**Идентичность:** "Я — человек, который..."',practice:'Начни с 2 минут. Не больше. Неделю.',reflection:'Что ты откладываешь?'},
{title:'Правило "не пропускай дважды"',theory:'**Один пропуск — случайность. Два — начало новой привычки.**\n\n**Почему:**\n• Мозг учится\n• Один раз — ок\n• Два — паттерн\n\n**Что делать:**\n• Пропустил — не вини\n• Вернись на следующий день\n• Анализируй: что помешало?\n• Планируй\n\n**66 дней:** Среднее время формирования привычки.\n\n**Прогресс:** Не идеально. Регулярно.',practice:'Создай план возврата для своей привычки.',reflection:'Что тебя останавливает?'}]},
{id:'l2m3',title:'Энергия и восстановление',emoji:'🔋',desc:'Управление ресурсами',lessons:[
{title:'Аудит энергии',theory:'**Что даёт энергию:**\n• Сон\n• Питание\n• Движение\n• Смысл\n• Связи\n• Природа\n• Творчество\n• Отдых\n\n**Что забирает:**\n• Стресс\n• Конфликты\n• Многозадачность\n• Соцсети\n• Новости\n• Хаос\n• Токсичные люди\n\n**Практика:** Записывай 1-10 энергию каждый час. Неделю.',practice:'Аудит энергии: 7 дней, каждый час.',reflection:'Что даёт тебе больше всего энергии?'},
{title:'Ультрадианные ритмы',theory:'**90 минут — цикл активности.**\n\n**Схема:**\n• 90 минут работа\n• 15-20 минут отдых\n• 4-5 циклов в день\n\n**Признаки перегрузки:**\n• Трудно думать\n• Раздражение\n• Ошибки\n• Желание сладкого\n\n**Отдых:**\n• Без экрана\n• Движение\n• Вода\n• Дыхание\n\n**Игнорирование:** Приводит к выгоранию.',practice:'Работай блоками 90/15. Неделю.',reflection:'Как ты отдыхаешь?'},
{title:'Микроперерывы',theory:'**Каждый час — 2 минуты.**\n\n**Что делать:**\n• Встать\n• Размяться\n• Дыхание\n• Вода\n• Посмотреть вдаль\n• Не телефон!\n\n**Почему:**\n• Сохраняет фокус\n• Снижает усталость\n• Предотвращает бОли\n• Улучшает зрение\n\n**20-20-20:** Каждые 20 минут смотреть 20 секунд на 20 метров.\n\n**Правило:** Лучше чаще и короче, чем редко и долго.',practice:'Каждый час — 2 минуты движения. 3 дня.',reflection:'Что ты чувствуешь после перерыва?'},
{title:'Отдых: наука восстановления',theory:'**Отдых — это не безделье.**\n\n**Виды отдыха:**\n• Физический — сон, массаж\n• Умственный — медитация, тишина\n• Сенсорный — темнота, тишина\n• Эмоциональный — тишина, природа\n• Социальный — одиночество\n• Творческий — новое\n• Духовный — молитва, природа\n\n**Что не отдых:**\n• Соцсети (нагрузка)\n• Новости (стресс)\n• Бесконечные сериалы\n• Работа\n\n**Правило:** Разный отдых для разной усталости.',practice:'Выбери вид отдыха для своей усталости.',reflection:'Какой отдых ты игнорируешь?'}]}]},
{id:'l3',num:3,title:'Практика',subtitle:'Практик',emoji:'🎯',desc:'Продуктивность, отношения, финансы.',modules:[
{id:'l3m1',title:'Продвинутая продуктивность',emoji:'⚡',desc:'Мастерство работы',lessons:[
{title:'Планирование недели',theory:'**Еженедельный обзор:**\n• Воскресенье 30 минут\n• Что сделано?\n• Что не сделано?\n• Что важно на неделю?\n• 3 главные цели\n• Календарь\n\n**Принципы:**\n• 3 главные задачи в день\n• Буферы\n• Не планировать всё\n• Гибкость\n\n**Инструменты:** Notion, Google Calendar.',practice:'Проведи недельный обзор в воскресенье.',reflection:'Что ты планируешь?'},
{title:'Time-blocking',theory:'**Time-blocking (Илон Маск) — планирование блоками.**\n\n**Как:**\n• Список задач\n• Оценка времени\n• Слоты в календаре\n• Буферы\n• Корректировка\n\n**Правила:**\n• Блоки по 30-90 минут\n• Одна задача\n• Телефон в авиарежим\n• Не нарушать\n\n**Преимущество:** Видишь, куда идёт время.',practice:'Запланируй завтра по блокам.',reflection:'Куда уходит твоё время?'},
{title:'Eat That Frog',theory:'**Съешь лягушку (Брайан Трейси).**\n\n**Принцип:**\n• Самая сложная задача — утром\n• Не откладывать\n• Сделал — день удался\n\n**Как:**\n1. Определи "лягушку"\n2. Утром, без отвлечений\n3. Не проверяй телефон\n4. Сделай\n\n**Почему работает:**\n• Утро — пик энергии\n• Освобождает ум\n• Создаёт momentum\n\n**Правило:** Не делай ничего, пока не съешь лягушку.',practice:'Определи лягушку на завтра. Съешь утром.',reflection:'Что ты откладываешь?'},
{title:'GTD продвинутый',theory:'**GTD на практике:**\n\n**Inbox:** Всё сюда\n**Projects:** >1 действие\n**Contexts:** @дом, @работа, @звонки\n**Waiting:** Ждём\n**Someday:** Когда-нибудь\n**Calendar:** Время\n**Next Actions:** Конкретные\n\n**Weekly Review:**\n• Inbox до нуля\n• Обзор проектов\n• Обзор календаря\n• Планирование\n\n**Правило:** Голова для идей, система для задач.',practice:'Проведи полный недельный обзор.',reflection:'Что ты держишь в голове?'}]},
{id:'l3m2',title:'Отношения и коммуникация',emoji:'💞',desc:'Глубина связей',lessons:[
{title:'Активное слушание',theory:'**3 уровня слушания:**\n1. Игнорирование\n2. Слушаю, но думаю о своём\n3. Активное слушание\n\n**Активное слушание:**\n• Визуальный контакт\n• Не перебивать\n• Перефразировать\n• Задавать вопросы\n• Эмпатия\n\n**Фразы:**\n• "Правильно ли я понимаю..."\n• "Что ты чувствуешь?"\n• "Расскажи больше"\n\n**69% конфликтов — из-за непонимания.**',practice:'Практикуй парафраз в 3 разговорах.',reflection:'Ты действительно слушаешь?'},
{title:'Я-сообщения',theory:'**Формула:**\n"Я чувствую [эмоция], когда [ситуация], потому что [потребность]"\n\n**Примеры:**\n❌ "Ты меня не слушаешь!"\n✅ "Я чувствую себя одиноко, когда не получаю ответа, потому что мне важно быть услышанным"\n\n**Почему:**\n• Не обвиняет\n• Выражает чувства\n• Открывает диалог\n• Снижает защиту\n\n**Практика:** Замени "Ты" на "Я".',practice:'Переформулируй 3 претензии в Я-сообщения.',reflection:'Что ты говоришь вместо чувств?'},
{title:'Границы',theory:'**Границы — это не эгоизм. Это здоровье.**\n\n**Как сказать "нет":**\n• "Спасибо, но я не могу"\n• "Мне нужно время подумать"\n• "Это не входит в мои приоритеты"\n• "Я не буду это делать"\n\n**Правило:**\n• Спокойно\n• Без оправданий\n• Без агрессии\n• Уважительно\n\n**Что будет:**\n• Некоторые уйдут\n• Некоторые обидятся\n• Некоторые оценят\n\n**Ты нужен себе.**',practice:'Потренируйся говорить "нет" в безопасной ситуации.',reflection:'Где ты не можешь сказать "нет"?'},
{title:'Ремонт после конфликта',theory:'**Конфликт — норма. Важен ремонт.**\n\n**Шаги:**\n1. Остынь (20 минут)\n2. Извинись (без "но")\n3. Выслушай\n4. Признай чувства\n5. Решение\n6. Действие\n\n**Фразы:**\n• "Я был неправ"\n• "Мне жаль, что ты так чувствуешь"\n• "Как я могу исправить?"\n\n**Скорость:** Чем быстрее, тем лучше.\n\n**Правило:** Победа в споре = поражение в отношениях.',practice:'Вспомни конфликт. Что можно было иначе?',reflection:'Как ты реагируешь в конфликте?'}]},
{id:'l3m3',title:'Финансовая грамотность',emoji:'💰',desc:'Деньги под контролем',lessons:[
{title:'Бюджет 50/30/20',theory:'**Правило 50/30/20:**\n• 50% — нужды (жильё, еда, транспорт)\n• 30% — желания (развлечения, кафе)\n• 20% — сбережения и инвестиции\n\n**Как начать:**\n• Записывай расходы месяц\n• Категории\n• Автоматизация\n• Регулярно проверяй\n\n**Инструменты:** Приложение, Excel, Google Sheets.',practice:'Посчитай свой бюджет за месяц.',reflection:'Куда уходят деньги?'},
{title:'Финансовая подушка',theory:'**Подушка = 3-6 месяцев расходов.**\n\n**Зачем:**\n• Потеря работы\n• Болезнь\n• Кризис\n• Свобода\n\n**Как создать:**\n• Автоматический перевод\n• 10-20% дохода\n• Отдельный счёт\n• Не трогать\n\n**Где:** Наличные, вклад, краткосрочные облигации.\n\n**Правило:** Сначала подушка, потом инвестиции.',practice:'Посчитай свой runway. Сколько месяцев?',reflection:'Сколько тебе нужно для спокойствия?'},
{title:'Инвестиции для начинающих',theory:'**Основы:**\n• Индексные фонды (S&P 500, MSCI World)\n• Диверсификация\n• Долгосрочно (10+ лет)\n• Регулярно\n• Не пытайся угадать рынок\n\n**Правила:**\n• 100 - возраст = % акций\n• Комиссии важны\n• Сложный процент\n• Не паникуй\n\n**Что НЕ делать:**\n• Торговать\n• Вкладывать всё\n• Брать кредиты\n• Слушать гуру\n\n**Баффет:** "Индексный фонд — лучший выбор для большинства."',practice:'Изучи 2 индексных фонда. Сравни.',reflection:'Что мешает тебе инвестировать?'},
{title:'Долги и кредиты',theory:'**Снежный ком:**\n• Список долгов\n• Минимум по всем\n• Максимум на самый маленький\n• Закрыл → следующий\n\n**Лавина:**\n• Список по ставке\n• Максимум на самый дорогой\n• Экономия на процентах\n\n**Правила:**\n• Не брать новые\n• Не платить только минимум\n• Рефинансировать\n• Кредитная карта — не деньги',practice:'Список всех долгов. Стратегия.',reflection:'Что тебя тревожит в долгах?'}]}]},
{id:'l4',num:4,title:'Мастерство',subtitle:'Мастер',emoji:'👑',desc:'Смысл, лидерство, глубина.',modules:[
{id:'l4m1',title:'Смысл и ценности',emoji:'🎯',desc:'Что действительно важно',lessons:[
{title:'Икигай',theory:'**Икигай — японский смысл жизни.**\n\n**4 круга:**\n1. Что я люблю?\n2. Что я умею?\n3. За что платят?\n4. Что нужно миру?\n\n**Пересечение = Икигай.**\n\n**Практика:**\n• Напиши ответы\n• Найди пересечения\n• Это не цель, а путь\n• Меняется со временем\n\n**Окинава:** Люди живут дольше, потому что имеют икигай.',practice:'Нарисуй 4 круга. Заполни.',reflection:'Что даёт тебе смысл?'},
{title:'Логотерапия Франкла',theory:'**Виктор Франкл — выжил в концлагере.**\n\n**3 источника смысла:**\n1. Труд (создание)\n2. Любовь (переживание)\n3. Страдание (отношение)\n\n**Цитата:** "Тот, кто знает Зачем, вынесет почти любое Как."\n\n**Практика:**\n• Найди "Зачем"\n• Прими страдание\n• Ответственность\n• Действуй\n\n**Ключ:** Смысл не создаётся, а находится.',practice:'Ответь: ради чего ты живёшь?',reflection:'Что даёт тебе смысл?'},
{title:'Стоицизм',theory:'**Стоицизм — философия контроля.**\n\n**Дихотомия контроля:**\n• В моей власти: мысли, действия, реакции\n• Вне: мнения, результаты, другие\n\n**Практики:**\n• Утреннее планирование\n• Вечерняя рефлексия\n• Memento mori\n• Представление худшего\n• Благодарность\n\n**Цитата Марка Аврелия:** "Ты имеешь власть над своим умом, а не над внешними событиями. Осознай это и обретёшь силу."',practice:'Вечером: что в моей власти? Что нет?',reflection:'О чём ты тревожишься?'},
{title:'Ценности',theory:'**Ценности — компас.**\n\n**Список:**\n• Семья\n• Здоровье\n• Свобода\n• Творчество\n• Развитие\n• Честность\n• Помощь\n• Красота\n• Приключения\n• Безопасность\n\n**Как определить:**\n• Пик-опыт\n• Гнев\n• Зависть\n• Смерть\n\n**Практика:** Выбери 5 главных.',practice:'Определи 5 главных ценностей.',reflection:'Что для тебя важно?'}]},
{id:'l4m2',title:'Лидерство',emoji:'👥',desc:'Вести за собой',lessons:[
{title:'Видение и миссия',theory:'**Видение — куда идём. Миссия — зачем.**\n\n**Как создать:**\n• Что изменится?\n• Для кого?\n• Почему я?\n• Как узнаю, что достиг?\n\n**Пример:**\n• Видение: "Мир, где каждый здоров"\n• Миссия: "Помогаю людям через AI"\n\n**Правило:** Видение вдохновляет. Миссия направляет.',practice:'Напиши видение и миссию.',reflection:'Почему за тобой пойдут?'},
{title:'Развитие команды',theory:'**Level 5 Leadership (Джим Коллинз):**\n• Скромность + воля\n• Команда сначала\n• Правда\n\n**Как развивать:**\n• Делегируй\n• Обучай\n• Доверяй\n• Обратная связь\n• Признавай\n\n**Правило:** Лидер не делает. Лидер создаёт условия.',practice:'Кого ты можешь развить?',reflection:'Ты делегируешь?'},
{title:'Обратная связь SBI',theory:'**SBI (Center for Creative Leadership):**\n• Situation — ситуация\n• Behavior — поведение\n• Impact — влияние\n\n**Пример:**\n"На встрече (S), когда ты перебил (B), я почувствовал, что мои идеи не важны (I)"\n\n**Правила:**\n• Конкретно\n• Без оценок\n• Своевременно\n• С уважением\n\n**Принимать:**\n• Не защищаться\n• Слушать\n• Благодарить\n• Действовать',practice:'Дай SBI-обратную связь.',reflection:'Как ты реагируешь на критику?'}]},
{id:'l4m3',title:'Глубинные практики',emoji:'🧘',desc:'Внутренняя работа',lessons:[
{title:'Медитация: продвинутый уровень',theory:'**8 недель MBSR:**\n• Снижение стресса\n• Улучшение памяти\n• Эмпатия\n• Иммунитет\n\n**Практики:**\n• 20-40 минут\n• Випассана\n• Метта\n• Дзадзэн\n\n**Этапы:**\n1. Концентрация\n2. Наблюдение\n3. Принятие\n4. Единство\n\n**Цель:** Не пустой ум. Осознанность.',practice:'20 минут медитации. 7 дней.',reflection:'Что ты замечаешь?'},
{title:'Работа с тенью (Юнг)',theory:'**Тень — отвергнутые части себя.**\n\n**Как найти:**\n• Что раздражает в других?\n• Что осуждаешь?\n• Что подавляешь?\n• Что проецируешь?\n\n**Интеграция:**\n• Признать\n• Принять\n• Понять\n• Использовать\n\n**Цитата:** "Пока ты не сделаешь бессознательное сознательным, оно будет управлять твоей жизнью, а ты будешь называть это судьбой."',practice:'3 раздражающих качества. Что общего?',reflection:'Что ты отвергаешь в себе?'},
{title:'Поток (Flow)',theory:'**Поток (Михай Чиксентмихайи) — оптимальное состояние.**\n\n**Условия:**\n• Ясные цели\n• Немедленная обратная связь\n• Баланс сложности и навыка\n• Концентрация\n• Контроль\n• Потеря времени\n\n**Как войти:**\n• Убери отвлечения\n• Выбери задачу\n• Настрой ритуал\n• Погрузись\n\n**Результат:** Счастье, продуктивность, рост.',practice:'Войди в поток на 90 минут.',reflection:'Когда ты в потоке?'}]}]},
{id:'l5',num:5,title:'Трансформация',subtitle:'Наставник',emoji:'🌟',desc:'Интеграция всего.',modules:[
{id:'l5m1',title:'Система жизни',emoji:'🔗',desc:'Соединить всё',lessons:[
{title:'Утренняя рутина',theory:'**Утро определяет день.**\n\n**Схема (2 часа):**\n• 5:30 Пробуждение\n• 5:35 Вода + свет\n• 5:45 Дыхание\n• 6:00 Медитация\n• 6:20 Движение\n• 6:50 Душ\n• 7:00 Чтение\n• 7:30 Завтрак\n• 8:00 Deep Work\n\n**Принципы:**\n• Без телефона\n• Ритуал\n• Постепенно\n• Персонально',practice:'Создай утреннюю рутину. Начни с 3 пунктов.',reflection:'Что ты делаешь утром?'},
{title:'Вечерняя рутина',theory:'**Вечер — восстановление.**\n\n**Схема:**\n• 19:00 Ужин\n• 20:00 Рефлексия\n• 20:30 Без экранов\n• 21:00 Чтение\n• 21:30 Ритуал сна\n• 22:00 Сон\n\n**Что делать:**\n• Дневник\n• Планирование\n• Чтение\n• Медитация\n• Ванна\n\n**Что не делать:**\n• Телефон\n• Новости\n• Работа\n• Алкоголь',practice:'Создай вечернюю рутину. 7 дней.',reflection:'Что мешает засыпать?'},
{title:'Недельный обзор',theory:'**30 минут в воскресенье.**\n\n**Структура:**\n1. Что сделано?\n2. Что не сделано?\n3. Уроки\n4. 3 цели на неделю\n5. Календарь\n6. Приоритеты\n\n**Вопросы:**\n• Что работало?\n• Что нет?\n• Что изменить?\n• Что важно?\n\n**Результат:** Ясность, контроль, направление.',practice:'Проведи недельный обзор.',reflection:'Что ты замечаешь?'},
{title:'Квартальный обзор',theory:'**3 часа раз в 3 месяца.**\n\n**Структура:**\n1. Цели квартала\n2. Результаты\n3. Уроки\n4. Цели на квартал\n5. Система\n\n**Вопросы:**\n• Что достиг?\n• Что не так?\n• Что изменить?\n• Куда иду?\n\n**Результат:** Стратегическое направление.',practice:'Проведи квартальный обзор.',reflection:'Куда ты идёшь?'}]},
{id:'l5m2',title:'Передача знаний',emoji:'📖',desc:'Учить других',lessons:[
{title:'Менторство',theory:'**Ментор — тот, кто ведёт.**\n\n**Как менторить:**\n• Задавай вопросы\n• Не давай ответы\n• Слушай\n• Поддерживай\n• Направляй\n\n**GROW:**\n• Goal\n• Reality\n• Options\n• Will\n\n**Правило:** Ментор не решает. Ментор помогает решить.',practice:'Помоги 1 человеку на этой неделе.',reflection:'Кто твой ментор?'},
{title:'Публичные выступления',theory:'**Структура:**\n• Hook — захват\n• Проблема\n• Решение\n• Примеры\n• Призыв\n\n**Советы:**\n• Знай аудиторию\n• Репетируй\n• Дыши\n• Смотри\n• Паузы\n\n**Правило:** Люди не запомнят факты. Они запомнят чувства.',practice:'Подготовь 3-минутное выступление.',reflection:'О чём ты можешь говорить?'},
{title:'Писательство',theory:'**Как писать:**\n• Пиши как говоришь\n• Коротко\n• Ясно\n• Структура\n• Правь\n\n**Формулы:**\n• AIDA\n• PAS\n• Storytelling\n\n**Практика:**\n• 500 слов в день\n• Дневник\n• Статьи\n• Посты\n\n**Правило:** Если не можешь объяснить 12-летнему — не понял сам.',practice:'Напиши 500 слов на тему.',reflection:'Что ты хочешь передать?'}]},
{id:'l5m3',title:'Философия жизни',emoji:'🏛',desc:'Что понял',lessons:[
{title:'Личная философия',theory:'**Философия — система убеждений.**\n\n**Элементы:**\n• Взгляд на мир\n• Ценности\n• Смысл\n• Этика\n• Отношения\n• Работа\n• Здоровье\n• Деньги\n\n**Как создать:**\n• Читай\n• Думай\n• Пиши\n• Проверяй\n• Меняй\n\n**Правило:** Философия не догма. Путь.',practice:'Напиши свою философию. 10 строк.',reflection:'Во что ты веришь?'},
{title:'Наследие',theory:'**Memento mori — помни о смерти.**\n\n**Вопросы:**\n• Что останется после тебя?\n• Что ты создал?\n• Кого изменил?\n• Что важно?\n\n**Практика:**\n• 3 вещи, которые хочешь оставить\n• 1 действие сегодня\n\n**Цитата:** "Живи так, чтобы твоя жизнь была произведением искусства."',practice:'Что ты хочешь оставить после себя?',reflection:'Ради чего ты живёшь?'},
{title:'Интеграция',theory:'**Всё связано.**\n\n**Сферы:**\n• Тело\n• Разум\n• Эмоции\n• Дух\n• Финансы\n• Карьера\n• Отношения\n• Среда\n• Восстановление\n\n**Баланс:**\n• Не идеальный\n• Динамический\n• Осознанный\n\n**Практика:**\n• Оценивай\n• Корректируй\n• Действуй\n\n**Цель:** Жить полноценно.',practice:'Оцени все 9 доменов. Что подтянуть?',reflection:'Что для тебя полноценная жизнь?'}]}]}

function checkLevelComplete(s,levelId){var level=LEARNING_LEVELS.find(function(l){return l.id===levelId});if(!level)return false;for(var m=0;m<level.modules.length;m++){var mod=level.modules[m];for(var l=0;l<mod.lessons.length;l++){var key=levelId+'_'+mod.id+'_'+l;if(!s.levelProgress||!s.levelProgress[key])return false}}return true}

function checkAchievements(){var unlocked=state.profile.achievements||[];var newOnes=[];for(var i=0;i<ACHIEVEMENTS.length;i++){var a=ACHIEVEMENTS[i];if(unlocked.indexOf(a.id)<0&&a.check(state)){unlocked.push(a.id);newOnes.push(a)}}state.profile.achievements=unlocked;if(newOnes.length){save();newOnes.forEach(function(a,idx){setTimeout(function(){toast('🏆 '+a.name,'success',3500);playAchievementSound();haptic('success')},idx*800)})}}

function getLevelProgress(levelId){var level=LEARNING_LEVELS.find(function(l){return l.id===levelId});if(!level)return{done:0,total:0,pct:0};var total=0,done=0;level.modules.forEach(function(mod){mod.lessons.forEach(function(l,idx){total++;if(state.levelProgress&&state.levelProgress[levelId+'_'+mod.id+'_'+idx])done++})});return{done:done,total:total,pct:total>0?Math.round(done/total*100):0}}
function isLevelUnlocked(levelId){var idx=LEARNING_LEVELS.findIndex(function(l){return l.id===levelId});if(idx<=0)return true;var prev=LEARNING_LEVELS[idx-1];return getLevelProgress(prev.id).pct===100}
function isModuleUnlocked(level,moduleIdx){if(moduleIdx===0)return true;var prevMod=level.modules[moduleIdx-1];return prevMod.lessons.every(function(l,idx){return state.levelProgress[level.id+'_'+prevMod.id+'_'+idx]})}
function isLessonUnlocked(level,module,lessonIdx){if(lessonIdx===0)return true;var key=level.id+'_'+module.id+'_'+(lessonIdx-1);return !!state.levelProgress[key]}

function renderLearning(){var totalDone=0,totalLessons=0;LEARNING_LEVELS.forEach(function(level){var p=getLevelProgress(level.id);totalDone+=p.done;totalLessons+=p.total});var overallPct=totalLessons?Math.round(totalDone/totalLessons*100):0;var html='<div class="page"><div class="title-xl">Обучение</div>';html+='<div class="card card-gradient"><div style="opacity:.9;font-size:13px;margin-bottom:6px;">Общий прогресс</div><div style="font-size:44px;font-weight:800;line-height:1;margin-bottom:12px;">'+overallPct+'%</div><div style="opacity:.9;font-size:13px;">'+totalDone+' из '+totalLessons+' уроков</div><div class="progress" style="margin-top:14px;background:rgba(255,255,255,.25);height:8px;"><div class="progress-fill" style="width:'+overallPct+'%;background:#fff;"></div></div></div>';LEARNING_LEVELS.forEach(function(level){var p=getLevelProgress(level.id);var unlocked=isLevelUnlocked(level.id);var completed=p.pct===100;var cls='level-card';if(completed)cls+=' completed';else if(!unlocked)cls+=' locked';else if(p.pct>0)cls+=' active';html+='<div class="'+cls+'" onclick="'+(unlocked?'openLevel(\''+level.id+'\')':'toast(\'Заверши предыдущий\',\'warning\')')+'"><div class="level-header"><div class="level-num">'+(completed?'✓':level.num)+'</div><div class="level-info"><div class="level-title">'+level.emoji+' '+level.title+'</div><div class="level-subtitle">'+level.subtitle+'</div><div class="level-meta"><span>'+level.modules.length+' модулей</span><span>'+level.modules.reduce(function(a,m){return a+m.lessons.length},0)+' уроков</span></div></div></div><div class="level-desc">'+level.desc+'</div>';if(unlocked&&p.pct>0)html+='<div class="progress"><div class="progress-fill" style="width:'+p.pct+'%;"></div></div>';html+='</div>'});html+='</div>';document.getElementById('app').innerHTML=html}

function renderLevelDetail(){var level=LEARNING_LEVELS.find(function(l){return l.id===currentLevelId});if(!level){navigate('learning');return}var p=getLevelProgress(level.id);var html='<div class="page">';html+='<button class="btn btn-ghost btn-sm" onclick="navigate(\'learning\')" style="margin-bottom:16px;">← Все уровни</button>';html+='<div style="text-align:center;margin-bottom:24px;"><div style="font-size:64px;margin-bottom:12px;">'+level.emoji+'</div><div class="title-xl" style="margin-bottom:8px;">Уровень '+level.num+': '+level.title+'</div><div class="footnote text-secondary" style="max-width:340px;margin:0 auto;">'+level.desc+'</div></div>';html+='<div class="card"><div class="row-between mb-2"><span class="subhead">Прогресс</span><span class="subhead text-secondary">'+p.done+'/'+p.total+'</span></div><div class="progress"><div class="progress-fill" style="width:'+p.pct+'%;"></div></div></div>';html+='<div class="card"><h2>📦 Модули</h2>';level.modules.forEach(function(mod,i){var unlocked=isModuleUnlocked(level,i);var modDone=mod.lessons.every(function(l,idx){return state.levelProgress[level.id+'_'+mod.id+'_'+idx]});var modCount=mod.lessons.filter(function(l,idx){return state.levelProgress[level.id+'_'+mod.id+'_'+idx]}).length;var cls='module-card';if(modDone)cls+=' completed';else if(!unlocked)cls+=' locked';html+='<div class="'+cls+'" onclick="'+(unlocked?'openModule(\''+level.id+'\',\''+mod.id+'\')':'toast(\'Сначала предыдущий\',\'warning\')')+'"><div class="module-header"><div class="module-icon">'+(modDone?'✓':mod.emoji)+'</div><div class="module-info"><div class="module-title">'+mod.title+'</div><div class="module-meta">'+modCount+'/'+mod.lessons.length+' уроков'+(unlocked?'':' · 🔒')+'</div></div></div><div class="module-desc">'+mod.desc+'</div></div>'});html+='</div></div>';document.getElementById('app').innerHTML=html}

function openLesson(idx){currentLessonIdx=idx;var level=LEARNING_LEVELS.find(function(l){return l.id===currentLevelId});if(!level)return;var module=level.modules.find(function(m){return m.id===currentModuleId});if(!module)return;var lesson=module.lessons[idx];if(!lesson)return;var key=level.id+'_'+module.id+'_'+idx;var isDone=!!state.levelProgress[key];var html='<div class="page">';html+='<button class="btn btn-ghost btn-sm" onclick="navigate(\'moduleDetail\')" style="margin-bottom:16px;">← К урокам</button>';html+='<div style="margin-bottom:20px;"><div class="footnote text-tertiary" style="margin-bottom:8px;">Уровень '+level.num+' · '+module.title+' · Урок '+(idx+1)+'/'+module.lessons.length+'</div><div style="font-size:26px;font-weight:800;line-height:1.2;">'+lesson.title+'</div></div>';html+='<div class="card" style="padding:20px;">';html+='<div class="lesson-section"><div class="lesson-section-title">📚 Теория</div><div class="lesson-content">'+formatLesson(lesson.theory)+'</div></div>';html+='<div class="lesson-section practice"><div class="lesson-section-title">🎯 Практика</div><div class="lesson-content">'+esc(lesson.practice)+'</div></div>';html+='<div class="lesson-section reflection"><div class="lesson-section-title">💭 Рефлексия</div><div class="lesson-content">'+esc(lesson.reflection)+'</div></div></div>';if(!isDone){html+='<button class="btn btn-primary btn-block" onclick="completeLesson()">✓ Изучено</button>'}else{html+='<div class="badge badge-success" style="display:block;text-align:center;padding:14px;font-size:14px;">✓ Урок изучен</div>';if(idx<module.lessons.length-1){html+='<button class="btn btn-primary btn-block mt-3" onclick="openLesson('+(idx+1)+')">Следующий →</button>'}else{html+='<button class="btn btn-success btn-block mt-3" onclick="navigate(\'moduleDetail\')">Модуль завершён ✓</button>'}}html+='</div>';document.getElementById('app').innerHTML=html;window.scrollTo({top:0})}

function formatLesson(text){var h=esc(text);h=h.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');h=h.replace(/^• (.+)$/gm,'<li>$1</li>');h=h.replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g,'<ul>$1</ul>');h=h.replace(/\n\n/g,'</p><p>');h=h.replace(/\n/g,'<br>');return '<p>'+h+'</p>'}

async function callAI(persona,userText){var key=state.settings.apiKey||(state.integrations.gemini&&state.integrations.gemini.apiKey);var provider=state.settings.provider||'gemini';if(!key)return fallbackReply(persona,userText);var p=PERSONAS[persona];var history=state.chats.filter(function(c){return c.persona===persona}).slice(-10);var messages=[{role:'system',content:p.prompt}];history.forEach(function(m){messages.push({role:m.role==='user'?'user':'assistant',content:m.text})});try{if(provider==='openai'){var resp=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model:'gpt-4o-mini',messages:messages,temperature:.8,max_tokens:800})});var data=await resp.json();return (data.choices&&data.choices[0]&&data.choices[0].message&&data.choices[0].message.content)||fallbackReply(persona,userText)}else{var sys=p.prompt;var rest=history.map(function(m){return{role:m.role==='user'?'user':'model',parts:[{text:m.text}]}});var model=(state.integrations.gemini&&state.integrations.gemini.model)||'gemini-1.5-flash';var resp3=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent?key='+key,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({system_instruction:{parts:[{text:sys}]},contents:rest})});var data3=await resp3.json();return (data3.candidates&&data3.candidates[0]&&data3.candidates[0].content&&data3.candidates[0].content.parts&&data3.candidates[0].content.parts[0]&&data3.candidates[0].content.parts[0].text)||fallbackReply(persona,userText)}}catch(e){console.error(e);return fallbackReply(persona,userText)}}

function fallbackReply(persona,text){text=text||'';if(/суицид|покончить|не хочу жить|умереть/i.test(text)){return '🆘 Позвони: 8-800-2000-122 (РФ) · 103 · findahelpline.com. Ты важен.'}if(persona==='doctor')return 'Я — AI-консультант. Опиши симптомы.\n\n*⚠️ Не заменяет врача.*';if(persona==='psych')return 'Слышу тебя. Что происходит?';return 'Слышу тебя. Расскажи подробнее.'}

function finishSurvey(){var existing=document.getElementById('surveyScreen');if(existing)existing.remove();state.profile.surveyDone=true;state.profile.personalPlan=generatePlan(state.profile.surveyAnswers);save();playLevelUpSound();haptic('success');toast('🎉 Профиль заполнен! План готов.','success',4000);checkAchievements();updateHeaderAvatar();navigate('plan')}

function generatePlan(answers){if(!answers)answers={};var plan={days:[],focusDomains:[],metrics:[]};if(answers.biggestChallenge){var challengeMap={procrastination:'physical',anxiety:'emotional',burnout:'emotional',sleep:'recovery',focus:'mental',energy:'physical',money:'financial',relationships:'social',meaning:'spiritual',discipline:'mental'};plan.focusDomains.push(challengeMap[answers.biggestChallenge]||'mental')}if(answers.mainGoal){var goalMap={health:'physical',productivity:'mental',mental:'emotional',career:'career',relationships:'social',meaning:'spiritual',discipline:'recovery'};if(plan.focusDomains.indexOf(goalMap[answers.mainGoal])<0)plan.focusDomains.push(goalMap[answers.mainGoal])}var morning=[];var wake=answers.wakeTime||'7-9';if(wake==='before-6')morning.push({time:'5:30',title:'Пробуждение',desc:'Вода + свет'});else morning.push({time:'7:30',title:'Пробуждение',desc:'Вода + свет'});morning.push({time:'+15 мин',title:'Дыхание 4-7-8',desc:'4 цикла'});morning.push({time:'+30 мин',title:'Движение',desc:'Прогулка 15 мин'});morning.push({time:'+1 ч',title:'Чтение',desc:'10 страниц'});morning.push({time:'+1.5 ч',title:'Deep Work',desc:'90 минут'});var day=[{time:'12:00',title:'Обед',desc:'Белок + овощи'},{time:'14:00',title:'Медитация',desc:'10 минут'},{time:'15:00',title:'Deep Work #2',desc:'50 минут'},{time:'17:00',title:'Прогулка',desc:'20 минут'}];var evening=[{time:'19:00',title:'Ужин',desc:'Легкий'},{time:'20:00',title:'Рефлексия',desc:'Дневник'},{time:'21:00',title:'Без экранов',desc:'Книга'},{time:'22:30',title:'Сон',desc:'18-20°C'}];plan.days=[{title:'🌅 Утро',items:morning},{title:'☀️ День',items:day},{title:'🌙 Вечер',items:evening}];DOMAINS.forEach(function(d){if(plan.focusDomains.indexOf(d.id)>=0){plan.metrics.push({domain:d.name,items:d.metrics.slice(0,3)})}});return plan}

function renderPersonalPlan(){var plan=state.profile.personalPlan;if(!plan){return placeholderPage('🎯','Персональный план','Пройди опросник в профиле')}var html='<div class="page"><div class="title-xl">Твой план</div>';html+='<div class="insight-card"><div class="insight-title">✨ Фокус</div><div class="insight-text">'+plan.focusDomains.map(function(d){var dom=DOMAINS.find(function(x){return x.id===d});return dom?dom.emoji+' '+dom.name:d}).join(', ')+'</div></div>';plan.days.forEach(function(block){html+='<div class="card"><h2>'+block.title+'</h2>';block.items.forEach(function(item){html+='<div class="plan-day"><div class="plan-time">'+item.time+'</div><div class="plan-title">'+item.title+'</div><div class="plan-desc">'+item.desc+'</div></div>'});html+='</div>'});if(plan.metrics.length){html+='<div class="card"><h2>📏 Метрики</h2>';plan.metrics.forEach(function(m){html+='<div class="footnote text-secondary" style="margin-bottom:8px;font-weight:700;">'+m.domain+'</div>';m.items.forEach(function(item){html+='<div class="metric-row"><span class="metric-label">'+item.label+'</span><span class="metric-value">'+item.target+'</span></div>'})});html+='</div>'}html+='<button class="btn btn-ghost btn-block" onclick="navigate(\'metrics\')">📏 Заполнить метрики</button></div>';document.getElementById('app').innerHTML=html}

/* PROFILE */
function renderProfile(){var p=state.profile;var unlocked=p.achievements||[];var doneTasks=state.tasks.filter(function(t){return t.status==='completed'}).length;var lessonsDone=Object.keys(state.levelProgress||{}).length;var html='<div class="page"><div class="profile-hero"><div class="profile-avatar" onclick="pickEmoji()">'+p.emoji+'</div><div class="profile-name">'+esc(p.name||'Пользователь')+'</div></div>';html+='<div class="stat-grid mb-4"><div class="stat-item"><div class="stat-value">'+doneTasks+'</div><div class="stat-label">Задач</div></div><div class="stat-item"><div class="stat-value">'+lessonsDone+'</div><div class="stat-label">Уроков</div></div><div class="stat-item"><div class="stat-value">'+(state.stats.streak||0)+'</div><div class="stat-label">Streak</div></div></div>';html+='<div class="card"><h2>✏️ Имя</h2><div class="field" style="margin-bottom:0;"><input type="text" id="profile-name" value="'+esc(p.name)+'" onchange="saveProfileName(this.value)"/></div></div>';if(!p.surveyDone){html+='<div class="card" style="background:linear-gradient(135deg,rgba(255,169,64,.15),rgba(255,107,107,.1));border-color:rgba(255,169,64,.3);"><h2>📋 Опросник</h2><button class="btn btn-primary btn-block" onclick="startSurvey()">Начать</button></div>'}else{html+='<div class="card"><h2>📋 Профиль заполнен</h2><button class="btn btn-ghost btn-block" onclick="if(confirm(\'Заново?\')){state.profile.surveyDone=false;state.profile.surveyStep=0;save();startSurvey();}">Пройти заново</button></div>'}html+='<div class="card"><h2>🏆 Достижения ('+unlocked.length+'/'+ACHIEVEMENTS.length+')</h2><div class="achieve-grid">';ACHIEVEMENTS.forEach(function(a){var isUnlocked=unlocked.indexOf(a.id)>=0;html+='<div class="achieve-item '+(isUnlocked?'unlocked':'locked')+'"><div class="achieve-icon">'+a.icon+'</div><div class="achieve-name">'+a.name+'</div></div>'});html+='</div></div></div>';document.getElementById('app').innerHTML=html}

function pickEmoji(){var emojis=['😊','😎','🤓','🧑‍💻','👨‍💼','👩‍💼','🦊','🐱','🐶','🦁','🐼','🦉','🌟','⚡','🔥','💎','🚀','🎯','🧠','💪','🌈','☕','🎨','🎮','🎧','📚','🏃','🧘','🍀','🌸'];var html='<div class="emoji-grid">';emojis.forEach(function(e){var sel=e===state.profile.emoji?' selected':'';html+='<button class="emoji-pick'+sel+'" onclick="setEmoji(\''+e+'\')">'+e+'</button>'});html+='</div>';openSheet('Аватар',html)}

function setEmoji(e){state.profile.emoji=e;save();playClickSound();closeSheet();toast('Обновлено','success');renderProfile();updateHeaderAvatar()}
function saveProfileName(name){state.profile.name=(name||'').trim()||'Пользователь';save();playSuccessSound();toast('Сохранено','success');updateHeaderAvatar()}
function updateHeaderAvatar(){var el=document.getElementById('headerAvatar');if(el)el.textContent=state.profile.emoji||'👤'}

/* SETTINGS */
function renderSettings(){var html='<div class="page"><div class="title-xl">Настройки</div>';html+='<div class="card"><h2>Профиль</h2><div class="field"><label class="field-label">Имя</label><input type="text" id="s-name" value="'+esc(state.profile.name)+'" onchange="saveProfileName(this.value)"/></div><div class="list-row" onclick="openThemePicker()"><div class="list-icon" style="background:var(--surface-3);">🎨</div><div class="list-body"><div class="list-title">Тема</div></div><div class="list-value">'+(THEMES.find(function(t){return t.id===state.settings.theme})||{}).name+'</div></div></div>';html+='<div class="card"><h2>AI</h2><div class="list-row" onclick="openAISettings()"><div class="list-icon" style="background:var(--brand);">✨</div><div class="list-body"><div class="list-title">'+state.settings.provider+'</div><div class="list-subtitle">'+(state.settings.apiKey?'Ключ установлен':'Не задан')+'</div></div><div class="list-chevron">›</div></div></div>';html+='<div class="card"><h2>Интеграции</h2><div class="list-row" onclick="navigate(\'integrations\')"><div class="list-icon" style="background:var(--surface-3);">🔗</div><div class="list-body"><div class="list-title">Google, Obsidian, Gemini</div></div><div class="list-chevron">›</div></div></div>';html+='<div class="card"><h2>Данные</h2><div class="list-row" onclick="navigate(\'storage\')"><div class="list-icon" style="background:var(--coach);color:#000;">🗄</div><div class="list-body"><div class="list-title">Хранилище</div><div class="list-subtitle">Экспорт, импорт, все ключи</div></div><div class="list-chevron">›</div></div><div class="list-row" onclick="navigate(\'dbmanager\')"><div class="list-icon" style="background:var(--success);color:#000;">💾</div><div class="list-body"><div class="list-title">База данных</div></div><div class="list-chevron">›</div></div></div>';html+='<div class="footnote text-tertiary" style="text-align:center;margin-top:36px;">AI Health v26 · Neuro Ecosystem</div></div>';document.getElementById('app').innerHTML=html}

function renderDBManager(){var total=state.tasks.length+state.chats.length+state.notes.length+Object.keys(state.levelProgress||{}).length;var html='<div class="page"><div class="title-xl">База данных</div><div class="card"><div class="list-row"><div class="list-icon" style="background:var(--success);color:#000;">✓</div><div class="list-body"><div class="list-title">LocalStorage</div><div class="list-subtitle">'+STORAGE_KEY+'</div></div></div><div class="list-row"><div class="list-icon" style="background:var(--brand);">📦</div><div class="list-body"><div class="list-title">Записей</div></div><div class="list-value">'+total+'</div></div></div>';html+='<div class="card"><h2>Операции</h2><button class="btn btn-primary btn-block mb-2" onclick="exportDB()">📤 Экспорт</button><button class="btn btn-ghost btn-block mb-2" onclick="document.getElementById(\'importDB\').click()">📥 Импорт</button><input type="file" id="importDB" accept=".json" style="display:none" onchange="importDB(event)"/><button class="btn btn-danger btn-block" onclick="if(confirm(\'Сброс?\')){localStorage.removeItem(\''+STORAGE_KEY+'\');location.reload();}">🗑 Сброс</button></div></div>';document.getElementById('app').innerHTML=html}

function exportDB(){var blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='ai-health-'+today()+'.json';a.click();URL.revokeObjectURL(url);toast('Экспорт готов','success');playSuccessSound()}
function importDB(e){var file=e.target.files[0];if(!file)return;var reader=new FileReader();reader.onload=function(ev){try{var data=JSON.parse(ev.target.result);if(!confirm('Заменить?'))return;state=Object.assign(defaultState(),data);save();toast('Импорт успешен','success');playSuccessSound();location.reload()}catch(err){toast('Ошибка','error');playErrorSound()}};reader.readAsText(file)}

/* WELCOME */
function showWelcome(){var overlay=document.createElement('div');overlay.className='welcome-screen';overlay.innerHTML='<div class="welcome-logo">🧠</div><div class="welcome-title">AI Health Ecosystem</div><div class="welcome-sub">5 уровней · 60+ уроков · 9 доменов · 15+ путей · 50+ методик · Английский A1-C2 · AI-коуч, психолог, врач.</div><button class="btn btn-primary btn-block" style="max-width:340px;" onclick="startOnboarding()">Начать</button>';document.body.appendChild(overlay)}

function startOnboarding(){var w=document.querySelector('.welcome-screen');if(w)w.remove();var name=window.__tgName||'';if(!name){var overlay=document.createElement('div');overlay.className='welcome-screen';overlay.innerHTML='<div class="welcome-logo">👤</div><div class="welcome-title">Как тебя зовут?</div><input type="text" class="welcome-input" id="welcome-name" placeholder="Имя" maxlength="30"/><button class="btn btn-primary btn-block mt-4" style="max-width:340px;margin-top:16px;" onclick="finishOnboarding()">Далее</button>';document.body.appendChild(overlay);setTimeout(function(){var i=document.getElementById('welcome-name');if(i)i.focus()},300)}else{state.profile.name=name;state.settings.onboardingDone=true;save();updateHeaderAvatar();renderTabBar();renderDashboard();toast('Добро пожаловать, '+name+'!','success')}}

function finishOnboarding(){var inp=document.getElementById('welcome-name');var name=inp?inp.value.trim():'';if(!name)return toast('Введи имя','error');state.profile.name=name;state.settings.onboardingDone=true;save();var w=document.querySelector('.welcome-screen');if(w)w.remove();updateHeaderAvatar();renderTabBar();renderDashboard();playLevelUpSound();haptic('success');toast('Добро пожаловать, '+name+'!','success')}

/* INIT */
function init(){try{applyTheme(state.settings.theme);updateHeaderAvatar();if(!state.profile.name&&!state.settings.onboardingDone){showWelcome();return}if(state.profile.name&&!state.settings.onboardingDone){state.settings.onboardingDone=true;save()}if(!state.profile.name&&window.__tgName){state.profile.name=window.__tgName;save();updateHeaderAvatar()}if(state.tasks.length===0){state.tasks=[{id:uid(),title:'Завершить отчёт',category:'Работа',planned_time:45,actual_time:0,status:'pending',priority:'high',created_at:nowISO()},{id:uid(),title:'Повторить 10 слов',category:'Обучение',planned_time:15,actual_time:0,status:'pending',priority:'medium',created_at:nowISO()},{id:uid(),title:'Дневник: 3 победы',category:'Личное',planned_time:5,actual_time:0,status:'pending',priority:'medium',created_at:nowISO()}];save()}if(!state.englishProgress)state.englishProgress={};renderTabBar();renderDashboard();var t=today();if(state.stats.lastActiveDay!==t){var y=new Date();y.setDate(y.getDate()-1);state.stats.streak=state.stats.lastActiveDay===y.toISOString().slice(0,10)?(state.stats.streak||0)+1:1;state.stats.lastActiveDay=t;save()}checkAchievements()}catch(e){console.error('Init:',e);var app=document.getElementById('app');if(app)app.innerHTML='<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-title">Ошибка</div><div class="empty-text">'+esc(e.message)+'</div></div>'}}

function attachRipple(){document.addEventListener('pointerdown',function(e){var target=e.target.closest('.btn, .list-row, .chip, .tab-item, .task-item, .card, .icon-btn, .avatar-btn, .persona-item, .segmented-item, .level-card, .module-card, .lesson-row, .category-chip, .emoji-pick, .domain-card, .method-card, .course-card, .path-step, .survey-option');if(!target)return;target.classList.add('tap-ripple');var rect=target.getBoundingClientRect();target.style.setProperty('--rx',((e.clientX-rect.left)/rect.width)*100+'%');target.style.setProperty('--ry',((e.clientY-rect.top)/rect.height)*100+'%');target.classList.remove('rippling');void target.offsetWidth;target.classList.add('rippling');setTimeout(function(){target.classList.remove('rippling')},700)},{passive:true})}

window.navigate=navigate;window.openSheet=openSheet;window.closeSheet=closeSheet;window.openThemePicker=openThemePicker;window.setTheme=setTheme;window.openLevel=openLevel;window.openModule=openModule;window.openLesson=openLesson;window.completeLesson=completeLesson;window.openPath=openPath;window.openStep=openStep;window.completeStep=completeStep;window.openCourse=openCourse;window.openCourseLesson=openCourseLesson;window.completeCourseLesson=completeCourseLesson;window.openMethod=openMethod;window.openDomain=openDomain;window.saveDomainScore=saveDomainScore;window.saveMetrics=saveMetrics;window.openPersona=openPersona;window.addWater=addWater;window.quickMoodLog=quickMoodLog;window.saveMood=saveMood;window.addTask=addTask;window.saveTask=saveTask;window.toggleTask=toggleTask;window.editTask=editTask;window.updateTask=updateTask;window.deleteTask=deleteTask;window.switchPersona=switchPersona;window.sendMsg=sendMsg;window.openAISettings=openAISettings;window.saveAISettings=saveAISettings;window.pickEmoji=pickEmoji;window.setEmoji=setEmoji;window.saveProfileName=saveProfileName;window.finishOnboarding=finishOnboarding;window.startOnboarding=startOnboarding;window.startSurvey=startSurvey;window.saveSurveyAnswer=saveSurveyAnswer;window.selectSurveyOption=selectSurveyOption;window.toggleSurveyMulti=toggleSurveyMulti;window.nextSurveyStep=nextSurveyStep;window.prevSurveyStep=prevSurveyStep;window.finishSurvey=finishSurvey;window.saveGCal=saveGCal;window.saveObsidian=saveObsidian;window.exportNotesToObsidian=exportNotesToObsidian;window.saveGemini=saveGemini;window.exportDB=exportDB;window.importDB=importDB;window.openEnglishLevel=openEnglishLevel;window.openEnglishLesson=openEnglishLesson;window.completeEnglishLesson=completeEnglishLesson;

if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',function(){init();attachRipple()})}else{init();attachRipple()}
