*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter','SamsungOne',system-ui,sans-serif;font-size:16px;line-height:1.45;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;overflow-x:hidden;min-height:100dvh;letter-spacing:-.015em;transition:background .4s var(--ease),color .4s var(--ease)}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 60% 50% at 20% 10%,var(--brand),transparent 70%),radial-gradient(ellipse 50% 50% at 80% 90%,var(--brand-2),transparent 70%);pointer-events:none;z-index:0;opacity:.12;animation:auroraShift 25s ease-in-out infinite alternate}
@keyframes auroraShift{0%{transform:translate3d(0,0,0) scale(1)}100%{transform:translate3d(3%,-2%,0) scale(1.08)}}
.theme-effect{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.effect-star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;box-shadow:0 0 6px #fff;animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.7)}50%{opacity:1;transform:scale(1.3)}}
.effect-drop{position:absolute;top:-10%;width:2px;background:linear-gradient(180deg,transparent,var(--brand),transparent);animation:effectFall linear infinite;opacity:.5}
@keyframes effectFall{0%{transform:translate3d(0,0,0);opacity:0}10%{opacity:.6}90%{opacity:.6}100%{transform:translate3d(30px,110vh,0);opacity:0}}
.effect-petal{position:absolute;top:-10%;font-size:14px;animation:petalFall linear infinite;opacity:.7}
@keyframes petalFall{0%{transform:translate3d(0,-10vh,0) rotate(0);opacity:0}10%{opacity:.8}100%{transform:translate3d(100px,110vh,0) rotate(720deg);opacity:0}}
.effect-leaf{position:absolute;top:-10%;font-size:16px;animation:leafFall linear infinite;opacity:.6}
@keyframes leafFall{0%{transform:translate3d(0,-10vh,0) rotate(0);opacity:0}10%{opacity:.7}100%{transform:translate3d(-60px,110vh,0) rotate(-360deg);opacity:0}}
.effect-snowflake{position:absolute;top:-10%;color:#fff;text-shadow:0 0 8px #fff;animation:snowFall linear infinite;font-size:14px;opacity:.7}
@keyframes snowFall{0%{transform:translate3d(0,-10vh,0) rotate(0);opacity:0}10%{opacity:.8}100%{transform:translate3d(80px,110vh,0) rotate(720deg);opacity:0}}
.effect-spark{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;box-shadow:0 0 10px var(--brand);animation:sparkFlash linear infinite}
@keyframes sparkFlash{0%,100%{opacity:0;transform:scale(.5)}50%{opacity:1;transform:scale(1.5)}}
.effect-dust{position:absolute;width:2px;height:2px;border-radius:50%;background:var(--brand);box-shadow:0 0 8px var(--brand);animation:dustFloat linear infinite;opacity:.7}
@keyframes dustFloat{0%{transform:translate3d(0,0,0);opacity:0}20%{opacity:.8}80%{opacity:.5}100%{transform:translate3d(40px,-80px,0);opacity:0}}
.effect-wave{position:absolute;left:-10%;right:-10%;height:120px;background:linear-gradient(180deg,transparent 0%,var(--brand) 60%,transparent 100%);opacity:.12;animation:waveMove 8s ease-in-out infinite;filter:blur(20px);border-radius:50%}
@keyframes waveMove{0%,100%{transform:translate3d(0,0,0) scaleY(1)}50%{transform:translate3d(-40px,-15px,0) scaleY(1.2)}}
.glass{background:var(--glass-1);backdrop-filter:blur(var(--glass-blur)) saturate(180%);-webkit-backdrop-filter:blur(var(--glass-blur)) saturate(180%);border:1px solid var(--glass-border)}
.glass-strong{background:var(--glass-2);backdrop-filter:blur(var(--glass-blur-strong)) saturate(200%);-webkit-backdrop-filter:blur(var(--glass-blur-strong)) saturate(200%);border:1px solid var(--glass-border-strong)}

/* ============ ШАПКА — только 3 кнопки по центру, чуть ниже ============ */
.app-header{
  position:sticky;
  top:0;
  z-index:200;
  padding-top:calc(env(safe-area-inset-top,0px) + 14px);
  padding-bottom:10px;
  background:linear-gradient(180deg, var(--bg) 60%, transparent);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
}
.header-inner{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  max-width:760px;
  margin:0 auto;
  padding:0 12px;
}

.icon-btn{
  width:42px;
  height:42px;
  border-radius:50%;
  border:none;
  color:var(--text);
  cursor:pointer;
  display:grid;
  place-items:center;
  font-size:18px;
  background:var(--glass-2);
  border:1px solid var(--glass-border);
  transition:transform .15s var(--spring-soft), background .15s;
  -webkit-appearance:none;
  appearance:none;
  flex-shrink:0;
}
.icon-btn:active{transform:scale(.9);background:var(--glass-3)}
.avatar-btn{
  width:42px;
  height:42px;
  border-radius:50%;
  background:linear-gradient(135deg,var(--brand),var(--brand-2));
  display:grid;
  place-items:center;
  font-size:18px;
  cursor:pointer;
  border:2px solid transparent;
  box-shadow:0 4px 14px var(--brand-glow);
  flex-shrink:0;
}
.icon-btn-sm{
  width:34px;
  height:34px;
  border-radius:50%;
  background:var(--glass-2);
  border:1px solid var(--glass-border);
  color:var(--text-2);
  display:grid;
  place-items:center;
  cursor:pointer;
  font-size:14px;
}

.tab-bar-wrap{position:fixed;bottom:0;left:0;right:0;z-index:100;padding:0 8px calc(8px + var(--safe-bottom));pointer-events:none}
.tab-bar{border-radius:22px;display:flex;align-items:stretch;height:64px;box-shadow:var(--shadow-lg);width:100%;max-width:720px;margin:0 auto;pointer-events:auto;padding:4px;gap:1px;overflow:hidden;background:var(--glass-2);backdrop-filter:blur(var(--glass-blur-strong)) saturate(200%);-webkit-backdrop-filter:blur(var(--glass-blur-strong)) saturate(200%);border:1px solid var(--glass-border-strong)}
.tab-item{flex:1 1 0;min-width:0;background:transparent;border:none;color:var(--text-3);font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 2px;cursor:pointer;border-radius:16px;transition:color .2s,background .2s;overflow:hidden}
.tab-item .tab-icon{font-size:20px;line-height:1;transition:transform .2s var(--spring-soft)}
.tab-item .tab-label{font-size:9px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;line-height:1}
.tab-item.active{color:var(--brand);background:color-mix(in srgb,var(--brand) 12%,transparent)}
.tab-item.active .tab-icon{transform:scale(1.15)}

.app-main{position:relative;z-index:2;max-width:760px;margin:0 auto;width:100%;padding:14px;padding-bottom:calc(var(--tabbar-h) + var(--safe-bottom) + 70px)!important;min-height:calc(100dvh - 100px)}
.page{animation:pageIn .35s var(--spring-snap) both}
@keyframes pageIn{0%{opacity:0;transform:translate3d(0,12px,0) scale(.98)}100%{opacity:1;transform:translate3d(0,0,0) scale(1)}}
.quick-tabs{position:sticky;top:calc(56px + var(--safe-top) + 18px);z-index:50;display:flex;gap:6px;overflow-x:auto;padding:8px 4px;margin:-6px -4px 12px;background:linear-gradient(180deg,var(--bg) 60%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);scrollbar-width:none}
.quick-tabs::-webkit-scrollbar{display:none}
.quick-tab{flex-shrink:0;padding:8px 14px;border-radius:var(--r-full);background:var(--glass-2);border:1px solid var(--glass-border);color:var(--text-2);font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:inherit;transition:all .2s}
.quick-tab.active{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;border-color:transparent;box-shadow:0 4px 12px var(--brand-glow)}
.title-xl{font-size:26px;font-weight:800;line-height:1.15;margin-bottom:14px;letter-spacing:-.03em}
.title-m{font-size:18px;font-weight:700;margin-bottom:12px}
.footnote{font-size:12px}.caption{font-size:11px}.subhead{font-size:13px}
.text-secondary{color:var(--text-2)}.text-tertiary{color:var(--text-3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:11px 20px;border-radius:var(--r-full);border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;-webkit-appearance:none;transition:transform .15s var(--spring-soft);position:relative;overflow:hidden;text-align:center;line-height:1.2}
.btn:active:not(:disabled){transform:scale(.94)}
.btn-primary{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;box-shadow:0 6px 18px var(--brand-glow)}
.btn-success{background:linear-gradient(135deg,var(--success),#059669);color:#000}
.btn-warning{background:var(--warning);color:#000}
.btn-danger{background:var(--danger);color:#fff}
.btn-ghost{background:var(--glass-2);color:var(--text);border:1px solid var(--glass-border)}
.btn-sm{min-height:36px;padding:8px 16px;font-size:13px}
.btn-xs{min-height:30px;padding:6px 12px;font-size:12px}
.btn-block{width:100%;display:flex}
.btn-icon{width:42px;height:42px;min-height:42px;padding:0;border-radius:50%}
.btn-row{display:flex;gap:6px;flex-wrap:wrap;align-items:stretch}
.back-btn{display:none}
.field{margin-bottom:14px}
.field-label{display:block;font-size:11px;font-weight:700;color:var(--text-2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em}
input[type="text"],input[type="number"],input[type="datetime-local"],input[type="date"],input[type="time"],input[type="password"],input[type="email"],input[type="url"],input[type="search"],input[type="tel"],select,textarea{width:100%;min-height:44px;padding:12px 16px;background:var(--glass-2);border:1.5px solid var(--glass-border);border-radius:var(--r-lg);color:var(--text);font-family:inherit;font-size:15px;font-weight:500;-webkit-appearance:none;appearance:none;transition:border-color .15s,background .15s,box-shadow .15s}

<script>
'use strict';

/* Telegram WebApp init */
(function(){
  try{
    var tg = window.Telegram && window.Telegram.WebApp;
    if(!tg) return;
    tg.expand();
    tg.ready();
    try{tg.setHeaderColor('#000000');}catch(e){}
    try{tg.setBackgroundColor('#000000');}catch(e){}
    try{tg.disableVerticalSwipes && tg.disableVerticalSwipes();}catch(e){}
  }catch(e){}
})();

/* Обновляем аватар в шапке при смене профиля */
(function(){
  function refreshAvatar(){
    try{
      var el = document.getElementById('headerAvatar');
      if(el && typeof state !== 'undefined' && state.profile){
        el.textContent = state.profile.emoji || '👤';
      }
    }catch(e){}
  }
  setTimeout(refreshAvatar, 300);
  setTimeout(refreshAvatar, 1000);
  window.refreshHeader = refreshAvatar;
})();
</script>
