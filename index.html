<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>AI Health</title>
<script src="https://telegram.org/js/telegram-web-app.js?56"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
--bg:#000;--bg-1:#0b0b10;--bg-2:#14141b;--surface:rgba(255,255,255,.06);
--border:rgba(255,255,255,.1);--text:#fff;--text-2:rgba(255,255,255,.7);
--text-3:rgba(255,255,255,.5);--brand:#5b9eff;--brand-2:#a78bfa;
--success:#3ddc97;--warning:#ffa940;--danger:#ff6b6b;
--r:20px;--r-full:9999px;--header-h:56px;--tabbar-h:64px;
--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
--ease:cubic-bezier(.4,0,.2,1)}
body.light{--bg:#f5f5fa;--bg-1:#fff;--bg-2:#f8f8fc;--text:#000;--text-2:rgba(0,0,0,.7);--text-3:rgba(0,0,0,.5);--surface:rgba(0,0,0,.04);--border:rgba(0,0,0,.08)}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:16px;line-height:1.45;min-height:100vh;min-height:100dvh;overflow-x:hidden;letter-spacing:-.015em;transition:background .3s,color .3s;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:-20%;background:radial-gradient(ellipse 45% 35% at 20% 15%,rgba(91,158,255,.15),transparent 60%),radial-gradient(ellipse 40% 35% at 80% 85%,rgba(167,139,250,.15),transparent 60%);pointer-events:none;z-index:0}

/* HEADER */
.header{position:sticky;top:0;z-index:100;padding-top:var(--safe-top);background:rgba(0,0,0,.75);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:.5px solid var(--border)}
body.light .header{background:rgba(245,245,250,.85)}
.header-inner{height:var(--header-h);display:flex;align-items:center;justify-content:space-between;padding:0 18px;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700}
.brand-logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:grid;place-items:center;font-size:19px;color:#fff;box-shadow:0 4px 14px rgba(91,158,255,.4)}
.header-actions{display:flex;gap:6px}
.icon-btn{width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--border);color:var(--text);font-size:17px;cursor:pointer;display:grid;place-items:center;transition:transform .15s}
.icon-btn:active{transform:scale(.9)}

/* MAIN */
.main{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:18px;padding-bottom:calc(var(--tabbar-h) + var(--safe-bottom) + 40px);min-height:calc(100dvh - var(--header-h))}

/* TABBAR */
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:100;padding:6px 10px calc(6px + var(--safe-bottom));background:rgba(0,0,0,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:.5px solid var(--border);display:flex;justify-content:space-around;gap:2px;min-height:var(--tabbar-h)}
body.light .tabbar{background:rgba(255,255,255,.9)}
.tab{flex:1;min-width:0;padding:6px 2px;background:transparent;border:none;color:var(--text-3);font-family:inherit;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;border-radius:14px;transition:color .2s}
.tab .tab-icon{font-size:20px;line-height:1}
.tab .tab-label{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tab.active{color:var(--brand-2)}

/* CONTENT */
.title-xl{font-size:28px;font-weight:800;letter-spacing:-.8px;line-height:1.15;margin-bottom:20px}
.card{background:var(--bg-2);border-radius:var(--r);padding:18px;margin-bottom:14px;border:.5px solid var(--border)}
.card h2{font-size:18px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card-gradient{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;border:none}
.card-gradient h2{color:#fff}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 18px;border-radius:var(--r-full);border:none;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;transition:transform .15s;white-space:nowrap}
.btn:active{transform:scale(.95)}
.btn-primary{background:var(--brand);color:#fff}
.btn-success{background:var(--success);color:#000}
.btn-danger{background:var(--danger);color:#fff}
.btn-ghost{background:var(--surface);color:var(--text);border:1px solid var(--border)}
.btn-block{width:100%}
.btn-sm{padding:9px 14px;font-size:13px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

/* LISTS */
.list{display:flex;flex-direction:column;gap:8px}
.list-row{display:flex;align-items:center;gap:12px;padding:14px;background:var(--bg-2);border-radius:16px;border:.5px solid var(--border);cursor:pointer;transition:background .15s}
.list-row:active{background:var(--surface)}
.list-icon{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--surface);flex-shrink:0}
.list-body{flex:1;min-width:0}
.list-title{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-sub{font-size:12px;color:var(--text-3);margin-top:3px}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{text-align:center;padding:14px 8px;background:var(--bg-2);border-radius:16px;border:.5px solid var(--border)}
.stat-value{font-size:22px;font-weight:800;line-height:1}
.stat-label{font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin-top:6px}

/* TASKS */
.task{background:var(--bg-2);border-radius:16px;padding:14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;cursor:pointer}
.task.done{opacity:.5}
.task.done .task-title{text-decoration:line-through}
.task-check{width:26px;height:26px;border-radius:50%;border:2px solid var(--text-3);background:transparent;cursor:pointer;flex-shrink:0;color:transparent;font-size:14px;font-weight:700}
.task.done .task-check{background:var(--success);border-color:var(--success);color:#000}
.task-body{flex:1;min-width:0}
.task-title{font-size:15px;font-weight:600}
.task-meta{font-size:12px;color:var(--text-3);margin-top:3px}

/* LESSON */
.lesson-section{background:var(--surface);border-radius:14px;padding:14px;margin-bottom:10px;border-left:3px solid var(--brand)}
.lesson-section.practice{border-left-color:var(--success)}
.lesson-section.reflection{border-left-color:var(--warning)}
.lesson-section.mechanism{border-left-color:var(--danger)}
.lesson-section.steps{border-left-color:#4dd4ff}
.lesson-section-title{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--brand-2);margin-bottom:8px}
.lesson-content{font-size:14px;line-height:1.65}
.lesson-content strong{color:var(--brand-2)}

/* INPUTS */
input,select,textarea{width:100%;padding:12px 14px;background:var(--surface);border:1.5px solid var(--border);border-radius:14px;color:var(--text);font-family:inherit;font-size:15px;margin-bottom:10px;-webkit-appearance:none}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand)}
textarea{resize:vertical;min-height:80px;line-height:1.5}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(10px);z-index:1000;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--bg-1);width:100%;max-width:560px;max-height:90vh;border-radius:28px 28px 0 0;padding:20px;padding-bottom:calc(20px + var(--safe-bottom));overflow-y:auto;animation:slideUp .3s}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-handle{width:40px;height:4px;background:var(--surface);border-radius:2px;margin:0 auto 16px}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-title{font-size:20px;font-weight:800}
.modal-close{width:34px;height:34px;border-radius:50%;background:var(--surface);border:none;color:var(--text-2);cursor:pointer;font-size:16px}

/* TOAST */
.toasts{position:fixed;top:calc(var(--header-h) + 12px);left:50%;transform:translateX(-50%);z-index:2000;display:flex;flex-direction:column;gap:8px;width:90%;max-width:400px;pointer-events:none}
.toast{padding:14px 18px;border-radius:16px;background:var(--bg-2);border:.5px solid var(--border);color:var(--text);font-size:14px;font-weight:600;animation:toastIn .3s;pointer-events:auto}
.toast.success{background:var(--success);color:#000}
.toast.error{background:var(--danger);color:#fff}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-16px)}to{opacity:1;transform:translate(-50%,0)}}

/* WELCOME */
.welcome{position:fixed;inset:0;background:var(--bg);z-index:5000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center}
.welcome-logo{width:90px;height:90px;border-radius:26px;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:grid;place-items:center;font-size:48px;margin-bottom:24px}
.welcome-title{font-size:28px;font-weight:800;margin-bottom:10px}
.welcome-sub{font-size:15px;color:var(--text-2);margin-bottom:28px;max-width:340px;line-height:1.5}
.welcome input{max-width:340px;text-align:center;font-size:18px;font-weight:700}

/* MISC */
.hidden{display:none !important}
.empty{text-align:center;padding:40px 16px;color:var(--text-3)}
.empty-icon{font-size:52px;opacity:.3;margin-bottom:12px}
.empty-text{font-size:14px}
.progress{height:6px;background:var(--surface);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-2));border-radius:3px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mb-2{margin-bottom:8px}.mb-3{margin-bottom:12px}.mb-4{margin-bottom:16px}
.mt-2{margin-top:8px}.mt-3{margin-top:12px}.mt-4{margin-top:16px}
.text-2{color:var(--text-2)}.text-3{color:var(--text-3)}
.footnote{font-size:13px}
.caption{font-size:12px}
</style>
</head>
<body>

<header class="header">
<div class="header-inner">
<div class="brand"><div class="brand-logo">🧠</div><span>AI Health</span></div>
<div class="header-actions">
<button class="icon-btn" onclick="openTheme()" id="themeBtn">🎨</button>
<button class="icon-btn" onclick="toggleSound()" id="soundBtn">🔊</button>
</div>
</div>
</header>

<main class="main" id="app"></main>
<nav class="tabbar" id="tabbar"></nav>
<div class="toasts" id="toasts"></div>

<script>
'use strict';

/* ========== TELEGRAM ========== */
try {
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    tg.expand();
    tg.ready();
  }
} catch(e) {}

/* ========== УТИЛИТЫ ========== */
function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}
function nowISO() {
  return new Date().toISOString();
}
function today() {
  return new Date().toISOString().slice(0, 10);
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function toast(msg, type, dur) {
  type = type || 'info';
  dur = dur || 2500;
  var c = document.getElementById('toasts');
  if (!c) return;
  var el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  c.appendChild(el);
  playSound(type === 'success' ? 'success' : type === 'error' ? 'error' : 'click');
  setTimeout(function() {
    el.style.opacity = '0';
    el.style.transition = 'opacity .3s';
    setTimeout(function() { el.remove(); }, 300);
  }, dur);
}

/* ========== ЗВУК ========== */
var audioCtx = null;
var soundOn = true;
function initAudio() {
  if (audioCtx) return;
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
}
function playSound(type) {
  if (!soundOn) return;
  initAudio();
  if (!audioCtx) return;
  try {
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    var n = audioCtx.currentTime;
    if (type === 'click') {
      o.frequency.setValueAtTime(800, n);
      o.frequency.exponentialRampToValueAtTime(400, n + .08);
      g.gain.setValueAtTime(.05, n);
      g.gain.exponentialRampToValueAtTime(.001, n + .08);
      o.start(n); o.stop(n + .08);
    } else if (type === 'success') {
      o.frequency.setValueAtTime(523, n);
      o.frequency.setValueAtTime(659, n + .1);
      o.frequency.setValueAtTime(784, n + .2);
      g.gain.setValueAtTime(.07, n);
      g.gain.exponentialRampToValueAtTime(.001, n + .35);
      o.start(n); o.stop(n + .35);
    } else if (type === 'error') {
      o.frequency.setValueAtTime(300, n);
      o.frequency.exponentialRampToValueAtTime(150, n + .2);
      g.gain.setValueAtTime(.07, n);
      g.gain.exponentialRampToValueAtTime(.001, n + .25);
      o.start(n); o.stop(n + .25);
    }
  } catch(e) {}
}
function toggleSound() {
  soundOn = !soundOn;
  state.settings.soundOn = soundOn;
  save();
  var b = document.getElementById('soundBtn');
  if (b) b.textContent = soundOn ? '🔊' : '🔇';
  toast(soundOn ? 'Звук включён' : 'Звук выключен', 'info');
}

/* ========== СОСТОЯНИЕ ========== */
var KEY = 'ai_health_v27';
function defaultState() {
  return {
    tasks: [],
    chats: [],
    levelProgress: {},
    englishProgress: {},
    settings: {
      theme: 'dark',
      soundOn: true,
      apiKey: '',
      persona: 'coach'
    },
    profile: {
      name: '',
      achievements: []
    },
    stats: {
      streak: 0,
      lastActive: null
    }
  };
}
var state;
try {
  var raw = localStorage.getItem(KEY);
  if (raw) {
    var parsed = JSON.parse(raw);
    var def = defaultState();
    state = {
      tasks: parsed.tasks || def.tasks,
      chats: parsed.chats || def.chats,
      levelProgress: parsed.levelProgress || def.levelProgress,
      englishProgress: parsed.englishProgress || def.englishProgress,
      settings: Object.assign({}, def.settings, parsed.settings || {}),
      profile: Object.assign({}, def.profile, parsed.profile || {}),
      stats: Object.assign({}, def.stats, parsed.stats || {})
    };
  } else {
    state = defaultState();
  }
} catch(e) {
  state = defaultState();
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e) {}
}

/* ========== ТЕМЫ ========== */
var THEMES = [
  { id: 'dark', name: 'Тёмная', emoji: '🌙' },
  { id: 'light', name: 'Светлая', emoji: '☀️' }
];
function applyTheme(id) {
  document.body.classList.toggle('light', id === 'light');
  var b = document.getElementById('themeBtn');
  if (b) b.textContent = id === 'light' ? '☀️' : '🌙';
}
function openTheme() {
  var html = '<div class="list">';
  THEMES.forEach(function(t) {
    var active = state.settings.theme === t.id;
    html += '<div class="list-row" onclick="setTheme(\'' + t.id + '\')">';
    html += '<div class="list-icon">' + t.emoji + '</div>';
    html += '<div class="list-body"><div class="list-title">' + t.name + '</div></div>';
    html += '<div>' + (active ? '✓' : '') + '</div>';
    html += '</div>';
  });
  html += '</div>';
  openModal('Тема', html);
}
function setTheme(id) {
  state.settings.theme = id;
  applyTheme(id);
  save();
  closeModal();
  toast('Тема изменена', 'success');
}

/* ========== МОДАЛ ========== */
function openModal(title, content) {
  var overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = '<div class="modal">' +
    '<div class="modal-handle"></div>' +
    '<div class="modal-header"><div class="modal-title">' + esc(title) + '</div>' +
    '<button class="modal-close" onclick="closeModal()">✕</button></div>' +
    content + '</div>';
  overlay.onclick = function(e) { if (e.target === overlay) closeModal(); };
  document.body.appendChild(overlay);
}
function closeModal() {
  document.querySelectorAll('.overlay').forEach(function(o) { o.remove(); });
}

/* ========== НАВИГАЦИЯ ========== */
var PAGES = [
  { id: 'home', icon: '🏠', label: 'Главная', render: renderHome },
  { id: 'tasks', icon: '✅', label: 'Задачи', render: renderTasks },
  { id: 'learn', icon: '🎓', label: 'Обучение', render: renderLearn },
  { id: 'english', icon: '🇬🇧', label: 'English', render: renderEnglish },
  { id: 'ai', icon: '✨', label: 'AI', render: renderAI },
  { id: 'more', icon: '⋯', label: 'Ещё', render: renderMore }
];
var currentPage = 'home';

function renderTabs() {
  var bar = document.getElementById('tabbar');
  if (!bar) return;
  bar.innerHTML = PAGES.map(function(p) {
    return '<button class="tab ' + (p.id === currentPage ? 'active' : '') + '" onclick="go(\'' + p.id + '\')">' +
      '<span class="tab-icon">' + p.icon + '</span>' +
      '<span class="tab-label">' + p.label + '</span>' +
      '</button>';
  }).join('');
}

function go(page) {
  if (!page) return;
  currentPage = page;
  renderTabs();
  var app = document.getElementById('app');
  if (!app) return;
  app.innerHTML = '';
  playSound('click');
  var p = PAGES.find(function(x) { return x.id === page; });
  if (p && p.render) {
    try { p.render(); } catch(e) {
      console.error(e);
      app.innerHTML = '<div class="card"><div class="empty"><div class="empty-icon">⚠️</div><div class="empty-text">Ошибка: ' + esc(e.message) + '</div></div></div>';
    }
  }
  window.scrollTo({ top: 0 });
}

/* ========== ГЛАВНАЯ ========== */
function renderHome() {
  var todayTasks = state.tasks.filter(function(t) {
    return t.created_at && t.created_at.slice(0, 10) === today();
  });
  var doneToday = todayTasks.filter(function(t) { return t.status === 'done'; }).length;
  var hour = new Date().getHours();
  var greet = hour < 6 ? 'Доброй ночи' : hour < 12 ? 'Доброе утро' : hour < 18 ? 'Добрый день' : 'Добрый вечер';
  var name = state.profile.name ? ', ' + state.profile.name : '';
  var totalDone = Object.keys(state.levelProgress || {}).length;
  var wordsDone = Object.keys(state.englishProgress || {}).length;

  var html = '<div class="title-xl">' + greet + name + '</div>';

  html += '<div class="card card-gradient">';
  html += '<h2>📊 Сегодня</h2>';
  html += '<div style="font-size:40px;font-weight:800;letter-spacing:-1.5px;margin-bottom:10px;">' +
    doneToday + ' / ' + todayTasks.length + '</div>';
  var pct = todayTasks.length ? Math.round(doneToday / todayTasks.length * 100) : 0;
  html += '<div class="progress" style="background:rgba(255,255,255,.25)"><div class="progress-fill" style="width:' + pct + '%;background:#fff"></div></div>';
  html += '</div>';

  html += '<div class="stats">';
  html += '<div class="stat"><div class="stat-value">' + (state.stats.streak || 0) + '</div><div class="stat-label">Streak</div></div>';
  html += '<div class="stat"><div class="stat-value">' + totalDone + '</div><div class="stat-label">Уроков</div></div>';
  html += '<div class="stat"><div class="stat-value">' + wordsDone + '</div><div class="stat-label">English</div></div>';
  html += '</div>';

  html += '<div class="card">';
  html += '<h2>⚡ Быстрые действия</h2>';
  html += '<div class="btn-row">';
  html += '<button class="btn btn-primary btn-sm" onclick="go(\'learn\')">🎓 Обучение</button>';
  html += '<button class="btn btn-ghost btn-sm" onclick="go(\'english\')">🇬🇧 English</button>';
  html += '<button class="btn btn-ghost btn-sm" onclick="quickTask()">➕ Задача</button>';
  html += '<button class="btn btn-ghost btn-sm" onclick="go(\'more\')">⋯ Ещё</button>';
  html += '</div></div>';

  var pending = state.tasks.filter(function(t) { return t.status === 'pending'; }).slice(0, 5);
  html += '<div class="card"><h2>📋 Задачи</h2>';
  if (pending.length) {
    pending.forEach(function(t) { html += taskHTML(t); });
  } else {
    html += '<div class="empty"><div class="empty-icon">✨</div><div class="empty-text">Всё выполнено</div></div>';
  }
  html += '</div>';

  document.getElementById('app').innerHTML = html;
}

function taskHTML(t) {
  var done = t.status === 'done';
  return '<div class="task ' + (done ? 'done' : '') + '">' +
    '<button class="task-check ' + (done ? 'done' : '') + '" onclick="event.stopPropagation();toggleTask(\'' + t.id + '\')">' + (done ? '✓' : '') + '</button>' +
    '<div class="task-body">' +
    '<div class="task-title">' + esc(t.title) + '</div>' +
    '<div class="task-meta">' + (t.planned_time || 0) + ' мин</div>' +
    '</div>' +
    '<button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();deleteTask(\'' + t.id + '\')">🗑</button>' +
    '</div>';
}

function quickTask() {
  openModal('Новая задача',
    '<input type="text" id="qt-title" placeholder="Что нужно сделать?" autofocus/>' +
    '<input type="number" id="qt-time" placeholder="Время (мин)" value="30"/>' +
    '<button class="btn btn-primary btn-block mt-3" onclick="saveQuickTask()">Добавить</button>');
  setTimeout(function() {
    var el = document.getElementById('qt-title');
    if (el) el.focus();
  }, 200);
}

function saveQuickTask() {
  var title = document.getElementById('qt-title').value.trim();
  var time = parseInt(document.getElementById('qt-time').value) || 30;
  if (!title) { toast('Введите название', 'error'); return; }
  state.tasks.unshift({
    id: uid(),
    title: title,
    planned_time: time,
    status: 'pending',
    created_at: nowISO()
  });
  save();
  closeModal();
  toast('Задача добавлена', 'success');
  go(currentPage);
}

function toggleTask(id) {
  var t = state.tasks.find(function(x) { return x.id === id; });
  if (!t) return;
  t.status = t.status === 'done' ? 'pending' : 'done';
  save();
  toast(t.status === 'done' ? '✓ Выполнено' : 'Отменено', 'success');
  go(currentPage);
}

function deleteTask(id) {
  state.tasks = state.tasks.filter(function(t) { return t.id !== id; });
  save();
  toast('Удалено', 'info');
  go(currentPage);
}

/* ========== ЗАДАЧИ ========== */
function renderTasks() {
  var html = '<div class="row-between mb-4"><div class="title-xl" style="margin:0">Задачи</div>';
  html += '<button class="btn btn-primary btn-sm" onclick="quickTask()">+ Новая</button></div>';

  if (state.tasks.length) {
    html += '<div class="card">';
    state.tasks.forEach(function(t) { html += taskHTML(t); });
    html += '</div>';
  } else {
    html += '<div class="card"><div class="empty"><div class="empty-icon">📋</div><div class="empty-text">Нет задач</div></div></div>';
  }
  document.getElementById('app').innerHTML = html;
}

function renderLearn() {
  var total = 0;
  var done = 0;
  LEVELS.forEach(function(l) {
    l.lessons.forEach(function(lesson, idx) {
      total++;
      if (state.levelProgress[l.id + '_' + idx]) done++;
    });
  });
  var pct = total ? Math.round(done / total * 100) : 0;

  var html = '<div class="title-xl">Обучение</div>';
  html += '<div class="card card-gradient">';
  html += '<h2>Прогресс</h2>';
  html += '<div style="font-size:40px;font-weight:800;letter-spacing:-1.5px;margin-bottom:10px;">' + pct + '%</div>';
  html += '<div class="progress" style="background:rgba(255,255,255,.25)"><div class="progress-fill" style="width:' + pct + '%;background:#fff"></div></div>';
  html += '<div class="caption" style="opacity:.85;margin-top:10px">' + done + ' из ' + total + ' уроков</div>';
  html += '</div>';

  LEVELS.forEach(function(level) {
    var levelDone = level.lessons.filter(function(_, idx) {
      return state.levelProgress[level.id + '_' + idx];
    }).length;
    var levelPct = Math.round(levelDone / level.lessons.length * 100);
    var completed = levelPct === 100;

    html += '<div class="card" onclick="openLevel(\'' + level.id + '\')" style="cursor:pointer;">';
    html += '<div class="row-between mb-2">';
    html += '<div class="row" style="gap:12px;align-items:center;">';
    html += '<div class="list-icon" style="background:' + (completed ? 'var(--success)' : 'var(--surface)') + ';font-size:22px;">' + (completed ? '✓' : level.emoji) + '</div>';
    html += '<div><div style="font-weight:700;font-size:16px;">' + level.title + '</div>';
    html += '<div class="caption text-2" style="margin-top:4px;">' + levelDone + ' из ' + level.lessons.length + '</div></div>';
    html += '</div>';
    html += '<span style="color:var(--text-3);font-size:20px;">›</span>';
    html += '</div>';
    html += '<div class="progress"><div class="progress-fill" style="width:' + levelPct + '%"></div></div>';
    html += '</div>';
  });

  document.getElementById('app').innerHTML = html;
}

var currentLevel = null;

function openLevel(id) {
  var level = LEVELS.find(function(l) { return l.id === id; });
  if (!level) return;
  currentLevel = level;

  var html = '<button class="btn btn-ghost btn-sm mb-3" onclick="go(\'learn\')">← Назад</button>';
  html += '<div class="title-xl">' + level.emoji + ' ' + level.title + '</div>';
  html += '<div class="card">';
  html += '<h2>📖 Уроки</h2>';
  level.lessons.forEach(function(lesson, idx) {
    var done = state.levelProgress[level.id + '_' + idx];
    html += '<div class="list-row mb-2" onclick="openLesson(\'' + level.id + '\', ' + idx + ')">';
    html += '<div class="list-icon" style="background:' + (done ? 'var(--success)' : 'var(--surface)') + ';color:' + (done ? '#000' : 'var(--text)') + ';">' + (done ? '✓' : (idx + 1)) + '</div>';
    html += '<div class="list-body"><div class="list-title">' + lesson.title + '</div></div>';
    html += '<span style="color:var(--text-3);font-size:18px;">›</span>';
    html += '</div>';
  });
  html += '</div>';
  document.getElementById('app').innerHTML = html;
}

function openLesson(levelId, idx) {
  var level = LEVELS.find(function(l) { return l.id === levelId; });
  if (!level) return;
  var lesson = level.lessons[idx];
  if (!lesson) return;
  var done = state.levelProgress[levelId + '_' + idx];

  var html = '<button class="btn btn-ghost btn-sm mb-3" onclick="openLevel(\'' + levelId + '\')">← К урокам</button>';
  html += '<div class="title-xl">' + lesson.title + '</div>';
  html += '<div class="card">';
  html += '<div class="lesson-section mechanism"><div class="lesson-section-title">🔬 Механизм</div><div class="lesson-content">' + formatText(lesson.mechanism) + '</div></div>';
  html += '<div class="lesson-section steps"><div class="lesson-section-title">⚙️ Ключевые действия</div><div class="lesson-content">' + formatSteps(lesson.steps) + '</div></div>';
  html += '<div class="lesson-section practice"><div class="lesson-section-title">🎯 Практика</div><div class="lesson-content">' + esc(lesson.practice) + '</div></div>';
  html += '<div class="lesson-section reflection"><div class="lesson-section-title">💭 Рефлексия</div><div class="lesson-content">' + esc(lesson.reflection) + '</div></div>';
  html += '</div>';
  if (!done) {
    html += '<button class="btn btn-primary btn-block" onclick="completeLesson(\'' + levelId + '\', ' + idx + ')">✓ Отметить как изученный</button>';
  } else {
    html += '<div class="card" style="text-align:center;color:var(--success);font-weight:700;">✓ Урок изучен</div>';
    if (idx < level.lessons.length - 1) {
      html += '<button class="btn btn-primary btn-block" onclick="openLesson(\'' + levelId + '\', ' + (idx + 1) + ')">Следующий урок →</button>';
    }
  }
  document.getElementById('app').innerHTML = html;
  window.scrollTo({ top: 0 });
}

function formatText(text) {
  var h = esc(text);
  h = h.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  h = h.replace(/\n\n/g, '</p><p>');
  h = h.replace(/\n/g, '<br>');
  return '<p>' + h + '</p>';
}

function formatSteps(steps) {
  var h = '<ol style="padding-left:20px;margin:0">';
  steps.forEach(function(s) { h += '<li style="margin:6px 0">' + esc(s) + '</li>'; });
  h += '</ol>';
  return h;
}

function completeLesson(levelId, idx) {
  state.levelProgress[levelId + '_' + idx] = true;
  save();
  toast('✓ Урок изучен!', 'success');
  openLesson(levelId, idx);
}

function renderEnglish() {
  var total = 0, done = 0;
  ENGLISH.forEach(function(lvl) {
    lvl.words.forEach(function(w, idx) {
      total++;
      if (state.englishProgress[lvl.id + '_' + idx]) done++;
    });
  });
  var pct = total ? Math.round(done / total * 100) : 0;

  var html = '<div class="title-xl">🇬🇧 Английский</div>';
  html += '<div class="card card-gradient">';
  html += '<h2>Прогресс</h2>';
  html += '<div style="font-size:40px;font-weight:800;margin-bottom:10px;">' + done + ' / ' + total + '</div>';
  html += '<div class="progress" style="background:rgba(255,255,255,.25)"><div class="progress-fill" style="width:' + pct + '%;background:#fff"></div></div>';
  html += '</div>';

  ENGLISH.forEach(function(lvl) {
    html += '<div class="card" onclick="openEngLevel(\'' + lvl.id + '\')" style="cursor:pointer;">';
    html += '<div class="row-between">';
    html += '<div class="row" style="gap:12px;align-items:center;">';
    html += '<div class="list-icon" style="font-size:24px;">' + lvl.emoji + '</div>';
    html += '<div><div style="font-weight:700;font-size:16px;">' + lvl.title + '</div>';
    html += '<div class="caption text-2" style="margin-top:4px;">' + lvl.desc + ' · ' + lvl.words.length + ' слов</div></div>';
    html += '</div>';
    html += '<span style="color:var(--text-3);font-size:20px;">›</span>';
    html += '</div></div>';
  });

  document.getElementById('app').innerHTML = html;
}

function openEngLevel(id) {
  var lvl = ENGLISH.find(function(l) { return l.id === id; });
  if (!lvl) return;

  var html = '<button class="btn btn-ghost btn-sm mb-3" onclick="go(\'english\')">← Назад</button>';
  html += '<div class="title-xl">' + lvl.emoji + ' ' + lvl.title + '</div>';
  html += '<div class="card"><h2>📚 Слова</h2>';
  lvl.words.forEach(function(w, idx) {
    var done = state.englishProgress[lvl.id + '_' + idx];
    html += '<div style="background:var(--bg);border-radius:14px;padding:14px;margin-bottom:10px;border-left:3px solid #5b9eff;">';
    html += '<div style="font-size:22px;font-weight:800;color:#5b9eff;">' + esc(w.en) + '</div>';
    html += '<div style="font-size:13px;color:var(--text-3);font-style:italic;margin:4px 0;">' + esc(w.tr) + '</div>';
    html += '<div style="font-size:16px;font-weight:600;margin-bottom:8px;">' + esc(w.ru) + '</div>';
    html += '<div style="font-size:13px;color:var(--text-2);padding:8px 12px;background:var(--surface);border-radius:10px;font-style:italic;">' + esc(w.ex) + '</div>';
    html += '<div class="btn-row mt-2">';
    html += '<button class="btn btn-ghost btn-sm" onclick="speak(\'' + esc(w.en).replace(/'/g, "\\'") + '\')">🔊 Слушать</button>';
    html += '<button class="btn ' + (done ? 'btn-success' : 'btn-primary') + ' btn-sm" onclick="markWord(\'' + lvl.id + '\', ' + idx + ')">' + (done ? '✓ Изучено' : 'Отметить') + '</button>';
    html += '</div></div>';
  });
  html += '</div>';
  document.getElementById('app').innerHTML = html;
}

function speak(text) {
  if ('speechSynthesis' in window) {
    try {
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      u.rate = 0.85;
      speechSynthesis.speak(u);
      playSound('click');
    } catch(e) {
      toast('Ошибка озвучки', 'error');
    }
  } else {
    toast('Озвучка не поддерживается', 'warning');
  }
}

function markWord(levelId, idx) {
  state.englishProgress[levelId + '_' + idx] = true;
  save();
  toast('✓ Слово изучено', 'success');
  openEngLevel(levelId);
}

/* ========== AI ========== */
var PERSONAS = {
  coach: { name: 'Коуч', emoji: '💬', prompt: 'Ты — AI-Коуч с 80-летним опытом. GROW, SMART, Deep Work, Икигай, Стоицизм. Отвечай глубоко, 150-220 слов.' },
  psych: { name: 'Психолог', emoji: '🧠', prompt: 'Ты — AI-Психолог. КПТ, ACT, DBT. НЕ ставь диагнозы! При кризисе 8-800-2000-122. 150-220 слов.' },
  doctor: { name: 'Врач', emoji: '⚕️', prompt: 'Ты — AI-Врач. НЕ ставь диагнозы. Всегда дисклеймер. Острые → 103/112. 150-250 слов.' },
  english: { name: 'English', emoji: '🇬🇧', prompt: 'Ты — преподаватель английского. Грамматика, слова, произношение. Примеры. 150-200 слов.' }
};

function renderAI() {
  var persona = PERSONAS[state.settings.persona] || PERSONAS.coach;
  var msgs = state.chats.filter(function(c) { return c.persona === state.settings.persona; });

  var html = '<div class="title-xl">AI</div>';
  html += '<div class="btn-row mb-3">';
  Object.keys(PERSONAS).forEach(function(k) {
    var p = PERSONAS[k];
    var active = state.settings.persona === k;
    html += '<button class="btn ' + (active ? 'btn-primary' : 'btn-ghost') + ' btn-sm" onclick="switchPersona(\'' + k + '\')">' + p.emoji + ' ' + p.name + '</button>';
  });
  html += '</div>';

  html += '<div class="card" style="max-height:60vh;overflow-y:auto;" id="chatBox">';
  if (msgs.length) {
    msgs.forEach(function(m) {
      html += '<div style="padding:10px 14px;border-radius:16px;margin-bottom:10px;' +
        (m.role === 'user'
          ? 'background:var(--brand);color:#fff;margin-left:auto;max-width:80%;width:fit-content;'
          : 'background:var(--surface);max-width:85%;') +
        '">' + esc(m.text) + '</div>';
    });
  } else {
    html += '<div class="empty"><div class="empty-icon">' + persona.emoji + '</div><div class="empty-text">Задай вопрос</div></div>';
  }
  html += '</div>';

  html += '<div class="card">';
  html += '<input type="text" id="chatInput" placeholder="Сообщение..." onkeydown="if(event.key===\'Enter\'){event.preventDefault();sendMsg();}"/>';
  html += '<button class="btn btn-primary btn-block" onclick="sendMsg()">Отправить</button>';
  html += '</div>';

  document.getElementById('app').innerHTML = html;
  var box = document.getElementById('chatBox');
  if (box) box.scrollTop = box.scrollHeight;
}

function switchPersona(p) {
  state.settings.persona = p;
  save();
  renderAI();
}

async function sendMsg() {
  var input = document.getElementById('chatInput');
  if (!input) return;
  var text = input.value.trim();
  if (!text) return;
  input.value = '';

  state.chats.push({ id: uid(), persona: state.settings.persona, role: 'user', text: text, ts: nowISO() });
  save();
  renderAI();

  var persona = PERSONAS[state.settings.persona];
  var reply = '';

  if (state.settings.apiKey) {
    try {
      var history = state.chats.filter(function(c) { return c.persona === state.settings.persona; }).slice(-10);
      var contents = history.map(function(m) {
        return { role: m.role === 'user' ? 'user' : 'model', parts: [{ text: m.text }] };
      });
      var resp = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=' + state.settings.apiKey, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          system_instruction: { parts: [{ text: persona.prompt }] },
          contents: contents
        })
      });
      var data = await resp.json();
      reply = data?.candidates?.[0]?.content?.parts?.[0]?.text || 'Не удалось получить ответ';
    } catch(e) {
      reply = 'Ошибка связи с AI. Проверь API ключ.';
    }
  } else {
    reply = fallbackReply(state.settings.persona, text);
  }

  state.chats.push({ id: uid(), persona: state.settings.persona, role: 'coach', text: reply, ts: nowISO() });
  save();
  renderAI();
}

function fallbackReply(persona, text) {
  if (/суицид|покончить|не хочу жить|умереть/i.test(text)) {
    return '🆘 Позвони прямо сейчас: 8-800-2000-122 (РФ, 24/7) · 103 · findahelpline.com. Ты важен, ты не один.';
  }
  if (persona === 'doctor') return 'Я — AI-консультант. Опиши симптомы (что, как давно).\n\n⚠️ Не заменяет врача. При острых симптомах — 103/112.';
  if (persona === 'psych') return 'Слышу тебя. Что происходит? Что ты уже пробовал?';
  if (persona === 'english') return 'Привет! Let\'s practice English. What would you like to learn today? Grammar? Vocabulary?';
  return 'Слышу тебя. Расскажи подробнее — что происходит? (Подключи API ключ в настройках для полноценного AI)';
}

  html += '<button class="btn btn-danger btn-block" onclick="if(confirm(\'Удалить все данные?\')){localStorage.removeItem(\'' + KEY + '\');location.reload();}">🗑 Полный сброс</button>';

  openModal('🗄 Хранилище', html);
}

function exportData() {
  var blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'ai-health-' + today() + '.json';
  a.click();
  URL.revokeObjectURL(url);
  toast('Экспорт готов', 'success');
}

function importData(e) {
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    try {
      var data = JSON.parse(ev.target.result);
      if (!confirm('Заменить все данные?')) return;
      state = Object.assign(defaultState(), data);
      save();
      toast('Импорт успешен', 'success');
      location.reload();
    } catch(err) {
      toast('Ошибка импорта', 'error');
    }
  };
  reader.readAsText(file);
}

function openProfile() {
  var name = state.profile.name || 'Пользователь';

    { icon: '🇬🇧', name: 'English', done: Object.keys(state.englishProgress).length >= 3 },

  ];

  html += '<div style="font-size:22px;font-weight:800;">' + esc(name) + '</div>';
  html += '</div>';
  html += '<div class="stats">';
  html += '<div class="stat"><div class="stat-value">' + state.tasks.length + '</div><div class="stat-label">Задач</div></div>';
  html += '<div class="stat"><div class="stat-value">' + Object.keys(state.levelProgress).length + '</div><div class="stat-label">Уроков</div></div>';

    html += '<div style="font-size:11px;font-weight:700;color:var(--text-2);margin-top:4px;text-transform:uppercase;">' + a.name + '</div>';

function saveName() {

function clearApiKey() {

/* ========== СТАРТ ========== */
function init() {
  try {
    applyTheme(state.settings.theme);
    soundOn = state.settings.soundOn !== false;
    var sb = document.getElementById('soundBtn');
    if (sb) sb.textContent = soundOn ? '🔊' : '🔇';

    if (!state.profile.name) {
      showWelcome();
    } else {
      start();
    }
  } catch(e) {
    console.error('Init error:', e);
    document.getElementById('app').innerHTML = '<div class="card"><div class="empty"><div class="empty-icon">⚠️</div><div class="empty-text">Ошибка: ' + esc(e.message) + '</div></div></div>';
  }
}

function showWelcome() {
  var overlay = document.createElement('div');
  overlay.className = 'welcome';
  overlay.id = 'welcome';
  overlay.innerHTML =
    '<div class="welcome-logo">🧠</div>' +
    '<div class="welcome-title">AI Health</div>' +
    '<div class="welcome-sub">Коуч · Психолог · Врач · English. Уроки, привычки, достижения.</div>' +
    '<input type="text" id="welcomeName" placeholder="Как тебя зовут?" maxlength="30"/>' +
    '<button class="btn btn-primary btn-block mt-3" style="max-width:340px;" onclick="finishWelcome()">Начать</button>';
  document.body.appendChild(overlay);
  setTimeout(function() {
    var inp = document.getElementById('welcomeName');
    if (inp) inp.focus();
  }, 300);
}

function finishWelcome() {
  var name = document.getElementById('welcomeName').value.trim();
  if (!name) return toast('Введи имя', 'error');
  state.profile.name = name;
  save();
  var w = document.getElementById('welcome');
  if (w) w.remove();
  toast('Добро пожаловать, ' + name + '!', 'success');
  start();
}

function start() {
  updateStreak();
  renderTabs();
  go('home');
}

function updateStreak() {
  var t = today();
  if (state.stats.lastActive === t) return;
  var y = new Date();
  y.setDate(y.getDate() - 1);
  if (state.stats.lastActive === y.toISOString().slice(0, 10)) {
    state.stats.streak = (state.stats.streak || 0) + 1;
  } else {
    state.stats.streak = 1;
  }
  state.stats.lastActive = t;
  save();
}
