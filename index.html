*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter',system-ui,sans-serif;font-size:16px;line-height:1.45;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;overflow-x:hidden;min-height:100dvh;letter-spacing:-.015em;transition:background .5s var(--ease),color .5s var(--ease)}
body::before{content:'';position:fixed;inset:-20%;background:radial-gradient(ellipse 45% 35% at 20% 15%,var(--brand-glow),transparent 60%),radial-gradient(ellipse 40% 35% at 80% 85%,var(--brand-glow),transparent 60%);pointer-events:none;z-index:0;animation:aurora 24s ease-in-out infinite;opacity:.5}

.theme-effect{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.effect-drop{position:absolute;top:-10%;width:2px;height:18px;background:linear-gradient(180deg,transparent,var(--brand-glow));animation:effectFall linear infinite}
@keyframes effectFall{0%{transform:translateY(0) translateX(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(110vh) translateX(20px);opacity:0}}

@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
.effect-float{position:absolute;font-size:16px;top:-10%;animation:floatDown linear infinite}
@keyframes floatDown{0%{transform:translateY(0) rotate(0) translateX(0);opacity:.8}100%{transform:translateY(110vh) rotate(720deg) translateX(50px);opacity:0}}
.effect-fly{position:absolute;font-size:24px;animation:flyAround 12s linear infinite}
@keyframes flyAround{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(40vw,10vh) rotate(15deg)}50%{transform:translate(70vw,30vh) rotate(-10deg)}75%{transform:translate(30vw,60vh) rotate(10deg)}100%{transform:translate(0,0) rotate(0)}}
.tap-ripple{position:relative;overflow:hidden}
.tap-ripple::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at var(--rx,50%) var(--ry,50%),rgba(255,255,255,.28) 0%,transparent 60%);opacity:0;transform:scale(.4);pointer-events:none}
.tap-ripple.rippling::after{animation:rippleFade .65s ease-out forwards}
@keyframes rippleFade{0%{opacity:.85;transform:scale(.5)}100%{opacity:0;transform:scale(1.4)}}
.app-header{position:sticky;top:0;z-index:100;padding-top:var(--safe-top);background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:saturate(200%) blur(30px);-webkit-backdrop-filter:saturate(200%) blur(30px);border-bottom:.5px solid var(--divider)}
.header-inner{height:var(--header-h);display:flex;align-items:center;justify-content:space-between;padding:0 22px;gap:12px}
.brand{display:flex;align-items:center;gap:11px;font-size:19px;font-weight:700}
.brand-logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:grid;place-items:center;color:#fff;box-shadow:0 6px 20px var(--brand-glow);font-size:20px}
.header-actions{display:flex;align-items:center;gap:8px}
.icon-btn{width:42px;height:42px;border-radius:50%;background:var(--surface-2);border:none;color:var(--text);cursor:pointer;display:grid;place-items:center;font-size:18px}

.avatar-btn{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:grid;place-items:center;font-size:20px;cursor:pointer;border:none}
.app-main{position:relative;z-index:2;max-width:700px;margin:0 auto;width:100%;padding:22px;padding-bottom:calc(var(--tabbar-h) + var(--safe-bottom) + 96px) !important;min-height:calc(100dvh - var(--header-h) - var(--safe-top))}
.page{animation:pageIn .55s var(--spring-snap) both}
@keyframes pageIn{0%{opacity:0;transform:translateY(20px) scale(.96);filter:blur(8px)}100%{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}
.tab-bar-wrap{position:fixed;bottom:0;left:0;right:0;z-index:100;padding:0 14px calc(14px + var(--safe-bottom));pointer-events:none}
.tab-bar{background:color-mix(in srgb,var(--bg-1) 88%,transparent);backdrop-filter:saturate(200%) blur(30px);border:.5px solid var(--divider-strong);border-radius:26px;display:flex;align-items:stretch;height:62px;box-shadow:0 12px 40px rgba(0,0,0,.5);max-width:580px;margin:0 auto;pointer-events:auto;overflow:hidden}
.tab-item{flex:1;background:transparent;border:none;color:var(--text-3);font-family:inherit;font-size:9px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 1px 4px;cursor:pointer;position:relative;min-width:0}
.tab-item .tab-icon{font-size:19px;line-height:1}
.tab-item .tab-label{font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

.tab-item.active::before{content:'';position:absolute;top:3px;left:50%;transform:translateX(-50%);width:4px;height:4px;background:var(--brand);border-radius:50%}
.title-xl{font-size:34px;font-weight:800;line-height:1.12;margin-bottom:26px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 22px;border-radius:var(--r-full);border:none;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;white-space:nowrap;-webkit-appearance:none}
.btn:active:not(:disabled){transform:scale(.94)}
.btn-primary{background:var(--brand);color:#fff}
.btn-success{background:var(--success);color:#000}
.btn-warning{background:var(--warning);color:#000}
.btn-danger{background:var(--danger);color:#fff}
.btn-ghost{background:var(--surface-2);color:var(--text);border:.5px solid var(--surface-3)}
.btn-sm{padding:10px 18px;font-size:14px}
.btn-xs{padding:7px 14px;font-size:13px}
.btn-block{width:100%}
.btn-icon{width:44px;height:44px;padding:0;border-radius:50%}
.btn-icon.btn-sm{width:36px;height:36px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.field{margin-bottom:18px}
.field-label{display:block;font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:8px;text-transform:uppercase;letter-spacing:.04em}
input[type="text"],input[type="number"],input[type="datetime-local"],input[type="date"],input[type="time"],input[type="password"],input[type="email"],input[type="url"],input[type="search"],input[type="range"],select,textarea{width:100%;padding:16px 18px;background:var(--surface-2);border:1.5px solid transparent;border-radius:var(--r-lg);color:var(--text);font-family:inherit;font-size:16px;font-weight:500;-webkit-appearance:none;appearance:none}
input:focus,select:focus,textarea:focus{outline:none;background:var(--surface-3);border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-glow)}
input::placeholder,textarea::placeholder{color:var(--text-3)}
textarea{resize:vertical;min-height:100px;line-height:1.55;font-family:inherit}
.task-item{background:var(--bg-2);border-radius:var(--r-lg);padding:16px 18px;margin-bottom:10px;display:flex;align-items:center;gap:14px;cursor:pointer;border:1.5px solid transparent}
.task-item.completed{opacity:.5}
.task-item.completed .task-title{text-decoration:line-through}
.task-checkbox{width:28px;height:28px;border-radius:50%;border:2px solid var(--text-3);background:transparent;display:grid;place-items:center;cursor:pointer;flex-shrink:0;padding:0;color:transparent;font-size:15px;font-weight:700}
.task-checkbox.checked{background:var(--success);border-color:var(--success);color:#000}
.task-content{flex:1;min-width:0}
.task-title{font-size:16px;font-weight:600;color:var(--text);margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task-meta{display:flex;gap:8px;font-size:12px;color:var(--text-2);align-items:center;flex-wrap:wrap}
.priority-bar{width:4px;height:34px;border-radius:2px;flex-shrink:0}
.priority-bar.high{background:var(--danger)}
.priority-bar.medium{background:var(--warning)}
.priority-bar.low{background:var(--success)}
.progress{height:8px;background:var(--surface-3);border-radius:var(--r-full);overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-2));border-radius:var(--r-full)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);backdrop-filter:blur(16px);z-index:1000;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--bg-1);width:100%;max-width:560px;max-height:92dvh;border-radius:36px 36px 0 0;padding:20px;padding-bottom:calc(24px + var(--safe-bottom));overflow-y:auto}
.modal-handle{width:44px;height:5px;background:var(--surface-4);border-radius:3px;margin:0 auto 18px}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;position:sticky;top:0;background:var(--bg-1);padding-bottom:8px;z-index:1}

.toast.success{background:var(--success);color:#000}
.toast.error{background:var(--danger)}
.toast.warning{background:var(--warning);color:#000}
.segmented{display:flex;background:var(--surface-2);border-radius:var(--r-full);padding:5px;gap:3px;border:.5px solid var(--surface-3);overflow-x:auto}
.segmented-item{flex:1;padding:11px 14px;background:transparent;border:none;border-radius:var(--r-full);font-family:inherit;font-size:14px;font-weight:700;color:var(--text-2);cursor:pointer;white-space:nowrap}
.segmented-item.active{background:var(--brand);color:#fff}
.search-bar{display:flex;align-items:center;gap:10px;padding:14px 18px;background:var(--surface-2);border-radius:var(--r-lg);margin-bottom:14px;border:.5px solid var(--surface-3)}
.search-bar input{flex:1;padding:0;background:transparent;border:none;font-size:16px;color:var(--text)}
.persona-bar{display:flex;gap:8px;padding:6px;background:var(--surface-2);border-radius:var(--r-full);margin-bottom:18px;overflow-x:auto;border:.5px solid var(--surface-3)}
.persona-item{flex:1;min-width:fit-content;padding:11px 18px;border-radius:var(--r-full);border:none;background:transparent;color:var(--text-2);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.persona-item.active{color:#fff}
.persona-item.active[data-p="coach"]{background:var(--coach);color:#000}
.persona-item.active[data-p="psych"]{background:var(--psych);color:#000}
.persona-item.active[data-p="doctor"]{background:var(--doctor);color:#000}
.persona-item.active[data-p="nutrition"]{background:var(--nutrition);color:#000}
.persona-item.active[data-p="fitness"]{background:var(--fitness)}
.persona-item.active[data-p="lawyer"]{background:var(--lawyer);color:#000}
.persona-item.active[data-p="finance"]{background:var(--finance);color:#000}

.chat{display:flex;flex-direction:column;gap:14px;padding:10px 0}
.msg{max-width:86%;padding:14px 18px;border-radius:24px;font-size:16px;line-height:1.55;word-wrap:break-word}
.msg-user{align-self:flex-end;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;border-bottom-right-radius:8px}
.msg-bot{align-self:flex-start;background:var(--surface-2);color:var(--text);border-bottom-left-radius:8px;border:.5px solid var(--surface-3)}
.msg-bot strong{color:var(--brand-2);font-weight:700}
.typing{display:flex;gap:6px;padding:16px 20px;align-self:flex-start;background:var(--surface-2);border-radius:24px}
.typing span{width:8px;height:8px;background:var(--text-3);border-radius:50%;animation:typing 1.4s infinite}

.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}

.stat-label{font-size:11px;color:var(--text-2);text-transform:uppercase;letter-spacing:.06em;font-weight:700}

.switch.on{background:var(--brand)}
.switch.on::after{transform:translateX(21px)}
.list-row{display:flex;align-items:center;gap:16px;padding:16px 18px;background:var(--bg-2);border-radius:var(--r-lg);margin-bottom:10px;cursor:pointer;min-height:66px;border:.5px solid var(--surface-1)}
.list-icon{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;flex-shrink:0;font-size:22px}
.list-body{flex:1;min-width:0}
.list-title{font-size:16px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-subtitle{font-size:13px;color:var(--text-2);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-value{font-size:16px;color:var(--text-2);font-weight:600;flex-shrink:0}
.list-chevron{color:var(--text-4);flex-shrink:0;font-size:22px}
.empty{text-align:center;padding:56px 24px;color:var(--text-2)}
.empty-icon{font-size:64px;opacity:.3;margin-bottom:18px}

/* ЗВУК — Web Audio API */
var audioCtx=null;
var soundEnabled=true;
function initAudio(){if(audioCtx)return;try{audioCtx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
function playSound(type){
  if(!soundEnabled)return;
  initAudio();
  if(!audioCtx)return;
  try{
    var o=audioCtx.createOscillator();
    var g=audioCtx.createGain();
    o.connect(g);g.connect(audioCtx.destination);
    var now=audioCtx.currentTime;
    if(type==='click'){o.frequency.setValueAtTime(800,now);o.frequency.exponentialRampToValueAtTime(400,now+.08);g.gain.setValueAtTime(.06,now);g.gain.exponentialRampToValueAtTime(.001,now+.08);o.start(now);o.stop(now+.08)}
    else if(type==='success'){o.frequency.setValueAtTime(523,now);o.frequency.setValueAtTime(659,now+.1);o.frequency.setValueAtTime(784,now+.2);g.gain.setValueAtTime(.08,now);g.gain.exponentialRampToValueAtTime(.001,now+.35);o.start(now);o.stop(now+.35)}
    else if(type==='error'){o.frequency.setValueAtTime(300,now);o.frequency.exponentialRampToValueAtTime(150,now+.2);g.gain.setValueAtTime(.08,now);g.gain.exponentialRampToValueAtTime(.001,now+.25);o.start(now);o.stop(now+.25)}
    else if(type==='levelup'){o.frequency.setValueAtTime(523,now);o.frequency.setValueAtTime(659,now+.12);o.frequency.setValueAtTime(784,now+.24);o.frequency.setValueAtTime(1047,now+.36);g.gain.setValueAtTime(.1,now);g.gain.exponentialRampToValueAtTime(.001,now+.6);o.start(now);o.stop(now+.6)}
    else if(type==='tick'){o.frequency.setValueAtTime(1200,now);g.gain.setValueAtTime(.03,now);g.gain.exponentialRampToValueAtTime(.001,now+.04);o.start(now);o.stop(now+.04)}
    else if(type==='complete'){o.frequency.setValueAtTime(880,now);o.frequency.setValueAtTime(1100,now+.08);g.gain.setValueAtTime(.08,now);g.gain.exponentialRampToValueAtTime(.001,now+.25);o.start(now);o.stop(now+.25)}
  }catch(e){}
}

function dbSave(){return new Promise(function(resolve){if(!db)return resolve(false);try{var tx=db.transaction(['storage'],'readwrite');tx.objectStore('storage').put({key:'state',value:state,updated:nowISO()});tx.oncomplete=function(){resolve(true)};tx.onerror=function(){resolve(false)}}catch(e){resolve(false)}})}
function dbLoad(){return new Promise(function(resolve){if(!db)return resolve(null);try{var tx=db.transaction(['storage'],'readonly');var req=tx.objectStore('storage').get('state');req.onsuccess=function(){resolve(req.result?req.result.value:null)};req.onerror=function(){resolve(null)}}catch(e){resolve(null)}})}

{title:'Что такое дофамин на самом деле',mechanism:'Дофамин — это НЕ "гормон удовольствия", как часто говорят. Это <strong>нейромедиатор мотивации и предвкушения</strong>. Он выделяется ДО действия, когда мозг предсказывает награду. Учёный Вольфрам Шульц (Германия, 1990-е) открыл: обезьяна получает дофамин не когда пьёт сок, а когда видит сигнал, что сок скоро будет.\n\n<strong>Отсюда главный вывод:</strong> дофамин движет тобой в предвкушении, а не в момент удовольствия. Именно поэтому "скроллинг ленты" так затягивает — каждый свайп даёт новое предсказание.',steps:['Понаблюдай за собой: что ты делаешь в предвкушении, а что в момент получения?','Заметь: сколько раз за день ты открываешь телефон "просто посмотреть"?','Вспомни момент, когда ожидание было приятнее результата.','Пойми, где дофамин работает против тебя (соцсети, сладкое, новости), где за тебя (цели, обучение, тренировки).'],practice:'Дневник дофамина — 3 дня. Каждый раз когда тянет на автомате к телефону — запиши: что предвкушаешь? Что реально получил?',reflection:'Сколько действий за день ты делаешь из предвкушения, а не из реальной потребности?'},
{title:'Дофаминовая яма',mechanism:'<strong>Дофаминовая яма</strong> — состояние, когда базовый уровень дофамина падает после пиковых стимулов. Механизм: если ты получил 10 единиц дофамина (соцсети, сахар, порно, азартные игры), мозг снижает базовый уровень на 2-3 единицы. Теперь обычная еда, работа, книги кажутся "скучными" — им нужно больше стимула.\n\nПрофессор Анна Лембке (Stanford) в книге "Dopamine Nation" описывает: люди, у которых падает базовый дофамин, не могут радоваться простому. Лечение — <strong>дофаминовое голодание</strong> 24-48 часов от цифровых стимулов.',steps:['Определи свои источники пикового дофамина: соцсети? игры? сахар? порно?','Выбери 1-2 и откажись от них на 24 часа.','Заметь: как меняется восприятие обычных занятий?','Если резко тянет — это ломка. Она длится 3-7 дней.','После 7 дней "детокса" базовый уровень восстанавливается.'],practice:'24 часа без главного источника. Замени на прогулку, чтение, разговор.',reflection:'Что ты чувствуешь в первые 6 часов детокса?'},
{title:'Как управлять дофамином',mechanism:'Дофамином можно управлять, используя 3 принципа:\n\n<strong>1. Отложенная награда.</strong> Не позволяй себе награду за 5 секунд (лайки, шортсы). Вместо этого — за 30-60 минут реального действия.\n\n<strong>2. Переменное подкрепление.</strong> Награда за усилие, а не за результат. Мозг учится любить процесс.\n\n<strong>3. Правило "после дела".</strong> Не можешь не смотреть соцсети — смотри только ПОСЛЕ полезной активности.',steps:['Введи правило: телефон не беру первые 30 мин после пробуждения.','Награду (кофе, шортсы, музыка) — только после завершённого дела.','Тренировка: не ради результата, а ради процесса.','Раз в неделю — полный детокс на 4-6 часов.'],practice:'Неделя: 30 мин после пробуждения без телефона. Записывай эффект.',reflection:'Что происходит с тревожностью к концу недели?'}

{id:'l1m2',title:'Прокрастинация',emoji:'⏳',desc:'Не защита, а конфликт мозга',lessons:[
{title:'Реальные причины прокрастинации',mechanism:'Прокрастинация — не лень и не "защита от дискомфорта". Мозг делит задачи на 2 категории:\n\n<strong>1. Конфликт "сейчас vs потом".</strong> Лимбическая система (эмоциональный мозг) видит только СЕЙЧАС. Префронтальная кора (рациональный мозг) думает о будущем. Когда задача скучная, лимбическая система побеждает.\n\n<strong>2. Синдром "неприятной задачи".</strong> Профессор Тим Пичил (Carleton University, 2016) доказал: прокрастинация — результат <strong>плохого настроения</strong> от задачи. Мы не откладываем "полезное", мы откладываем "неприятное".\n\n<strong>3. Перфекционизм.</strong> Чем выше планка, тем страшнее начать. Идеализм → тревога → откладывание.',steps:['Раздели задачи на 2 категории: интересные и неприятные.','Для неприятных — дай себе право делать плохо на первом этапе.','Уменьши планку до смешного уровня (написать 1 предложение, сделать 1 звонок).','Награди себя после даже минимального действия.'],practice:'Выбери неприятную задачу. Сделай её на 20%. Только 20%.',reflection:'Что было страшнее — делать или думать о задаче?'},
{title:'Триггеры прокрастинации',mechanism:'Прокрастинация запускается конкретными триггерами:\n\n<strong>1. Скука</strong> — задача однообразная.\n<strong>2. Тревога</strong> — задача пугает объёмом или сложностью.\n<strong>3. Неясность</strong> — непонятно, с чего начать.\n<strong>4. Усталость</strong> — нет ресурса.\n<strong>5. Сопротивление</strong> — задача навязана извне.\n\nОпределение триггера — это 50% решения. Один триггер — одна техника. Скука → геймификация. Тревога → разбить на части. Неясность → план. Усталость → отдых. Сопротивление → найти свой смысл.',steps:['Определи: какой триггер у тебя сегодня?','Подбери под триггер конкретную технику.','Попробуй 1 раз — заметь результат.','Веди дневник триггеров неделю.'],practice:'7 дней записывай: когда прокрастинируешь — что за триггер? Какая техника помогла?',reflection:'Какой триггер у тебя главный?'},
{title:'Техники против прокрастинации',mechanism:'Работающие техники (проверены исследованиями):\n\n<strong>1. Правило 2 минут (Дэвид Аллен, GTD).</strong> Если задача ≤2 мин — делай сразу.\n\n<strong>2. Pomodoro (Франческо Чирилло).</strong> 25 мин работы, 5 отдыха. Ключ — начать, потом мозг втягивается.\n\n<strong>3. Eat That Frog (Брайан Трейси).</strong> Самое сложное — первым с утра.\n\n<strong>4. Time-blocking.</strong> Задача не "когда-нибудь", а "с 10:00 до 10:25".\n\n<strong>5. Habit stacking (Би Джей Фогг).</strong> "После [старая привычка] я сделаю [новая]".\n\n<strong>6. Do the worst first.</strong> Начни с самой неприятной части.',steps:['Выбери 1 технику на неделю.','Применяй её ежедневно.','Записывай, сколько раз она сработала.','Через неделю — оцени результат.'],practice:'Неделя Pomodoro. Каждый помидор — запись в дневник: что сделал, отвлекался ли.',reflection:'Какая техника работает лично для тебя?'}
]},
{id:'l1m3',title:'Кортизол и стресс',emoji:'⚡',desc:'Гормон выживания',lessons:[
{title:'Кортизол: что это',mechanism:'Кортизол — гормон стресса, вырабатывается надпочечниками. Это НЕ враг. Утром он даёт энергию (пик в 6-8 утра). В опасности — мобилизует. Но хронически высокий кортизол разрушает:\n\n<strong>Мозг:</strong> убивает нейроны в гиппокампе → ухудшение памяти.\n<strong>Иммунитет:</strong> подавляет → частые болезни.\n<strong>Сердце:</strong> повышает давление → инфаркт.\n<strong>Вес:</strong> увеличивает жир на животе.\n<strong>Сон:</strong> разрушает → замкнутый круг.\n\nРоберт Сапольски (Stanford) в книге "Почему у зебр не бывает инфаркта" доказал: хронический стресс (месяцы, годы) убивает, острый — спасает.',steps:['Измерь: как часто ты чувствуешь напряжение в теле?','Сделай анализ: хронический или острый стресс у тебя?','Начни с малого: 5 мин дыхания 4-7-8 в день.','Через неделю — 2 раза в день.'],practice:'Неделю отслеживай уровень стресса по шкале 1-10 утром, днём, вечером.',reflection:'В какие часы кортизол у тебя максимальный?'},
{title:'Техники снижения кортизола',mechanism:'<strong>Работает:</strong>\n\n<strong>1. Дыхание 4-7-8 (Эндрю Вейл).</strong> Вдох 4, задержка 7, выдох 8. Снижает кортизол за 2 минуты.\n\n<strong>2. Медитация 10 мин.</strong> Sara Lazar (Harvard): 8 недель снижают кортизол на 25%.\n\n<strong>3. Движение 30 мин.</strong> Сжигает кортизол через потоотделение.\n\n<strong>4. Природа 2 часа в неделю.</strong> Японское "синрин-йоку" (-16% кортизола).\n\n<strong>5. Социальные связи.</strong> Разговор с близким снижает кортизол.\n\n<strong>6. Сон 7-9 ч.</strong> Хронический недосып → кортизол +40%.\n\n<strong>НЕ работает:</strong> алкоголь (повышает), соцсети (повышают), сахар (повышает на 2 часа).',steps:['Выбери 2 техники.','Применяй 7 дней.','Записывай эффект по шкале 1-10.','Усиль, что работает.'],practice:'Дыхание 4-7-8 утром + прогулка 30 мин днём. 7 дней.',reflection:'Как изменилось самочувствие за неделю?'}
]},
{id:'l1m4',title:'Сон',emoji:'😴',desc:'Треть жизни',lessons:[
{title:'Что такое сон',mechanism:'Мэттью Уокер ("Why We Sleep", 2017): сон — не пассивное состояние, а активная работа мозга.\n\n<strong>4 стадии:</strong>\nN1 — засыпание (5 мин).\nN2 — лёгкий сон (50%).\nN3 — глубокий сон (25%) → восстановление тела, иммунитет.\nREM — быстрый сон (25%) → память, эмоции, креативность.\n\n<strong>Циклы:</strong> 90 минут × 4-5 = 7-9 часов.\n\n<strong>Что происходит без сна:</strong>\n24 ч без сна = -30% когнитивных функций.\nНеделю по 5 ч = уровень алкоголя в крови 0.1%.\nХронически <6 ч = риск деменции ×1.5.',steps:['Оцени, сколько ты спишь в среднем.','Посчитай: сколько циклов ты проходишь?','Начни с +30 мин сна в неделю.','Цель: 7-9 часов.'],practice:'Неделю соблюдай режим ±30 мин. Записывай качество сна 1-10.',reflection:'Что мешает тебе спать 8 часов?'},
{title:'Правила глубокого сна',mechanism:'<strong>Правила (по Уокеру и Huberman):</strong>\n\n<strong>1. Свет утром.</strong> 10-30 мин на улице до 9:00 = якорь циркадного ритма.\n<strong>2. Кофеин до 14:00.</strong> Период полураспада 6 ч.\n<strong>3. Алкоголь — нет.</strong> Помогает уснуть, разрушает глубокий сон.\n<strong>4. Экраны — стоп.</strong> Синий свет = -50% мелатонина.\n<strong>5. Температура 18-20°C.</strong> Тело охлаждается для сна.\n<strong>6. Спальня — только для сна.</strong> Никаких рабочих столов.\n<strong>7. Тёмно.</strong> Затемняющие шторы или маска.\n<strong>8. Еда — за 3 часа.</strong> Поздний ужин = плохой сон.',steps:['Выбери 3 правила.','Применяй неделю.','Записывай результат.','Добавь ещё.'],practice:'Внедри свет утром + температуру 18°C + экран-стоп за час до сна.',reflection:'Как меняется качество сна за неделю?'}
]},
{id:'l1m5',title:'Эмоции и тревога',emoji:'🌊',desc:'Как работают чувства',lessons:[
{title:'Анатомия эмоций',mechanism:'<strong>Эмоция живёт 90 секунд.</strong> Это открытие нейробиолога Джилл Болти Тейлор. Химический сигнал эмоции проходит через тело за 90 сек и исчезает. Всё, что дольше — наша интерпретация (мысль о мысли).\n\n<strong>Миндалевидное тело</strong> реагирует за 100 мс. <strong>Кора</strong> — за 6 сек. Поэтому сначала чувствуем, потом думаем.\n\n<strong>7 базовых эмоций (Пол Экман):</strong> радость, грусть, страх, злость, удивление, отвращение, презрение.',steps:['Когда чувствуешь сильную эмоцию — засеки 90 сек.','Заметь, что происходит с эмоцией через 90 сек.','Если длится дольше — это уже мысль, а не эмоция.','Работай с мыслью.'],practice:'Неделю отслеживай: сколько длится твоя тревога физически?',reflection:'Насколько часто ты застреваешь в интерпретации?'},
{title:'Тревога: механизм',mechanism:'Тревога — предсказание опасности, которой ещё нет. Это <strong>полезная</strong> функция мозга: он моделирует будущее и ищет угрозы.\n\n<strong>Проблема начинается, когда:</strong>\n• Угроза нереальна.\n• Она постоянно "включена".\n• Тело реагирует как на реальную опасность.\n\n<strong>Круг тревоги:</strong> мысль → тревога → телесная реакция → ещё больше мыслей → паника.\n\nРазорвать круг можно с любой точки: тело (дыхание), мысль (КПТ), поведение (экспозиция).',steps:['Определи: реальна ли угроза?','Что в моей власти, что нет?','Примени технику заземления.','Не избегай — столкнись маленькими шагами.'],practice:'Когда чувствуешь тревогу — 3 глубоких вдоха + 5-4-3-2-1.',reflection:'Какая тревога самая частая у тебя?'},
{title:'Работа с тревогой (КПТ)',mechanism:'<strong>КПТ (Аарон Бек, 1960-е)</strong> — самая изученная терапия в мире. Работает с <strong>автоматическими мыслями</strong>.\n\n<strong>Формула:</strong>\nСитуация → Автоматическая мысль → Эмоция → Поведение.\n\n<strong>5 когнитивных искажений:</strong>\n1. Катастрофизация — "всё плохо, конец света".\n2. Чёрно-белое мышление — "или идеально, или провал".\n3. Чтение мыслей — "он думает, что я дурак".\n4. Обобщение — "всегда так".\n5. Обесценивание — "это не считается".\n\n<strong>Техника:</strong> запиши мысль → проверь доказательства за/против → сформулируй альтернативу.',steps:['Записывай 3 мысли в день.','Определяй искажение.','Оспаривай фактами.','Записывай альтернативу.'],practice:'Дневник мыслей 7 дней. Каждое утро — 1 тревожная мысль.',reflection:'Какое искажение твоё главное?'}
]}
]},
{id:'l2',num:2,title:'База',subtitle:'Ученик',emoji:'📚',desc:'Привычки, энергия, отношения.',modules:[
{id:'l2m1',title:'Привычки',emoji:'🔄',desc:'Механизм формирования',lessons:[
{title:'Как работают привычки',mechanism:'<strong>Петля привычки (Чарльз Дахигг, "Сила привычки"):</strong>\nТриггер (Cue) → Рутина (Routine) → Награда (Reward).\n\n<strong>Джеймс Клир ("Атомные привычки"):</strong> добавил желание — Craving. Мозг выделяет дофамин на триггер, не на награду.\n\n<strong>Ключевой факт:</strong> привычка формируется не 21 день, а 66 дней (исследование Phillips, 2009). Диапазон: 18-254 дня.\n\n<strong>Базал ганглии</strong> — отдел мозга, где хранятся привычки. Работает автоматически, не тратит энергию.',steps:['Определи: какая привычка тебе нужна?','Разбей на триггер, действие, награду.','Сделай триггер очевидным.','Начни с минимальной версии.'],practice:'Выбери 1 привычку. Внедри за неделю. Отмечай в календаре.',reflection:'Что у тебя уже на автомате?'},
{title:'4 закона изменения',mechanism:'<strong>4 закона Клира:</strong>\n\n<strong>1. Сделай очевидной.</strong> Положи книгу на подушку. Поставь кроссовки у двери.\n<strong>2. Сделай привлекательной.</strong> Свяжи с любимым (музыка, кофе).\n<strong>3. Сделай простой.</strong> 2 минуты максимум на старте.\n<strong>4. Сделай приятной.</strong> Награда сразу после.\n\n<strong>Обратные законы — убрать плохое:</strong>\nСделай невидимой. Непривлекательной. Сложной. Неприятной.',steps:['Выбери привычку.','Примени 4 закона.','Записывай ежедневно.','Через 66 дней — автоматизм.'],practice:'Внедри 1 привычку через 4 закона.',reflection:'Какие привычки хочешь убрать?'}
]},
{id:'l2m2',title:'Энергия',emoji:'🔋',desc:'Откуда берётся и как не терять',lessons:[
{title:'4 вида энергии',mechanism:'<strong>Тони Шварц ("The Power of Full Engagement"):</strong> не время, а энергия — ресурс. 4 вида:\n\n<strong>1. Физическая</strong> — сон, еда, движение.\n<strong>2. Эмоциональная</strong> — настроение, связи.\n<strong>3. Ментальная</strong> — фокус, ясность.\n<strong>4. Духовная</strong> — смысл, ценности.\n\nЕсли одна на нуле — остальные падают. Восстанавливать надо все 4 ритмично (90 мин работы + 15 отдыха).',steps:['Оцени 4 энергии по 1-10.','Найди, что на нуле.','Восстанавливай каждый день.','Проверяй — что улучшилось.'],practice:'Неделю веди дневник энергии: 3 раза в день оценка + что делал.',reflection:'Какая энергия проседает чаще?'}
]},
{id:'l2m3',title:'Отношения',emoji:'💞',desc:'Эмоциональный интеллект',lessons:[
{title:'Активное слушание',mechanism:'<strong>Джон Готтман (40 лет исследований пар):</strong> 69% конфликтов не решаются. Важно не РЕШИТЬ, а как вы ПРОХОДИТЕ конфликт.\n\n<strong>3 уровня слушания:</strong>\n1. Слышать слова.\n2. Слушать смысл.\n3. Понимать эмоции.\n\n<strong>Техники:</strong>\n• Парафраз — "Я правильно понял, что...".\n• Отражение — "Ты чувствуешь...".\n• Уточнение — "Что именно?".\n\n<strong>Соотношение 5:1.</strong> На 1 негативное — 5 позитивных взаимодействий.',steps:['В разговоре сначала повтори, что услышал.','Спроси уточнение.','Отрази эмоцию.','Не давай советов без запроса.'],practice:'3 разговора с парафразом. Записывай эффект.',reflection:'Как часто ты слушаешь, чтобы ответить, а не понять?'}
]}
]},
{id:'l3',num:3,title:'Практика',subtitle:'Практик',emoji:'🎯',desc:'Продуктивность, деньги, коммуникация.',modules:[
{id:'l3m1',title:'Продуктивность',emoji:'⚡',desc:'Система работы',lessons:[
{title:'Deep Work',mechanism:'<strong>Кэл Ньюпорт ("Deep Work", 2016):</strong> способность концентрироваться без отвлечений — суперсила XXI века.\n\n<strong>Факты:</strong>\n• 3-4 часа глубокой работы > 10 часов "многозадачности".\n• После прерывания нужно 23 мин на восстановление фокуса.\n• Средний офисный работник отвлекается каждые 11 минут.\n\n<strong>Правила:</strong>\n• 90-минутные блоки.\n• Телефон в другой комнате.\n• Ритуал входа (музыка, чай, место).\n• Метрики — сколько часов глубокой работы в день.',steps:['Заблокируй 90 мин в календаре.','Убери телефон.','Одна задача.','После — 15 мин отдыха.'],practice:'1 сессия Deep Work в день, неделю. Записывай часы.',reflection:'Сколько часов глубокой работы у тебя в день?'}
]},
{id:'l3m2',title:'Деньги',emoji:'💰',desc:'Психология и система',lessons:[
{title:'Финансовая система',mechanism:'<strong>50/30/20 (Элизабет Уоррен):</strong>\n• 50% — нужды.\n• 30% — желания.\n• 20% — сбережения.\n\n<strong>Метод снежного кома (Дэйв Рамси):</strong> плати минимум по всем долгам, максимум — по мелкому. Закрыл — переходи к следующему.\n\n<strong>Подушка:</strong> 3-6 месяцев расходов. Не в акциях. Только вклады.\n\n<strong>Сложный процент:</strong> $100/мес × 30 лет × 7% = $120 000.',steps:['Записывай расходы 3 месяца.','Определи норму сбережений.','Создай подушку.','Инвестируй в индексы.'],practice:'Записывай все расходы неделю. В конце — анализ.',reflection:'Сколько ты тратишь на импульсивные покупки?'}
]},
{id:'l3m3',title:'Коммуникация',emoji:'💬',desc:'Я-сообщения и границы',lessons:[
{title:'Я-сообщения',mechanism:'<strong>Формула:</strong> "Когда [факт], я чувствую [эмоция], потому что [потребность]. Я хочу [просьба]".\n\n<strong>Почему работает:</strong>\n• "Ты" запускает защиту.\n• "Я" открывает диалог.\n• Факт — без оценки.\n\n<strong>Пример:</strong>\n❌ "Ты вечно опаздываешь!"\n✅ "Когда ты опаздываешь на 15 мин, я тревожусь, потому что ценю наше время. Приходи, пожалуйста, вовремя".',steps:['Заметь свою претензию.','Переформулируй через "Я".','Скажи без обвинения.','Дай возможность ответить.'],practice:'3 претензии переформулируй через Я-сообщение.',reflection:'Как изменилась реакция собеседника?'}
]}
]},
{id:'l4',num:4,title:'Мастерство',subtitle:'Мастер',emoji:'👑',desc:'Смысл, лидерство, глубина.',modules:[
{id:'l4m1',title:'Смысл',emoji:'🎯',desc:'Икигай и ценности',lessons:[
{title:'Икигай',mechanism:'<strong>Икигай</strong> (японский) — причина вставать утром. Пересечение 4 сфер:\n\n1. Что я люблю.\n2. Что я умею.\n3. За что платят.\n4. Что нужно миру.\n\nЖители Окинавы (самые долгоживущие) считают икигай основой жизни.\n\n<strong>Виктор Франкл</strong> (выживший в концлагере, "Человек в поисках смысла"): "У кого есть 'зачем', выдержит почти любое 'как'".',steps:['Нарисуй 4 круга.','Заполни каждый.','Найди пересечение.','Проверь: соответствует ли твоя жизнь?'],practice:'Напиши свой икигай в 3 предложениях.',reflection:'В чём твой смысл?'}
]}
]}
];

var ENGLISH_LEVELS=[
{id:'a1',title:'A1 — Beginner',subtitle:'Начальный',emoji:'📗',desc:'Базовые слова и фразы',modules:[

function getLevelProgress(levelId){var level=LEARNING_LEVELS.find(function(l){return l.id===levelId});if(!level)return{done:0,total:0,pct:0};var total=0,done=0;level.modules.forEach(function(mod){mod.lessons.forEach(function(l,idx){total++;if(state.levelProgress&&state.levelProgress[levelId+'_'+mod.id+'_'+idx])done++})});return{done:done,total:total,pct:total>0?Math.round(done/total*100):0}}
function isLevelUnlocked(levelId){var idx=LEARNING_LEVELS.findIndex(function(l){return l.id===levelId});if(idx<=0)return true;var prev=LEARNING_LEVELS[idx-1];return getLevelProgress(prev.id).pct===100}

function renderLearning(){var totalDone=0,totalLessons=0;LEARNING_LEVELS.forEach(function(level){var p=getLevelProgress(level.id);totalDone+=p.done;totalLessons+=p.total});var overallPct=totalLessons?Math.round(totalDone/totalLessons*100):0;var html='<div class="page"><div class="title-xl">Обучение</div><div class="card card-gradient"><div style="opacity:.9;font-size:13px;">Общий прогресс</div><div style="font-size:44px;font-weight:800;line-height:1;margin:8px 0;">'+overallPct+'%</div><div style="opacity:.9;font-size:13px;">'+totalDone+' из '+totalLessons+' уроков</div></div>';LEARNING_LEVELS.forEach(function(level){var p=getLevelProgress(level.id);var unlocked=isLevelUnlocked(level.id);var completed=p.pct===100;var cls='level-card';if(completed)cls+=' completed';else if(!unlocked)cls+=' locked';else if(p.pct>0)cls+=' active';html+='<div class="'+cls+'" onclick="'+(unlocked?'openLevel(\''+level.id+'\')':'toast(\'Заверши предыдущий\',\'warning\')')+'"><div class="level-header"><div class="level-num">'+(completed?'✓':level.num)+'</div><div class="level-info"><div class="level-title">'+level.emoji+' '+level.title+'</div><div class="level-subtitle">'+level.subtitle+'</div></div></div><div class="level-desc">'+level.desc+'</div>';if(unlocked&&p.pct>0)html+='<div class="progress"><div class="progress-fill" style="width:'+p.pct+'%;"></div></div>';html+='</div>'});html+='</div>';document.getElementById('app').innerHTML=html}

function openLevel(levelId){currentLevelId=levelId;navigate('levelDetail')}

function renderLevelDetail(){var level=LEARNING_LEVELS.find(function(l){return l.id===currentLevelId});if(!level){navigate('learning');return}var p=getLevelProgress(level.id);var html='<div class="page"><button class="btn btn-ghost btn-sm" onclick="navigate(\'learning\')" style="margin-bottom:16px;">← Все уровни</button><div style="text-align:center;margin-bottom:24px;"><div style="font-size:64px;margin-bottom:12px;">'+level.emoji+'</div><div class="title-xl" style="margin-bottom:8px;">'+level.title+'</div><div class="footnote text-secondary">'+level.desc+'</div></div><div class="card"><div class="row-between mb-2"><span class="subhead">Прогресс</span><span class="subhead text-secondary">'+p.done+'/'+p.total+'</span></div><div class="progress"><div class="progress-fill" style="width:'+p.pct+'%;"></div></div></div><div class="card"><h2>📦 Модули</h2>';level.modules.forEach(function(mod){var modDone=mod.lessons.every(function(l,idx){return state.levelProgress[level.id+'_'+mod.id+'_'+idx]});var modCount=mod.lessons.filter(function(l,idx){return state.levelProgress[level.id+'_'+mod.id+'_'+idx]}).length;html+='<div class="module-card'+(modDone?' completed':'')+'" onclick="openModule(\''+level.id+'\',\''+mod.id+'\')"><div class="module-header"><div class="module-icon">'+(modDone?'✓':mod.emoji)+'</div><div class="module-info"><div class="module-title">'+mod.title+'</div><div class="module-meta">'+modCount+'/'+mod.lessons.length+'</div></div></div><div class="module-desc">'+mod.desc+'</div></div>'});html+='</div></div>';document.getElementById('app').innerHTML=html}

function openModule(levelId,moduleId){currentLevelId=levelId;currentModuleId=moduleId;navigate('moduleDetail')}

function renderModuleDetail(){var level=LEARNING_LEVELS.find(function(l){return l.id===currentLevelId});if(!level){navigate('learning');return}var module=level.modules.find(function(m){return m.id===currentModuleId});if(!module){navigate('levelDetail');return}var doneCount=module.lessons.filter(function(l,idx){return state.levelProgress[level.id+'_'+module.id+'_'+idx]}).length;var html='<div class="page"><button class="btn btn-ghost btn-sm" onclick="navigate(\'levelDetail\')" style="margin-bottom:16px;">← К модулям</button><div style="text-align:center;margin-bottom:24px;"><div style="font-size:56px;margin-bottom:12px;">'+module.emoji+'</div><div class="title-xl" style="margin-bottom:8px;">'+module.title+'</div></div><div class="card"><h2>📖 Уроки</h2>';module.lessons.forEach(function(lesson,i){var key=level.id+'_'+module.id+'_'+i;var isDone=!!state.levelProgress[key];var cls='lesson-row'+(isDone?' done':' current');html+='<div class="'+cls+'" onclick="openLesson('+i+')"><div class="lesson-num">'+(isDone?'✓':(i+1))+'</div><div class="lesson-title">'+lesson.title+'</div><div style="color:var(--text-4);font-size:20px;">›</div></div>'});html+='</div></div>';document.getElementById('app').innerHTML=html}

function openLesson(idx){currentLessonIdx=idx;var level=LEARNING_LEVELS.find(function(l){return l.id===currentLevelId});if(!level)return;var module=level.modules.find(function(m){return m.id===currentModuleId});if(!module)return;var lesson=module.lessons[idx];if(!lesson)return;var key=level.id+'_'+module.id+'_'+idx;var isDone=!!state.levelProgress[key];var html='<div class="page"><button class="btn btn-ghost btn-sm" onclick="navigate(\'moduleDetail\')" style="margin-bottom:16px;">← К урокам</button><div style="margin-bottom:20px;"><div class="footnote text-tertiary" style="margin-bottom:8px;">'+level.title+' · '+module.title+' · Урок '+(idx+1)+'/'+module.lessons.length+'</div><div style="font-size:26px;font-weight:800;line-height:1.2;">'+lesson.title+'</div></div><div class="card" style="padding:20px;">';html+='<div class="lesson-section mechanism"><div class="lesson-section-title">🔬 Механизм</div><div class="lesson-content">'+formatLesson(lesson.mechanism)+'</div></div>';html+='<div class="lesson-section steps"><div class="lesson-section-title">⚙️ Ключевые действия</div><div class="lesson-content">'+formatSteps(lesson.steps)+'</div></div>';html+='<div class="lesson-section practice"><div class="lesson-section-title">🎯 Практика</div><div class="lesson-content">'+esc(lesson.practice)+'</div></div>';html+='<div class="lesson-section reflection"><div class="lesson-section-title">💭 Рефлексия</div><div class="lesson-content">'+esc(lesson.reflection)+'</div></div>';html+='</div>';if(!isDone){html+='<button class="btn btn-primary btn-block" onclick="completeLesson()">✓ Изучено</button>'}else{html+='<div class="badge badge-success" style="display:block;text-align:center;padding:14px;">✓ Урок изучен</div>';if(idx<module.lessons.length-1){html+='<button class="btn btn-primary btn-block mt-3" onclick="openLesson('+(idx+1)+')">Следующий →</button>'}}html+='</div>';document.getElementById('app').innerHTML=html;window.scrollTo({top:0})}

function formatLesson(text){var h=esc(text);h=h.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');h=h.replace(/\n\n/g,'</p><p>');h=h.replace(/\n/g,'<br>');return '<p>'+h+'</p>'}
function formatSteps(steps){var h='<ol>';steps.forEach(function(s){h+='<li>'+esc(s)+'</li>'});h+='</ol>';return h}

function completeLesson(){var level=LEARNING_LEVELS.find(function(l){return l.id===currentLevelId});if(!level)return;var module=level.modules.find(function(m){return m.id===currentModuleId});if(!module)return;var key=level.id+'_'+module.id+'_'+currentLessonIdx;if(!state.levelProgress)state.levelProgress={};state.levelProgress[key]=true;save();toast('✓ Урок изучен!','success');playSound('success');haptic('success');checkAchievements();openLesson(currentLessonIdx)}

/* АНГЛИЙСКИЙ */
function renderEnglish(){var total=0,done=0;ENGLISH_LEVELS.forEach(function(l){l.modules.forEach(function(m){m.words.forEach(function(w,idx){total++;if(state.englishProgress[l.id+'_'+m.id+'_'+idx])done++})})});var pct=total?Math.round(done/total*100):0;var html='<div class="page"><div class="title-xl">🇬🇧 Английский</div><div class="card card-gradient"><div style="opacity:.9;font-size:13px;">Изучено слов</div><div style="font-size:44px;font-weight:800;margin:8px 0;">'+done+'/'+total+'</div><div style="opacity:.9;font-size:13px;">'+pct+'%</div></div>';ENGLISH_LEVELS.forEach(function(level){html+='<div class="course-card" onclick="openEngLevel(\''+level.id+'\')"><div class="course-header"><div class="course-emoji">'+level.emoji+'</div><div class="course-info"><div class="course-title">'+level.title+'</div><div class="course-meta">'+level.subtitle+' · '+level.modules.length+' модулей</div></div></div></div>'});html+='<div class="card"><h2>📖 Грамматика</h2>';ENGLISH_GRAMMAR.forEach(function(g,i){html+='<div class="grammar-card"><div class="grammar-title">'+g.title+'</div><div class="grammar-rule">'+esc(g.rule)+'</div>';g.examples.forEach(function(ex){html+='<div class="grammar-example">'+esc(ex)+'</div>'});html+='</div>'});html+='</div><div class="card"><h2>💬 Полезные фразы</h2>';ENGLISH_PHRASES.forEach(function(p){html+='<div class="phrase-card"><div style="font-weight:700;color:#5b9eff;">'+esc(p.en)+'</div><div class="footnote text-secondary">'+esc(p.ru)+'</div></div>'});html+='</div></div>';document.getElementById('app').innerHTML=html}

function openEngLevel(id){var level=ENGLISH_LEVELS.find(function(l){return l.id===id});if(!level)return;currentEngLevelId=id;var html='<div class="page"><button class="btn btn-ghost btn-sm" onclick="navigate(\'english\')" style="margin-bottom:16px;">← English</button><div style="text-align:center;margin-bottom:24px;"><div style="font-size:64px;">'+level.emoji+'</div><div class="title-xl">'+level.title+'</div></div>';level.modules.forEach(function(mod){html+='<div class="module-card" onclick="openEngModule(\''+level.id+'\',\''+mod.id+'\')"><div class="module-header"><div class="module-icon">'+mod.emoji+'</div><div class="module-info"><div class="module-title">'+mod.title+'</div><div class="module-meta">'+mod.words.length+' слов</div></div></div></div>'});html+='</div>';document.getElementById('app').innerHTML=html}

function openEngModule(levelId,moduleId){currentEngLevelId=levelId;currentEngModuleId=moduleId;var level=ENGLISH_LEVELS.find(function(l){return l.id===levelId});if(!level)return;var module=level.modules.find(function(m){return m.id===moduleId});if(!module)return;var html='<div class="page"><button class="btn btn-ghost btn-sm" onclick="openEngLevel(\''+levelId+'\')" style="margin-bottom:16px;">← К модулям</button><div class="title-xl">'+module.title+'</div>';module.words.forEach(function(w,idx){var key=levelId+'_'+moduleId+'_'+idx;var isDone=!!state.englishProgress[key];html+='<div class="word-card"><div class="word-en">'+esc(w.en)+'</div><div class="word-transcription">'+esc(w.tr)+'</div><div class="word-ru">'+esc(w.ru)+'</div><div class="word-example">'+esc(w.ex)+'</div><div class="word-actions"><button class="btn btn-sm btn-ghost" onclick="speakWord(\''+esc(w.en).replace(/'/g,"\\'")+'\')">🔊 Слушать</button><button class="btn btn-sm '+(isDone?'btn-success':'btn-primary')+'" onclick="markWord(\''+levelId+'\',\''+moduleId+'\','+idx+')">'+(isDone?'✓ Изучено':'Отметить')+'</button></div></div>'});html+='</div>';document.getElementById('app').innerHTML=html}

function speakWord(word){if('speechSynthesis' in window){var u=new SpeechSynthesisUtterance(word);u.lang='en-US';u.rate=.8;speechSynthesis.speak(u);playSound('click')}else toast('Синтез речи не поддерживается','warning')}

function markWord(levelId,moduleId,idx){var key=levelId+'_'+moduleId+'_'+idx;if(!state.englishProgress)state.englishProgress={};state.englishProgress[key]=true;save();playSound('success');haptic('success');toast('✓ Слово изучено','success');openEngModule(levelId,moduleId)}

/* ХРАНИЛИЩЕ */
function renderStorage(){var total=0;var tables=['tasks','chats','notes','habits','goals','water','mood','workouts','meditations','journal','media','finance','schedule','matrix','paths','courses'];tables.forEach(function(t){if(Array.isArray(state[t]))total+=state[t].length});var lessons=Object.keys(state.levelProgress||{}).length;var words=Object.keys(state.englishProgress||{}).length;var size=new Blob([JSON.stringify(state)]).size;var html='<div class="page"><div class="title-xl">🗄 Хранилище</div>';html+='<div class="card card-gradient"><div style="opacity:.9;font-size:13px;">Всего записей</div><div style="font-size:44px;font-weight:800;margin:8px 0;">'+total+'</div><div style="opacity:.9;font-size:13px;">Размер: '+(size/1024).toFixed(1)+' KB</div></div>';html+='<div class="card"><h2>📊 Таблицы</h2>';tables.forEach(function(t){var count=Array.isArray(state[t])?state[t].length:0;html+='<div class="storage-item"><div class="storage-icon">📋</div><div class="storage-info"><div class="storage-name">'+t+'</div><div class="storage-meta">записей</div></div><div class="storage-size">'+count+'</div></div>'});html+='</div>';html+='<div class="card"><h2>📈 Данные</h2><div class="storage-item"><div class="storage-icon">🎓</div><div class="storage-info"><div class="storage-name">Уроки изучено</div></div><div class="storage-size">'+lessons+'</div></div><div class="storage-item"><div class="storage-icon">🇬🇧</div><div class="storage-info"><div class="storage-name">Слов выучено</div></div><div class="storage-size">'+words+'</div></div><div class="storage-item"><div class="storage-icon">📏</div><div class="storage-info"><div class="storage-name">Метрик записано</div></div><div class="storage-size">'+Object.keys(state.metrics||{}).length+'</div></div></div>';html+='<div class="card"><h2>💾 Операции</h2><div class="btn-row"><button class="btn btn-primary btn-sm" onclick="exportDB()">📤 Экспорт JSON</button><button class="btn btn-ghost btn-sm" onclick="document.getElementById(\'importDB\').click()">📥 Импорт</button><button class="btn btn-ghost btn-sm" onclick="showStorageStats()">📊 Детали</button></div><input type="file" id="importDB" accept=".json" style="display:none" onchange="importDB(event)"/><button class="btn btn-danger btn-block mt-3" onclick="if(confirm(\'Сбросить ВСЕ данные?\')){localStorage.removeItem(\''+STORAGE_KEY+'\');indexedDB.deleteDatabase(DB_NAME);location.reload();}">🗑 Полный сброс</button></div></div>';document.getElementById('app').innerHTML=html}

function showStorageStats(){var details='';var tables=['tasks','chats','notes','habits','goals','water','mood','workouts','meditations','journal','media','finance','schedule','matrix','paths','courses'];tables.forEach(function(t){var count=Array.isArray(state[t])?state[t].length:0;if(count>0)details+=t+': '+count+'\n'});alert('Записи:\n'+details+'\nУроков: '+Object.keys(state.levelProgress||{}).length+'\nСлов: '+Object.keys(state.englishProgress||{}).length)}

function exportDB(){var blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='ai-health-'+today()+'.json';a.click();URL.revokeObjectURL(url);toast('Экспорт готов','success');playSound('success')}
function importDB(e){var file=e.target.files[0];if(!file)return;var reader=new FileReader();reader.onload=function(ev){try{var data=JSON.parse(ev.target.result);if(!confirm('Заменить данные?'))return;state=Object.assign(defaultState(),data);save();toast('Импорт успешен','success');location.reload()}catch(err){toast('Ошибка','error')}};reader.readAsText(file)}

function logRestActivity(title){if(!state.recovery)state.recovery={movies:[],books:[],restActivities:[],sleepLog:[]};if(!state.recovery.restActivities)state.recovery.restActivities=[];state.recovery.restActivities.push({title:title,timestamp:nowISO()});save();playSound('success');toast('✓ Записано','success');haptic('success')}

/* DASHBOARD */
function renderDashboard(){var todayTasks=state.tasks.filter(function(t){return t.created_at&&t.created_at.slice(0,10)===today()});var doneToday=todayTasks.filter(function(t){return t.status==='completed'}).length;var hour=new Date().getHours();var greet=hour<6?'Доброй ночи':hour<12?'Доброе утро':hour<18?'Добрый день':'Добрый вечер';var progress=todayTasks.length?Math.round(doneToday/todayTasks.length*100):0;var userName=state.profile.name?', '+state.profile.name:'';var totalDone=0,totalLessons=0;LEARNING_LEVELS.forEach(function(level){var p=getLevelProgress(level.id);totalDone+=p.done;totalLessons+=p.total});var overallPct=totalLessons?Math.round(totalDone/totalLessons*100):0;var html='<div class="page"><div class="title-xl">'+greet+userName+'</div><div class="card card-gradient"><div class="row-between" style="margin-bottom:14px;"><div><div style="font-size:13px;opacity:.85;">Прогресс дня</div><div style="font-size:40px;font-weight:800;">'+doneToday+'/'+todayTasks.length+'</div></div><div style="font-size:48px;font-weight:800;">'+progress+'%</div></div><div class="progress" style="background:rgba(255,255,255,.25);height:8px;"><div class="progress-fill" style="width:'+progress+'%;background:#fff;"></div></div></div><div class="stat-grid mb-4"><div class="stat-item"><div class="stat-value">'+(state.stats.streak||0)+'</div><div class="stat-label">Streak</div></div><div class="stat-item"><div class="stat-value">'+overallPct+'%</div><div class="stat-label">Обучение</div></div><div class="stat-item"><div class="stat-value">'+Object.keys(state.englishProgress||{}).length+'</div><div class="stat-label">English</div></div></div>';if(!state.profile.surveyDone){html+='<div class="card"><h2>📋 Заполни профиль</h2><button class="btn btn-primary btn-block" onclick="startSurvey()">Начать опрос</button></div>'}html+='<div class="card"><h2>⚡ Быстрые действия</h2><div class="btn-row"><button class="btn btn-ghost btn-sm" onclick="navigate(\'learning\')">🎓 Обучение</button><button class="btn btn-ghost btn-sm" onclick="navigate(\'english\')">🇬🇧 English</button><button class="btn btn-ghost btn-sm" onclick="navigate(\'recovery\')">🌿 Восстановление</button><button class="btn btn-ghost btn-sm" onclick="navigate(\'storage\')">🗄 Хранилище</button></div></div></div>';document.getElementById('app').innerHTML=html}

/* TASKS */
function renderTasks(){var html='<div class="page"><div class="row-between" style="margin-bottom:20px;"><div class="title-xl" style="margin:0;">Задачи</div><button class="btn btn-primary btn-sm" onclick="addTask()">+ Новая</button></div>';if(state.tasks.length){state.tasks.forEach(function(t){html+=taskRow(t)})}else{html+='<div class="empty"><div class="empty-icon">📋</div><div class="empty-title">Нет задач</div></div>'}html+='</div>';document.getElementById('app').innerHTML=html}

function taskRow(t){var pColors={high:'high',medium:'medium',low:'low'};var checked=t.status==='completed';return '<div class="task-item '+(checked?'completed':'')+'" onclick="editTask(\''+t.id+'\')"><div class="priority-bar '+(pColors[t.priority]||'medium')+'"></div><button class="task-checkbox '+(checked?'checked':'')+'" onclick="event.stopPropagation();toggleTask(\''+t.id+'\')">'+(checked?'✓':'')+'</button><div class="task-content"><div class="task-title">'+esc(t.title)+'</div><div class="task-meta"><span>'+(t.planned_time||0)+' мин</span></div></div></div>'}

function addTask(){openSheet('Новая задача','<div class="field"><input type="text" id="t-title" placeholder="Название" autofocus/></div><div class="field"><input type="number" id="t-time" value="30"/></div><button class="btn btn-primary btn-block" onclick="saveTask()">Добавить</button>')}

function saveTask(){var title=((document.getElementById('t-title')||{}).value||'').trim();if(!title)return toast('Введите название','error');state.tasks.unshift({id:uid(),title:title,planned_time:parseInt((document.getElementById('t-time')||{}).value)||30,actual_time:0,status:'pending',priority:'medium',created_at:nowISO()});save();closeSheet();toast('Добавлено','success');playSound('success');renderTasks()}

function toggleTask(id){var t=state.tasks.find(function(x){return x.id===id});if(!t)return;t.status=t.status==='completed'?'pending':'completed';save();playSound('success');haptic('success');renderTasks()}

function editTask(id){var t=state.tasks.find(function(x){return x.id===id});if(!t)return;openSheet('Редактировать','<div class="field"><input type="text" id="e-title" value="'+esc(t.title)+'"/></div><button class="btn btn-primary btn-block" onclick="updateTask(\''+id+'\')">Сохранить</button><button class="btn btn-danger btn-block mt-2" onclick="deleteTask(\''+id+'\')">Удалить</button>')}

function updateTask(id){var t=state.tasks.find(function(x){return x.id===id});if(!t)return;t.title=(document.getElementById('e-title')||{}).value||t.title;save();closeSheet();toast('Сохранено','success');renderTasks()}
function deleteTask(id){if(!confirm('Удалить?'))return;state.tasks=state.tasks.filter(function(t){return t.id!==id});save();closeSheet();toast('Удалено','info');renderTasks()}

/* AI */
function renderAI(){var active=state.settings.activePersona||'coach';var persona=PERSONAS[active]||PERSONAS.coach;var messages=state.chats.filter(function(c){return c.persona===active});var html='<div class="page"><div class="title-xl">AI</div><div class="persona-bar">';Object.keys(PERSONAS).forEach(function(k){var p=PERSONAS[k];html+='<button class="persona-item '+(active===k?'active':'')+'" data-p="'+k+'" onclick="switchPersona(\''+k+'\')">'+p.name+'</button>'});html+='</div><div class="card" style="padding:16px 18px;"><div class="row-between"><div class="row" style="gap:12px;"><div style="font-size:28px;">'+persona.emoji+'</div><div><div style="font-weight:700;">'+persona.name+'</div><div class="caption text-tertiary">'+persona.label+'</div></div></div><button class="btn btn-ghost btn-sm" onclick="openAISettings()">⚙️</button></div></div><div class="card" style="min-height:360px;max-height:62vh;overflow-y:auto;padding:18px;" id="chatBox"><div class="chat">';if(messages.length){messages.forEach(function(m){html+='<div class="msg msg-'+(m.role==='user'?'user':'bot')+'">'+(m.role==='user'?esc(m.text):renderMd(m.text))+'</div>'})}else{html+='<div class="empty"><div class="empty-icon">'+persona.emoji+'</div><div class="empty-text">Задай вопрос</div></div>'}html+='</div></div><div class="row" style="margin-top:14px;"><input type="text" id="chatInput" placeholder="Сообщение..." style="flex:1;" onkeydown="if(event.key===\'Enter\'){event.preventDefault();sendMsg();}"/><button class="btn btn-primary btn-icon" onclick="sendMsg()">➤</button></div></div>';document.getElementById('app').innerHTML=html;var box=document.getElementById('chatBox');if(box)box.scrollTop=box.scrollHeight}

function switchPersona(p){state.settings.activePersona=p;save();renderAI()}

async function sendMsg(){var input=document.getElementById('chatInput');if(!input)return;var text=input.value.trim();if(!text)return;input.value='';input.disabled=true;var persona=state.settings.activePersona||'coach';state.chats.push({id:uid(),persona:persona,role:'user',text:text,timestamp:nowISO()});save();renderAI();var reply=await callAI(persona,text);state.chats.push({id:uid(),persona:persona,role:'coach',text:reply,timestamp:nowISO()});save();checkAchievements();renderAI()}

async function callAI(persona,userText){var key=state.settings.apiKey||(state.integrations.gemini&&state.integrations.gemini.apiKey);if(!key)return fallbackReply(persona,userText);var p=PERSONAS[persona];var history=state.chats.filter(function(c){return c.persona===persona}).slice(-10);try{var sys=p.prompt;var rest=history.map(function(m){return{role:m.role==='user'?'user':'model',parts:[{text:m.text}]}});var model=(state.integrations.gemini&&state.integrations.gemini.model)||'gemini-1.5-flash';var resp=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent?key='+key,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({system_instruction:{parts:[{text:sys}]},contents:rest})});var data=await resp.json();return (data.candidates&&data.candidates[0]&&data.candidates[0].content&&data.candidates[0].content.parts&&data.candidates[0].content.parts[0]&&data.candidates[0].content.parts[0].text)||fallbackReply(persona,userText)}catch(e){return fallbackReply(persona,userText)}}

function fallbackReply(persona,text){text=text||'';if(/суицид|покончить|не хочу жить/i.test(text)){return '🆘 8-800-2000-122 · findahelpline.com'}if(persona==='doctor')return 'Я — AI-консультант. *⚠️ Не заменяет врача.*';if(persona==='psych')return 'Слышу тебя. Что происходит?';return 'Слышу тебя. Расскажи подробнее.'}

function renderMd(text){if(!text)return '';var h=esc(text);h=h.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');h=h.replace(/\n/g,'<br>');return '<p>'+h+'</p>'}

function openAISettings(){openSheet('Настройки AI','<div class="field"><label class="field-label">API ключ</label><input type="password" id="ai-k" value="'+esc(state.settings.apiKey||'')+'"/></div><button class="btn btn-primary btn-block" onclick="saveAISettings()">Сохранить</button>')}
function saveAISettings(){state.settings.apiKey=((document.getElementById('ai-k')||{}).value||'').trim();state.integrations.gemini.apiKey=state.settings.apiKey;state.settings.provider='gemini';save();closeSheet();toast('Сохранено','success');renderAI()}

function saveGemini(){state.integrations.gemini.apiKey=(document.getElementById('gem-key')||{}).value||'';state.settings.apiKey=state.integrations.gemini.apiKey;state.settings.provider='gemini';save();toast('Сохранено','success');renderIntegrations()}

/* PROFILE */
function renderProfile(){var p=state.profile;var unlocked=p.achievements||[];var html='<div class="page"><div class="profile-hero"><div class="profile-avatar" onclick="pickEmoji()">'+p.emoji+'</div><div class="profile-name">'+esc(p.name||'Пользователь')+'</div></div><div class="card"><h2>✏️ Имя</h2><input type="text" id="profile-name" value="'+esc(p.name)+'" onchange="saveProfileName(this.value)"/></div>';if(!p.surveyDone){html+='<div class="card"><h2>📋 Опросник</h2><button class="btn btn-primary btn-block" onclick="startSurvey()">Начать</button></div>'}html+='<div class="card"><h2>🏆 Достижения ('+unlocked.length+'/'+ACHIEVEMENTS.length+')</h2><div class="achieve-grid">';ACHIEVEMENTS.forEach(function(a){var isUnlocked=unlocked.indexOf(a.id)>=0;html+='<div class="achieve-item '+(isUnlocked?'unlocked':'locked')+'"><div class="achieve-icon">'+a.icon+'</div><div class="achieve-name">'+a.name+'</div></div>'});html+='</div></div></div>';document.getElementById('app').innerHTML=html}

function pickEmoji(){var emojis=['😊','😎','🤓','🧑‍💻','🦊','🐱','🐶','🦁','🐼','🦉','🌟','⚡','🔥','💎','🚀','🎯','🧠','💪'];var html='<div class="emoji-grid">';emojis.forEach(function(e){var sel=e===state.profile.emoji?' selected':'';html+='<button class="emoji-pick'+sel+'" onclick="setEmoji(\''+e+'\')">'+e+'</button>'});html+='</div>';openSheet('Аватар',html)}
function setEmoji(e){state.profile.emoji=e;save();closeSheet();renderProfile();updateHeaderAvatar()}
function saveProfileName(name){state.profile.name=(name||'').trim()||'Пользователь';save();toast('Сохранено','success');updateHeaderAvatar()}

/* SETTINGS */
function renderSettings(){var html='<div class="page"><div class="title-xl">Настройки</div><div class="card"><h2>🎨 Тема</h2><button class="btn btn-primary btn-block" onclick="openThemePicker()">Сменить</button></div><div class="card"><h2>🔊 Звук</h2><button class="btn btn-ghost btn-block" onclick="toggleSound()">'+(soundEnabled?'Выключить':'Включить')+'</button></div></div>';document.getElementById('app').innerHTML=html}

function renderStats(){placeholderPage('📊','Статистика','Общая')}
function renderMatrix(){var m={q1:[],q2:[],q3:[],q4:[]};state.tasks.forEach(function(t){if(t.status==='completed')return;m.q2.push(t)});var html='<div class="page"><div class="title-xl">Матрица Эйзенхауэра</div><div class="matrix-grid-2x2"><div class="matrix-quadrant matrix-q1"><div class="matrix-q-title">🔥 Q1</div><div class="matrix-q-count">0</div></div><div class="matrix-quadrant matrix-q2"><div class="matrix-q-title">📌 Q2</div><div class="matrix-q-count" style="color:var(--brand);">'+m.q2.length+'</div></div><div class="matrix-quadrant matrix-q3"><div class="matrix-q-title">⚡ Q3</div><div class="matrix-q-count">0</div></div><div class="matrix-quadrant matrix-q4"><div class="matrix-q-title">🗑 Q4</div><div class="matrix-q-count">0</div></div></div></div>';document.getElementById('app').innerHTML=html}

function renderDomains(){var html='<div class="page"><div class="title-xl">9 Доменов</div>';DOMAINS.forEach(function(d){html+='<div class="domain-card"><div class="domain-header"><div class="domain-icon" style="background:'+d.color+'20;color:'+d.color+';">'+d.emoji+'</div><div style="flex:1;"><div class="domain-title">'+d.name+'</div><div class="domain-score">'+d.desc+'</div></div></div></div>'});html+='</div>';document.getElementById('app').innerHTML=html}

function renderMetrics(){var html='<div class="page"><div class="title-xl">Метрики</div>';DOMAINS.forEach(function(d){html+='<div class="metric-card"><div class="metric-card-title">'+d.emoji+' '+d.name+'</div>';d.metrics.forEach(function(m){html+='<div class="metric-input-row"><label>'+m.label+'</label><input type="text" id="m_'+m.id+'" placeholder="'+m.target+'"/></div>'});html+='</div>'});html+='<button class="btn btn-primary btn-block" onclick="saveMetrics()">Сохранить</button></div>';document.getElementById('app').innerHTML=html}

function saveMetrics(){var t=today();if(!state.metrics)state.metrics={};if(!state.metrics[t])state.metrics[t]={};DOMAINS.forEach(function(d){d.metrics.forEach(function(m){var el=document.getElementById('m_'+m.id);if(el&&el.value)state.metrics[t][m.id]=el.value})});save();toast('Сохранено','success');playSound('success')}

function renderPersonalPlan(){var plan=state.profile.personalPlan;if(!plan)return placeholderPage('🎯','План','Пройди опрос');var html='<div class="page"><div class="title-xl">План</div>';plan.days.forEach(function(b){html+='<div class="card"><h2>'+b.title+'</h2>';b.items.forEach(function(i){html+='<div class="plan-day"><div class="plan-time">'+i.time+'</div><div class="plan-title">'+i.title+'</div><div class="plan-desc">'+i.desc+'</div></div>'});html+='</div>'});html+='</div>';document.getElementById('app').innerHTML=html}

function placeholderPage(emoji,name,desc){document.getElementById('app').innerHTML='<div class="page"><div class="title-xl">'+name+'</div><div class="card"><div class="empty"><div class="empty-icon">'+emoji+'</div><div class="empty-title">'+name+'</div><div class="empty-text">'+desc+'</div></div></div></div>'}

/* SURVEY */
function startSurvey(){state.profile.surveyStep=0;save();renderSurvey()}

function renderSurvey(){var step=state.profile.surveyStep||0;var q=SURVEY_QUESTIONS[step];if(!q){finishSurvey();return}var answers=state.profile.surveyAnswers||{};var html='<div class="welcome-screen" id="surveyScreen"><div class="survey-container"><div class="survey-progress">';for(var i=0;i<SURVEY_QUESTIONS.length;i++){var cls='survey-dot';if(i<step)cls+=' done';else if(i===step)cls+=' active';html+='<div class="'+cls+'"></div>'}html+='</div><div class="survey-question">'+q.question+'</div>';if(q.type==='text'){html+='<input type="text" id="surveyInput" class="welcome-input" style="max-width:100%;text-align:left;font-size:16px!important;" value="'+esc(answers[q.id]||'')+'"/><button class="btn btn-primary btn-block mt-3" onclick="saveSurveyAnswer()">Далее</button>'}else{q.options.forEach(function(opt){var sel=answers[q.id]===opt.value?' selected':'';html+='<div class="survey-option'+sel+'" onclick="selectSurveyOption(\''+q.id+'\',\''+opt.value+'\')"><span class="survey-option-emoji">'+opt.emoji+'</span><span class="survey-option-label">'+opt.label+'</span></div>'})}if(step>0)html+='<button class="btn btn-ghost btn-block mt-2" onclick="prevSurveyStep()">← Назад</button>';html+='</div></div>';var e=document.getElementById('surveyScreen');if(e)e.remove();document.body.insertAdjacentHTML('beforeend',html);setTimeout(function(){var i=document.getElementById('surveyInput');if(i)i.focus()},200)}

function selectSurveyOption(qid,val){if(!state.profile.surveyAnswers)state.profile.surveyAnswers={};state.profile.surveyAnswers[qid]=val;save();playSound('click');nextSurveyStep()}
function saveSurveyAnswer(){var inp=document.getElementById('surveyInput');var val=inp?inp.value.trim():'';if(!val)return toast('Заполни','error');var q=SURVEY_QUESTIONS[state.profile.surveyStep];if(!state.profile.surveyAnswers)state.profile.surveyAnswers={};state.profile.surveyAnswers[q.id]=val;if(q.id==='name')state.profile.name=val;save();nextSurveyStep()}
function nextSurveyStep(){state.profile.surveyStep=(state.profile.surveyStep||0)+1;save();if(state.profile.surveyStep>=SURVEY_QUESTIONS.length)finishSurvey();else renderSurvey()}
function prevSurveyStep(){state.profile.surveyStep=Math.max(0,(state.profile.surveyStep||0)-1);save();renderSurvey()}

function finishSurvey(){var e=document.getElementById('surveyScreen');if(e)e.remove();state.profile.surveyDone=true;state.profile.personalPlan=generatePlan(state.profile.surveyAnswers);save();playSound('levelup');haptic('success');toast('🎉 План готов!','success',4000);checkAchievements();updateHeaderAvatar();navigate('plan')}

function generatePlan(answers){if(!answers)answers={};var plan={days:[]};var morning=[{time:'7:30',title:'Пробуждение',desc:'Вода + свет'},{time:'+15 мин',title:'Дыхание 4-7-8',desc:'4 цикла'},{time:'+30 мин',title:'Движение',desc:'Прогулка 15 мин'},{time:'+1.5 ч',title:'Deep Work',desc:'90 минут'}];var day=[{time:'12:00',title:'Обед',desc:'Белок + овощи'},{time:'14:00',title:'Медитация',desc:'10 минут'}];var evening=[{time:'20:00',title:'Рефлексия',desc:'Дневник'},{time:'22:30',title:'Сон',desc:'18-20°C'}];plan.days=[{title:'🌅 Утро',items:morning},{title:'☀️ День',items:day},{title:'🌙 Вечер',items:evening}];return plan}

/* INIT */
function showWelcome(){var overlay=document.createElement('div');overlay.className='welcome-screen';overlay.innerHTML='<div class="welcome-logo">🧠</div><div class="welcome-title">AI Health v26</div><div class="welcome-sub">5 уровней · 9 доменов · Английский · 40+ методик · Хранилище · AI-коуч, психолог, врач</div><button class="btn btn-primary btn-block" style="max-width:340px;" onclick="startOnboarding()">Начать</button>';document.body.appendChild(overlay)}

function startOnboarding(){var w=document.querySelector('.welcome-screen');if(w)w.remove();var name=window.__tgName||'';if(!name){var overlay=document.createElement('div');overlay.className='welcome-screen';overlay.innerHTML='<div class="welcome-logo">👤</div><div class="welcome-title">Как тебя зовут?</div><input type="text" class="welcome-input" id="welcome-name" placeholder="Имя" maxlength="30"/><button class="btn btn-primary btn-block mt-4" style="max-width:340px;margin-top:16px;" onclick="finishOnboarding()">Далее</button>';document.body.appendChild(overlay);setTimeout(function(){var i=document.getElementById('welcome-name');if(i)i.focus()},300)}else{state.profile.name=name;state.settings.onboardingDone=true;save();updateHeaderAvatar();renderTabBar();renderDashboard();toast('Добро пожаловать!','success')}}

function finishOnboarding(){var inp=document.getElementById('welcome-name');var name=inp?inp.value.trim():'';if(!name)return toast('Введи имя','error');state.profile.name=name;state.settings.onboardingDone=true;save();var w=document.querySelector('.welcome-screen');if(w)w.remove();updateHeaderAvatar();renderTabBar();renderDashboard();playSound('levelup');toast('Добро пожаловать, '+name+'!','success')}

async function init(){try{await initDB();var dbData=await dbLoad();if(dbData&&!state.profile.name&&!state.settings.onboardingDone){state=Object.assign(defaultState(),dbData);save()}applyTheme(state.settings.theme);updateHeaderAvatar();soundEnabled=state.settings.soundEnabled!==false;var sb=document.getElementById('soundBtn');if(sb)sb.textContent=soundEnabled?'🔊':'🔇';if(!state.profile.name&&!state.settings.onboardingDone){showWelcome();return}if(state.profile.name&&!state.settings.onboardingDone){state.settings.onboardingDone=true;save()}if(!state.profile.name&&window.__tgName){state.profile.name=window.__tgName;save();updateHeaderAvatar()}if(state.tasks.length===0){state.tasks=[{id:uid(),title:'Первый урок: Дофамин',planned_time:10,actual_time:0,status:'pending',priority:'high',created_at:nowISO()},{id:uid(),title:'Английский: 5 слов',planned_time:10,actual_time:0,status:'pending',priority:'medium',created_at:nowISO()},{id:uid(),title:'Прогулка 20 минут',planned_time:20,actual_time:0,status:'pending',priority:'medium',created_at:nowISO()}];save()}renderTabBar();renderDashboard();var t=today();if(state.stats.lastActiveDay!==t){var y=new Date();y.setDate(y.getDate()-1);state.stats.streak=state.stats.lastActiveDay===y.toISOString().slice(0,10)?(state.stats.streak||0)+1:1;state.stats.lastActiveDay=t;save()}checkAchievements()}catch(e){console.error('Init:',e);var app=document.getElementById('app');if(app)app.innerHTML='<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-title">Ошибка</div><div class="empty-text">'+esc(e.message)+'</div></div>'}}

function attachRipple(){document.addEventListener('pointerdown',function(e){var target=e.target.closest('.btn,.list-row,.chip,.tab-item,.task-item,.card,.icon-btn,.avatar-btn,.persona-item,.segmented-item,.level-card,.module-card,.lesson-row,.emoji-pick,.domain-card,.word-card,.rec-item,.course-card,.survey-option');if(!target)return;target.classList.add('tap-ripple');var rect=target.getBoundingClientRect();target.style.setProperty('--rx',((e.clientX-rect.left)/rect.width)*100+'%');target.style.setProperty('--ry',((e.clientY-rect.top)/rect.height)*100+'%');target.classList.remove('rippling');void target.offsetWidth;target.classList.add('rippling');setTimeout(function(){target.classList.remove('rippling')},700)},{passive:true})}

window.navigate=navigate;window.openSheet=openSheet;window.closeSheet=closeSheet;window.openThemePicker=openThemePicker;window.setTheme=setTheme;window.openLevel=openLevel;window.openModule=openModule;window.openLesson=openLesson;window.completeLesson=completeLesson;window.openEngLevel=openEngLevel;window.openEngModule=openEngModule;window.speakWord=speakWord;window.markWord=markWord;window.addTask=addTask;window.saveTask=saveTask;window.toggleTask=toggleTask;window.editTask=editTask;window.updateTask=updateTask;window.deleteTask=deleteTask;window.switchPersona=switchPersona;window.sendMsg=sendMsg;window.openAISettings=openAISettings;window.saveAISettings=saveAISettings;window.openPersona=openPersona;window.pickEmoji=pickEmoji;window.setEmoji=setEmoji;window.saveProfileName=saveProfileName;window.finishOnboarding=finishOnboarding;window.startOnboarding=startOnboarding;window.startSurvey=startSurvey;window.saveSurveyAnswer=saveSurveyAnswer;window.selectSurveyOption=selectSurveyOption;window.nextSurveyStep=nextSurveyStep;window.prevSurveyStep=prevSurveyStep;window.finishSurvey=finishSurvey;window.exportDB=exportDB;window.importDB=importDB;window.showStorageStats=showStorageStats;window.saveMetrics=saveMetrics;window.saveGemini=saveGemini;window.logRestActivity=logRestActivity;window.toggleSound=toggleSound;

if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',function(){init();attachRipple()})}else{init();attachRipple()}
