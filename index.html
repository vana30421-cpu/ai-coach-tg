}

/* ═══════ SVG ICONS ═══════ */
.icon { width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }

}

.segmented-item {

/* ═══════ PERSONA ═══════ */
.persona-bar {

}
.persona-item.active { color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
.persona-item.active[data-p="coach"] { background: var(--coach); color: #000; }
.persona-item.active[data-p="psych"] { background: var(--psych); color: #000; }
.persona-item.active[data-p="doctor"] { background: var(--doctor); color: #000; }
.persona-item.active[data-p="nutrition"] { background: var(--nutrition); color: #000; }
.persona-item.active[data-p="fitness"] { background: var(--fitness); }
.persona-item.active[data-p="lawyer"] { background: var(--lawyer); color: #000; }
.persona-item.active[data-p="finance"] { background: var(--finance); color: #000; }

/* ═══════ CHAT ═══════ */
.chat { display: flex; flex-direction: column; gap: 12px; padding: 8px 0; }
.msg {

  border-radius: 22px; font-size: 16px; line-height: 1.5;

@keyframes msgIn {

}
.msg-user {

}
.msg-bot {

}

.msg-bot p { margin: 0 0 8px 0; }
.msg-bot p:last-child { margin-bottom: 0; }
.msg-bot ul { margin: 6px 0; padding-left: 20px; }

.typing {

}

/* ═══════ STATS ═══════ */
.stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }

}
.switch.on { background: var(--brand); }
.switch.on::after { transform: translateX(20px); }

/* ═══════ LIST ROW ═══════ */
.list-row {

}
.list-row:active { background: var(--surface-2); transform: scale(0.99); }
.list-icon {
  width: 44px; height: 44px; border-radius: 14px;

}
.list-body { flex: 1; min-width: 0; }
.list-title {
  font-size: 16px; font-weight: 600; color: var(--text);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function nowISO() { return new Date().toISOString(); }
function today() { return new Date().toISOString().slice(0, 10); }
function fmtDate(d) { try { return new Date(d).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' }); } catch(e) { return '—'; } }
function fmtTime(d) { try { return new Date(d).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }); } catch(e) { return '—'; } }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c])); }

function toast(msg, type = 'info', duration = 2500) {
  const c = document.getElementById('toasts');
  if (!c) return;
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  c.appendChild(el);
  setTimeout(() => {
    el.style.opacity = '0';
    el.style.transform = 'translate(-50%, -12px)';
    el.style.transition = 'all 0.3s';
    setTimeout(() => el.remove(), 300);
  }, duration);
}
function haptic(type = 'light') {
  if (window.Telegram?.WebApp?.HapticFeedback) {
    try {
      const h = window.Telegram.WebApp.HapticFeedback;
      if (type === 'success') h.notificationOccurred('success');
      else if (type === 'error') h.notificationOccurred('error');
      else if (type === 'warning') h.notificationOccurred('warning');
      else h.impactOccurred(type);
    } catch(e) {}
  }
}

const TABS = [

  { id: 'tasks', icon: 'tasks', label: 'Задачи' },
  { id: 'ai', icon: 'sparkle', label: 'AI' },
  { id: 'health', icon: 'heart', label: 'Здоровье' },
  { id: 'more', icon: 'more', label: 'Ещё' }
];
let currentPage = 'dashboard';

function renderTabBar() {
  const bar = document.getElementById('tabBar');
  if (!bar) return;
  bar.innerHTML = TABS.map(t => `
    <button class="tab-item ${t.id === currentPage ? 'active' : ''}" onclick="navigate('${t.id}')">
      ${icon(t.icon, 24)}
      <span>${t.label}</span>
    </button>
  `).join('');
}

function navigate(page) {
  if (!page || currentPage === page) return;
  currentPage = page;
  renderTabBar();
  const main = document.getElementById('app');
  main.innerHTML = '';
  const renderers = {
    dashboard: renderDashboard, tasks: renderTasks, ai: renderAI,
    health: renderHealth, more: renderMore, calendar: renderCalendar,
    stats: renderStats, habits: renderHabits, goals: renderGoals,
    timer: renderTimer, notes: renderNotes, learning: renderLearning,
    matrix: renderMatrix, focus: renderFocus, mood: renderMood,
    water: renderWater, meds: renderMeds, workouts: renderWorkouts,
    meditation: renderMeditation, journal: renderJournal, media: renderMedia,
    finance: renderFinance, history: renderHistory, dbmanager: renderDBManager,
    settings: renderSettings, gcal: renderGoogleCalendar
  };
  const fn = renderers[page];
  if (fn) {
    try { fn(); }
    catch (e) { console.error('Render error:', page, e); toast('Ошибка: ' + e.message, 'error'); }
  }
  window.scrollTo({ top: 0, behavior: 'auto' });
}

function openSheet(title, content) {
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `<div class="modal"><div class="modal-header"><div class="modal-title">${esc(title)}</div><button class="modal-close" onclick="closeSheet()">${icon('close', 18)}</button></div>${content}</div>`;
  overlay.onclick = (e) => { if (e.target === overlay) closeSheet(); };
  document.body.appendChild(overlay);
  document.body.style.overflow = 'hidden';
}
function closeSheet() {
  document.querySelectorAll('.overlay').forEach(o => o.remove());
  document.body.style.overflow = '';
}

  try {
    googleTokenClient = google.accounts.oauth2.initTokenClient({
      client_id: clientId,
      scope: GOOGLE_SCOPES,
      callback: async (response) => {
        if (response.access_token) {
          state.settings.googleAccessToken = response.access_token;
          state.settings.googleSyncEnabled = true;
          save();
          toast('Google Calendar подключён', 'success');
          haptic('success');
          await syncFromGoogle();
          if (currentPage === 'gcal') renderGoogleCalendar();
          if (currentPage === 'calendar') renderCalendar();
        } else {
          toast('Ошибка авторизации Google', 'error');
        }
      }
    });
    return true;
  } catch(e) {
    console.error('Google auth init error:', e);
    return false;
  }
}

function connectGoogle() {

function disconnectGoogle() {

async function gcalRequest(path, options = {}) {
  const token = state.settings.googleAccessToken;
  if (!token) throw new Error('Нет доступа к Google');
  const url = `https://www.googleapis.com/calendar/v3${path}`;
  const resp = await fetch(url, {
    ...options,
    headers: {
      'Authorization': `Bearer ${token}`,
      'Content-Type': 'application/json',
      ...(options.headers || {})
    }
  });
  if (resp.status === 401) {
    state.settings.googleAccessToken = null;
    state.settings.googleSyncEnabled = false;
    save();
    throw new Error('Токен истёк. Подключи Google заново.');
  }
  if (!resp.ok) {
    const err = await resp.text();
    throw new Error(`Google API ${resp.status}`);
  }
  return resp.status === 204 ? null : resp.json();
}

async function syncFromGoogle() {
  if (!state.settings.googleAccessToken) return toast('Сначала подключи Google', 'warning');
  toast('Синхронизация...', 'info');
  try {
    const calId = state.settings.googleCalendarId || 'primary';
    const timeMin = new Date(Date.now() - 30 * 24 * 60 * 60 * 1000).toISOString();
    const timeMax = new Date(Date.now() + 90 * 24 * 60 * 60 * 1000).toISOString();
    const resp = await gcalRequest(`/calendars/${encodeURIComponent(calId)}/events?timeMin=${timeMin}&timeMax=${timeMax}&singleEvents=true&orderBy=startTime&maxResults=250`);
    const events = resp.items || [];
    let imported = 0, updated = 0;
    for (const ev of events) {
      if (!ev.start?.dateTime && !ev.start?.date) continue;
      const existing = state.schedule.find(s => s.googleEventId === ev.id);
      const data = {
        googleEventId: ev.id,
        title: ev.summary || 'Без названия',
        description: ev.description || '',
        start_time: ev.start.dateTime || ev.start.date + 'T00:00:00',
        end_time: ev.end.dateTime || (ev.end.date || ev.start.date) + 'T23:59:59',
        location: ev.location || '',
        googleUpdatedAt: ev.updated,
        source: 'google'
      };
      if (existing) {
        if (existing.googleUpdatedAt !== ev.updated) {
          Object.assign(existing, data);
          updated++;
        }
      } else {
        state.schedule.push({ id: uid(), ...data, created_at: nowISO() });
        imported++;
      }
    }
    state.settings.lastGoogleSync = nowISO();
    save();
    toast(`Google: +${imported} новых, ~${updated} обновлено`, 'success');
    haptic('success');
    if (currentPage === 'gcal') renderGoogleCalendar();
    if (currentPage === 'calendar') renderCalendar();
  } catch(e) {
    console.error(e);
    toast('Ошибка: ' + e.message, 'error');
  }
}

async function syncToGoogle() {
  if (!state.settings.googleAccessToken) return toast('Сначала подключи Google', 'warning');
  toast('Экспорт...', 'info');
  try {
    const calId = state.settings.googleCalendarId || 'primary';
    let exported = 0;
    for (const ev of state.schedule) {
      if (ev.googleEventId) continue;
      const event = {
        summary: ev.title,
        description: ev.description || '',
        start: { dateTime: ev.start_time, timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone },
        end: { dateTime: ev.end_time, timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone }
      };
      const created = await gcalRequest(`/calendars/${encodeURIComponent(calId)}/events`, {
        method: 'POST',
        body: JSON.stringify(event)
      });
      ev.googleEventId = created.id;
      ev.source = 'app';
      exported++;
    }
    state.settings.lastGoogleSync = nowISO();
    save();
    toast(`Экспортировано: ${exported}`, 'success');
    haptic('success');
    if (currentPage === 'gcal') renderGoogleCalendar();
  } catch(e) {
    console.error(e);
    toast('Ошибка: ' + e.message, 'error');
  }
}

async function fullSync() {
  await syncFromGoogle();
  await syncToGoogle();
  toast('Двусторонняя синхронизация завершена', 'success');
}

  toast('Удалено', 'info');

}

async function sendMsg() {
  const input = document.getElementById('chatInput');
  const text = input?.value.trim();
  if (!text) return;
  input.value = '';
  input.disabled = true;

  const persona = state.settings.activePersona || 'coach';
  state.chats.push({ id: uid(), persona, role: 'user', text, timestamp: nowISO() });
  save();
  renderAI();

  const box = document.getElementById('chatBox');
  const typing = document.createElement('div');
  typing.className = 'typing';
  typing.innerHTML = '<span></span><span></span><span></span>';
  box.appendChild(typing);
  box.scrollTop = box.scrollHeight;

  let reply;
  if (state.settings.apiKey) reply = await callAI(persona, text);
  else reply = fallbackReply(persona, text);

  typing.remove();
  state.chats.push({ id: uid(), persona, role: 'coach', text: reply, timestamp: nowISO() });
  save();
  renderAI();
  haptic('light');
  const ni = document.getElementById('chatInput');
  if (ni) { ni.disabled = false; ni.focus(); }
}

async function callAI(persona, userText) {
  const { provider, apiKey } = state.settings;
  const p = PERSONAS[persona];
  const history = state.chats.filter(c => c.persona === persona).slice(-10);
  const messages = [
    { role: 'system', content: p.prompt },
    ...history.map(m => ({ role: m.role === 'user' ? 'user' : 'assistant', content: m.text }))
  ];

  try {
    if (provider === 'openai') {
      const resp = await fetch('https://api.openai.com/v1/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
        body: JSON.stringify({ model: 'gpt-4o-mini', messages, temperature: 0.8, max_tokens: 800 })
      });
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const data = await resp.json();
      return data.choices?.[0]?.message?.content || fallbackReply(persona, userText);
    } else if (provider === 'anthropic') {
      const sys = messages.find(m => m.role === 'system')?.content || '';
      const rest = messages.filter(m => m.role !== 'system');
      const resp = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify({ model: 'claude-3-5-sonnet-20241022', system: sys, messages: rest, max_tokens: 800 })
      });
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const data = await resp.json();
      return data.content?.[0]?.text || fallbackReply(persona, userText);
    } else if (provider === 'gemini') {
      const sys = messages.find(m => m.role === 'system')?.content || '';
      const rest = messages.filter(m => m.role !== 'system');
      const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          system_instruction: { parts: [{ text: sys }] },
          contents: rest.map(m => ({ role: m.role === 'assistant' ? 'model' : 'user', parts: [{ text: m.content }] })),
          generationConfig: { temperature: 0.8, maxOutputTokens: 800 }
        })
      });
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const data = await resp.json();
      return data.candidates?.[0]?.content?.parts?.[0]?.text || fallbackReply(persona, userText);
    }
  } catch (e) {
    console.error('AI error:', e);
    toast(`AI: ${e.message}`, 'error');
    return fallbackReply(persona, userText);
  }
  return fallbackReply(persona, userText);
}

function fallbackReply(persona, text = '') {
  if (/суицид|покончить|не хочу жить|умереть/i.test(text)) {
    return '🆘 Важно. Позвони прямо сейчас:\n• 8-800-2000-122 (РФ, 24/7)\n• 103 / 112\n• https://findahelpline.com\n\nТы важен. Ты не один. 💙';
  }
  if (persona === 'doctor') return 'Я — AI-консультант. Опиши симптомы (что, как давно, что предшествовало).\n\n*⚠️ Не заменяет врача. При острых симптомах — 103/112.*';
  if (persona === 'psych') return 'Слышу тебя. Что происходит? Что ты уже пробовал?';
  if (persona === 'nutrition') return 'Расскажи о питании и целях. Что хочешь изменить?';
  if (persona === 'fitness') return 'Расскажи об уровне подготовки и целях.';
  if (persona === 'lawyer') return 'Опиши ситуацию подробнее.\n\n*Не заменяет юриста.*';
  if (persona === 'finance') return 'Расскажи о финансовой цели. Что беспокоит?';
  return 'Слышу тебя. Расскажи подробнее — что происходит?';
}

function renderMd(text) {
  if (!text) return '';
  let h = esc(text);
  h = h.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  h = h.replace(/(^|\s)\*([^*\n]+)\*(?=\s|$|[.,!?])/g, '$1<em>$2</em>');
  h = h.replace(/`([^`]+)`/g, '<code>$1</code>');
  h = h.replace(/^[•\-] (.+)$/gm, '<li>$1</li>');
  h = h.replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g, '<ul>$1</ul>');
  h = h.replace(/\n\n/g, '</p><p>');
  h = h.replace(/\n/g, '<br>');
  return `<p>${h}</p>`;
}

/* ─────── CALENDAR ─────── */
let calOffset = 0;

function renderCalendar() {
  const now = new Date();
  const month = new Date(now.getFullYear(), now.getMonth() + calOffset, 1);
  const year = month.getFullYear(), m = month.getMonth();
  const firstDay = (new Date(year, m, 1).getDay() + 6) % 7;
  const daysInMonth = new Date(year, m + 1, 0).getDate();
  const monthNames = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  const weekdays = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
  const todayStr = today();

  const events = state.schedule.filter(b => {
    const d = new Date(b.start_time);
    return d.getMonth() === m && d.getFullYear() === year;
  });

  let grid = weekdays.map(w => `<div style="text-align:center;font-size:11px;font-weight:700;color:var(--text-3);padding:8px 0;text-transform:uppercase;">${w}</div>`).join('');
  for (let i = 0; i < firstDay; i++) grid += '<div></div>';
  for (let day = 1; day <= daysInMonth; day++) {
    const ds = `${year}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const dayEvents = events.filter(b => new Date(b.start_time).toISOString().slice(0, 10) === ds);
    const isToday = ds === todayStr;
    grid += `
      <button style="aspect-ratio:1;border-radius:14px;border:none;background:${isToday ? 'var(--brand)' : 'transparent'};color:${isToday ? '#fff' : 'var(--text)'};font-family:inherit;font-size:14px;font-weight:${isToday ? '800' : '600'};cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px;" onclick="showDayDetails('${ds}')">
        <span>${day}</span>
        ${dayEvents.length ? `<span style="display:flex;gap:1px;">${dayEvents.slice(0,3).map(() => `<span style="width:3px;height:3px;border-radius:50%;background:${isToday ? '#fff' : 'var(--brand)'};"></span>`).join('')}</span>` : ''}
      </button>
    `;
  }

  const gcalConnected = state.settings.googleSyncEnabled && state.settings.googleAccessToken;
  document.getElementById('app').innerHTML = `
    <div class="page">
      <div class="row-between" style="margin-bottom:20px;">
        <div class="title-xl" style="margin:0;">Календарь</div>
        <button class="icon-btn" onclick="navigate('gcal')" style="${gcalConnected ? 'background:var(--success);color:#000;' : ''}">
          ${icon('google', 20)}
        </button>
      </div>

      ${gcalConnected ? `
        <div class="card" style="padding:12px 16px;background:rgba(52,211,153,0.1);border:1px solid var(--success);margin-bottom:16px;">
          <div class="row" style="gap:10px;">
            ${icon('google', 20)}
            <div style="flex:1;font-size:13px;font-weight:600;">Синхронизация с Google активна</div>
            <button class="btn btn-xs btn-ghost" onclick="fullSync()">Синхр.</button>
          </div>
        </div>
      ` : ''}

      <div class="card">
        <div class="row-between" style="margin-bottom:16px;">
          <button class="icon-btn" onclick="calOffset--;renderCalendar()">${icon('chevL', 18)}</button>
          <div class="title-m" style="margin:0;">${monthNames[m]} ${year}</div>
          <button class="icon-btn" onclick="calOffset++;renderCalendar()">${icon('chevR', 18)}</button>
        </div>
        <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;">${grid}</div>
      </div>

      <div class="card">
        <h2>${icon('plus', 20)} Новое событие</h2>
        <div class="field"><input type="text" id="ev-title" placeholder="Название"/></div>
        <div class="field"><input type="datetime-local" id="ev-start"/></div>
        <div class="field"><input type="datetime-local" id="ev-end"/></div>
        <button class="btn btn-primary btn-block" onclick="addEvent()">Создать${gcalConnected ? ' и синхронизировать' : ''}</button>
      </div>

      <div class="card">
        <h2>${icon('calendar', 20)} Предстоящие</h2>
        ${state.schedule.filter(b => new Date(b.start_time) >= new Date()).sort((a,b) => new Date(a.start_time) - new Date(b.start_time)).slice(0, 8).map(b => `
          <div class="list-row" onclick="editEvent('${b.id}')">
            <div style="width:4px;height:40px;border-radius:2px;background:${b.source === 'google' ? 'var(--success)' : 'var(--brand)'};flex-shrink:0;"></div>
            <div class="list-body">
              <div class="list-title">${esc(b.title)}</div>
              <div class="list-subtitle">${fmtDate(b.start_time)} · ${fmtTime(b.start_time)}–${fmtTime(b.end_time)}${b.source === 'google' ? ' · Google' : ''}</div>
            </div>
            <div class="list-chevron">${icon('chevR', 18)}</div>
          </div>
        `).join('') || '<div class="footnote text-tertiary">Нет событий</div>'}
      </div>
    </div>
  `;
}

async function addEvent() {
  const title = document.getElementById('ev-title').value.trim();
  const start = document.getElementById('ev-start').value;
  const end = document.getElementById('ev-end').value;
  if (!title || !start || !end) return toast('Заполните поля', 'error');
  if (new Date(start) >= new Date(end)) return toast('Неверный интервал', 'error');

  const ev = {
    id: uid(), title,
    start_time: new Date(start).toISOString(),
    end_time: new Date(end).toISOString(),
    source: 'app', created_at: nowISO()
  };
  state.schedule.push(ev);
  save();

  if (state.settings.googleSyncEnabled && state.settings.googleAccessToken) {
    try {
      const calId = state.settings.googleCalendarId || 'primary';
      const created = await gcalRequest(`/calendars/${encodeURIComponent(calId)}/events`, {
        method: 'POST',
        body: JSON.stringify({
          summary: title,
          start: { dateTime: ev.start_time, timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone },
          end: { dateTime: ev.end_time, timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone }
        })
      });
      ev.googleEventId = created.id;
      save();
      toast('Создано и синхронизировано', 'success');
    } catch(e) {
      toast('Создано локально', 'warning');
    }
  } else {
    toast('Событие создано', 'success');
  }
  haptic('success');
  renderCalendar();
}

async function saveEvent(id) {
  const b = state.schedule.find(x => x.id === id);
  if (!b) return;
  b.title = document.getElementById('ee-title').value.trim() || b.title;
  b.start_time = new Date(document.getElementById('ee-start').value).toISOString();
  b.end_time = new Date(document.getElementById('ee-end').value).toISOString();
  save();

  if (b.googleEventId && state.settings.googleAccessToken) {
    try {
      const calId = state.settings.googleCalendarId || 'primary';
      await gcalRequest(`/calendars/${encodeURIComponent(calId)}/events/${b.googleEventId}`, {
        method: 'PATCH',
        body: JSON.stringify({
          summary: b.title,
          start: { dateTime: b.start_time },
          end: { dateTime: b.end_time }
        })
      });
      toast('Обновлено и синхронизировано', 'success');
    } catch(e) { toast('Обновлено локально', 'warning'); }
  } else {
    toast('Сохранено', 'success');
  }
  closeSheet();
  renderCalendar();
}

async function deleteEvent(id) {
  const b = state.schedule.find(x => x.id === id);
  if (!b) return;
  if (!confirm('Удалить?')) return;

  if (b.googleEventId && state.settings.googleAccessToken) {
    try {
      const calId = state.settings.googleCalendarId || 'primary';
      await gcalRequest(`/calendars/${encodeURIComponent(calId)}/events/${b.googleEventId}`, { method: 'DELETE' });

  state.schedule = state.schedule.filter(x => x.id !== id);

}

/* ─────── HABITS ─────── */
function calcStreak(history) {
  if (!history?.length) return 0;
  let s = 0; const d = new Date();
  while (s < 365) {
    const ds = d.toISOString().slice(0, 10);
    if (history.includes(ds)) { s++; d.setDate(d.getDate() - 1); } else break;
  }
  return s;
}

function renderHabits() {
  document.getElementById('app').innerHTML = `
    <div class="page">
      <div class="title-xl">Привычки</div>
      ${state.habits.length ? `
        <div class="card">
          ${state.habits.map(h => {
            const done = h.history?.includes(today());
            const streak = calcStreak(h.history || []);
            return `
              <div class="list-row">
                <button class="task-checkbox ${done ? 'checked' : ''}" onclick="event.stopPropagation();toggleHabit('${h.id}')">
                  ${done ? icon('check', 14) : ''}
                </button>
                <div class="list-body">
                  <div class="list-title">${esc(h.title)}</div>
                  <div class="list-subtitle">${streak > 0 ? '🔥 ' + streak + ' дней' : 'Начни серию'}</div>
                </div>
                <button class="btn btn-icon btn-sm btn-ghost" onclick="event.stopPropagation();deleteHabit('${h.id}')">${icon('trash', 16)}</button>
              </div>
            `;
          }).join('')}
        </div>
      ` : `<div class="empty"><div class="empty-icon">${icon('refresh', 56)}</div><div class="empty-title">Нет привычек</div><div class="empty-text">Начни с одной</div></div>`}
      <div class="card">
        <h2>Новая привычка</h2>
        <div class="field"><input type="text" id="h-title" placeholder="Например: Чтение 30 мин"/></div>
        <button class="btn btn-primary btn-block" onclick="addHabit()">Добавить</button>
      </div>
    </div>
  `;
}

function addHabit() {
  const title = document.getElementById('h-title').value.trim();

  state.habits.push({ id: uid(), title, history: [], created_at: nowISO() });

function toggleHabit(id) {
  const h = state.habits.find(x => x.id === id);
  if (!h) return;
  if (!h.history) h.history = [];
  const t = today();
  if (h.history.includes(t)) {
    h.history = h.history.filter(d => d !== t);
    toast('Отменено', 'info');
  } else {
    h.history.push(t);
    toast(`Серия ${calcStreak(h.history)} 🔥`, 'success');
    haptic('success');
  }
  save();
  renderHabits();
}

/* ─────── TIMER ─────── */
let timerTick = null;

function computeElapsed(s) {
  if (!s) return 0;
  return Math.floor((Date.now() - new Date(s.start_time).getTime() - (s.paused_time || 0)) / 1000);
}

function renderTimer() {
  const active = state.timer.find(s => s.status === 'active' || s.status === 'paused');
  let html = '';
  if (active) {
    const elapsed = computeElapsed(active);
    const mins = Math.floor(elapsed / 60), secs = elapsed % 60;
    html = `
      <div style="text-align:center;padding:32px 16px;">
        <div class="subhead text-secondary mb-2">${esc(active.title)}</div>
        <div style="font-size:72px;font-weight:800;letter-spacing:-3px;font-variant-numeric:tabular-nums;background:linear-gradient(135deg,var(--brand),var(--brand-2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;margin:20px 0;">${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}</div>
        <div class="btn-row" style="justify-content:center;">
          ${active.status === 'active'
            ? `<button class="btn btn-warning" onclick="pauseTimer()">⏸ Пауза</button>`
            : `<button class="btn btn-success" onclick="resumeTimer()">▶ Продолжить</button>`}
          <button class="btn btn-danger" onclick="stopTimer()">⏹ Завершить</button>
        </div>
      </div>
    `;
  } else {
    html = `
      <div class="field"><input type="text" id="tm-title" placeholder="Что делаем?"/></div>
      <button class="btn btn-success btn-block" onclick="startTimer()">▶ Запустить</button>
    `;
  }
  const history = state.timer.filter(s => s.status === 'done').slice(-5).reverse();
  document.getElementById('app').innerHTML = `
    <div class="page">
      <div class="title-xl">Таймер</div>
      <div class="card">${html}</div>
      <div class="card">
        <h2>История</h2>
        ${history.length ? history.map(s => `
          <div class="list-row">
            <div class="list-body">
              <div class="list-title">${esc(s.title)}</div>
              <div class="list-subtitle">${Math.floor((s.total_time||0)/60)} мин · ${fmtDate(s.end_time)}</div>
            </div>
          </div>
        `).join('') : '<div class="footnote text-tertiary">Пока нет сессий</div>'}
      </div>
    </div>
  `;
  if (active?.status === 'active' && !timerTick) {
    timerTick = setInterval(() => { if (currentPage === 'timer') renderTimer(); }, 1000);
  } else if (!active && timerTick) {
    clearInterval(timerTick);
    timerTick = null;
  }
}

function startTimer() {
  const title = document.getElementById('tm-title').value.trim() || 'Фокус-сессия';
  state.timer.push({ id: uid(), title, start_time: nowISO(), paused_time: 0, status: 'active', created_at: nowISO() });
  save();
  toast('Запущено', 'success');
  haptic('success');
  renderTimer();
}

function pauseTimer() {
  const s = state.timer.find(x => x.status === 'active');
  if (!s) return;
  s.paused_time += Date.now() - new Date(s.start_time).getTime() - s.paused_time;
  s.status = 'paused';
  save();
  renderTimer();
}

function resumeTimer() {
  const s = state.timer.find(x => x.status === 'paused');
  if (!s) return;
  s.start_time = nowISO();
  s.status = 'active';
  save();
  renderTimer();
}

function stopTimer() {
  const s = state.timer.find(x => x.status === 'active' || x.status === 'paused');
  if (!s) return;
  s.total_time = computeElapsed(s);
  s.status = 'done';
  s.end_time = nowISO();
  save();
  toast(`Готово: ${Math.floor(s.total_time/60)} мин`, 'success');
  haptic('success');
  renderTimer();
}

        </div>
        <div class="list-row">
          <div class="list-icon" style="background:var(--brand);">${icon('database', 22)}</div>
          <div class="list-body"><div class="list-title">Всего записей</div></div>
          <div class="list-value">${total}</div>

      </div>
      <div class="card">

        ${tables.map(t => `

            <div class="list-value">${state[t]?.length || 0}</div>
          </div>
        `).join('')}
      </div>
      <div class="card">
        <h2>Операции</h2>
        <button class="btn btn-primary btn-block mb-2" onclick="exportDB()">${icon('download', 18)} Экспорт JSON</button>
        <button class="btn btn-ghost btn-block mb-2" onclick="document.getElementById('importDB').click()">${icon('upload', 18)} Импорт JSON</button>
        <input type="file" id="importDB" accept=".json" style="display:none" onchange="importDB(event)"/>
        <button class="btn btn-danger btn-block" onclick="if(confirm('Сбросить всё?')){localStorage.removeItem('${STORAGE_KEY}');location.reload();}">${icon('trash', 18)} Полный сброс</button>
      </div>
    </div>
  `;
}

function manageTable(table) {
  const items = state[table] || [];
  openSheet(`${table} (${items.length})`, `
    <div style="max-height:60vh;overflow-y:auto;">
      ${items.slice(0, 100).map(item => `
        <div style="padding:12px 0;border-bottom:0.5px solid var(--divider);">
          <div style="font-weight:600;margin-bottom:4px;">${esc(item.title || item.name || item.date || item.id?.slice(0, 12))}</div>
          <div class="caption text-tertiary" style="font-family:monospace;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(JSON.stringify(item).slice(0, 80))}</div>
        </div>
      `).join('')}
    </div>
  `);
}

function exportDB() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `ai-health-${today()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('Экспорт готов', 'success');
}

function importDB(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!confirm('Заменить все данные?')) return;
      state = { ...DEFAULT_STATE(), ...data };
      save();
      toast('Импорт успешен', 'success');
      location.reload();
    } catch (err) { toast('Ошибка: ' + err.message, 'error'); }
  };
  reader.readAsText(file);
}

function saveName(name) {
  state.settings.username = name || 'Пользователь';
  save();
  document.getElementById('userChip').textContent = state.settings.username;
  toast('Сохранено', 'success');
}

/* ══════════════════════════════════════════════════════════════════
   THEME
   ══════════════════════════════════════════════════════════════════ */
function applyTheme(theme) {
  document.body.classList.toggle('light', theme === 'light');
  const btn = document.getElementById('themeBtn');
  if (btn) btn.innerHTML = theme === 'light'
    ? '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>'
    : '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
  document.querySelector('meta[name="theme-color"]')?.setAttribute('content', theme === 'light' ? '#f4f4f8' : '#000000');
}

function toggleTheme() {
  state.settings.theme = state.settings.theme === 'light' ? 'dark' : 'light';
  applyTheme(state.settings.theme);
  save();
  haptic('light');
  if (currentPage === 'settings') renderSettings();
}

/* ══════════════════════════════════════════════════════════════════
   INIT
   ══════════════════════════════════════════════════════════════════ */
function init() {
  try {
    applyTheme(state.settings.theme);
    // Logo icon
    const logo = document.getElementById('logoIcon');
    if (logo) logo.innerHTML = SVG.brain;
    
    if (state.tasks.length === 0) {
      state.tasks = [
        { id: uid(), title: 'Завершить отчёт', category: 'Работа', planned_time: 45, actual_time: 0, status: 'pending', priority: 'high', created_at: nowISO() },
        { id: uid(), title: 'Повторить 10 слов', category: 'Обучение', planned_time: 15, actual_time: 0, status: 'pending', priority: 'medium', created_at: nowISO() },
        { id: uid(), title: 'Позвонить маме', category: 'Личное', planned_time: 10, actual_time: 0, status: 'pending', priority: 'high', created_at: nowISO() }
      ];
      save();
    }
    
    renderTabBar();
    renderDashboard();
    
    // Google auth init
    setTimeout(() => { initGoogleAuth(); }, 1000);
    
    // Streak
    const t = today();
    if (state.stats.lastActiveDay !== t) {
      const y = new Date();
      y.setDate(y.getDate() - 1);
      state.stats.streak = state.stats.lastActiveDay === y.toISOString().slice(0, 10)
        ? (state.stats.streak || 0) + 1
        : 1;
      state.stats.lastActiveDay = t;
      save();
    }
  } catch (e) {
    console.error('Init error:', e);
    document.getElementById('app').innerHTML = `<div class="empty"><div class="empty-icon">${icon('close', 56)}</div><div class="empty-title">Ошибка</div><div class="empty-text">${esc(e.message)}</div></div>`;
  }
}
