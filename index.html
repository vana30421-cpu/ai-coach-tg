*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter',system-ui,sans-serif;
  font-size:16px;line-height:1.45;color:var(--text);background:var(--bg);
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;overflow-x:hidden;
  min-height:100dvh;letter-spacing:-.015em;
  transition:background .4s var(--ease),color .4s var(--ease)
}
body::before{
  content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse 70% 60% at 20% 10%,var(--brand),transparent 65%),
    radial-gradient(ellipse 60% 60% at 80% 90%,var(--brand-2),transparent 65%);
  pointer-events:none;z-index:0;opacity:.16;
  animation:auroraShift 25s ease-in-out infinite alternate;
  filter:blur(40px);
}
@keyframes auroraShift{
  0%{transform:translate3d(0,0,0) scale(1)}
  100%{transform:translate3d(3%,-2%,0) scale(1.08)}
}
.theme-effect{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.effect-star{position:absolute;border-radius:50%;background:#fff;box-shadow:0 0 8px #fff;animation:twinkle 3s ease-in-out infinite}
.effect-star.small{width:2px;height:2px}
.effect-star.medium{width:3px;height:3px;box-shadow:0 0 12px #fff}
.effect-star.big{width:4px;height:4px;box-shadow:0 0 20px #fff,0 0 40px var(--brand)}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.7)}50%{opacity:1;transform:scale(1.4)}}
.effect-drop{position:absolute;top:-10%;width:2px;background:linear-gradient(180deg,transparent,var(--brand),transparent);animation:effectFall linear infinite;opacity:.55}
@keyframes effectFall{0%{transform:translate3d(0,0,0);opacity:0}10%{opacity:.6}90%{opacity:.6}100%{transform:translate3d(30px,110vh,0);opacity:0}}
.effect-petal{position:absolute;top:-10%;animation:petalFall linear infinite;opacity:.75}
@keyframes petalFall{0%{transform:translate3d(0,-10vh,0) rotate(0);opacity:0}10%{opacity:.85}100%{transform:translate3d(100px,110vh,0) rotate(720deg);opacity:0}}
.effect-leaf{position:absolute;top:-10%;animation:leafFall linear infinite;opacity:.7}
@keyframes leafFall{0%{transform:translate3d(0,-10vh,0) rotate(0);opacity:0}10%{opacity:.8}100%{transform:translate3d(-60px,110vh,0) rotate(-360deg);opacity:0}}
.effect-snowflake{position:absolute;top:-10%;color:#fff;text-shadow:0 0 8px #fff;animation:snowFall linear infinite;opacity:.7}
@keyframes snowFall{0%{transform:translate3d(0,-10vh,0) rotate(0);opacity:0}10%{opacity:.8}100%{transform:translate3d(80px,110vh,0) rotate(720deg);opacity:0}}
.effect-spark{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;box-shadow:0 0 12px var(--brand),0 0 24px var(--brand);animation:sparkFlash linear infinite}
@keyframes sparkFlash{0%,100%{opacity:0;transform:scale(.5)}50%{opacity:1;transform:scale(1.8)}}
.effect-dust{position:absolute;width:2px;height:2px;border-radius:50%;background:var(--brand);box-shadow:0 0 10px var(--brand);animation:dustFloat linear infinite;opacity:.7}
@keyframes dustFloat{0%{transform:translate3d(0,0,0);opacity:0}20%{opacity:.9}80%{opacity:.5}100%{transform:translate3d(40px,-80px,0);opacity:0}}
.effect-wave{position:absolute;left:-10%;right:-10%;height:150px;background:linear-gradient(180deg,transparent 0%,var(--brand) 60%,transparent 100%);opacity:.15;animation:waveMove 8s ease-in-out infinite;filter:blur(30px);border-radius:50%}
@keyframes waveMove{0%,100%{transform:translate3d(0,0,0) scaleY(1)}50%{transform:translate3d(-40px,-15px,0) scaleY(1.2)}}
.effect-bubble{position:absolute;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.5),var(--brand) 70%);animation:bubbleFloat linear infinite;opacity:.5;box-shadow:0 0 20px var(--brand)}
@keyframes bubbleFloat{0%{transform:translate3d(0,0,0);opacity:0}20%{opacity:.7}100%{transform:translate3d(30px,-110vh,0);opacity:0}}
.effect-fire{position:absolute;bottom:-20px;width:6px;height:40px;background:linear-gradient(180deg,transparent,var(--brand) 40%,var(--brand-2));border-radius:50% 50% 30% 30%;animation:fireRise linear infinite;opacity:.7;filter:blur(2px)}
@keyframes fireRise{0%{transform:translate3d(0,0,0) scaleY(1);opacity:0}20%{opacity:.8}100%{transform:translate3d(20px,-110vh,0) scaleY(.3);opacity:0}}
.effect-lightning{position:absolute;top:0;width:3px;height:100%;background:linear-gradient(180deg,transparent,var(--brand),transparent);opacity:0;animation:lightningFlash 6s ease-in-out infinite;filter:blur(1px);box-shadow:0 0 30px var(--brand)}
@keyframes lightningFlash{0%,88%,100%{opacity:0}89%{opacity:1}90%{opacity:.2}91%{opacity:.9}92%{opacity:0}}
.effect-aurora{position:absolute;left:-20%;right:-20%;height:200px;background:linear-gradient(90deg,transparent,var(--brand) 30%,var(--brand-2) 50%,var(--brand) 70%,transparent);opacity:.15;animation:auroraWave 12s ease-in-out infinite;filter:blur(40px);border-radius:50%}
@keyframes auroraWave{0%,100%{transform:translate3d(0,0,0) scaleY(1)}50%{transform:translate3d(30px,-20px,0) scaleY(1.3)}}

.app-header{
  position:sticky;top:0;z-index:200;
  padding-top:calc(env(safe-area-inset-top,0px) + 24px);padding-bottom:14px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--bg) 92%,transparent) 55%,transparent);
  backdrop-filter:blur(var(--glass-blur-strong)) saturate(200%);
  -webkit-backdrop-filter:blur(var(--glass-blur-strong)) saturate(200%);
  border-bottom:1px solid var(--glass-border)
}
.header-inner{display:flex;align-items:center;justify-content:center;gap:10px;max-width:760px;margin:0 auto;padding:0 12px}
.icon-btn{
  width:44px;height:44px;border-radius:50%;border:1px solid var(--glass-border);
  color:var(--text);cursor:pointer;display:grid;place-items:center;font-size:19px;
  background:linear-gradient(135deg,var(--glass-2),var(--glass-1));
  backdrop-filter:blur(var(--glass-blur)) saturate(200%);
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(200%);
  box-shadow:inset 0 1px 0 var(--glass-highlight),0 4px 16px rgba(0,0,0,.35);
  transition:transform .15s var(--spring-soft);-webkit-appearance:none;flex-shrink:0;position:relative;overflow:hidden
}
.icon-btn::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--glass-highlight) 0%,transparent 50%);opacity:.5;pointer-events:none;border-radius:inherit}
.icon-btn:active{transform:scale(.9)}
.avatar-btn{
  width:44px;height:44px;border-radius:50%;
  background:linear-gradient(135deg,var(--brand),var(--brand-2));
  display:grid;place-items:center;font-size:19px;cursor:pointer;
  border:2px solid rgba(255,255,255,.15);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 4px 16px var(--brand-glow);
  flex-shrink:0;position:relative;overflow:hidden
}
.avatar-btn::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.4) 0%,transparent 60%);pointer-events:none;border-radius:inherit}
.tab-bar-wrap{position:fixed;bottom:0;left:0;right:0;z-index:100;padding:0 8px calc(8px + var(--safe-bottom));pointer-events:none}
.tab-bar{
  border-radius:24px;display:flex;align-items:stretch;height:66px;
  width:100%;max-width:720px;margin:0 auto;pointer-events:auto;padding:4px;gap:2px;overflow:hidden;
  background:linear-gradient(135deg,var(--glass-3),var(--glass-2));
  backdrop-filter:blur(var(--glass-blur-strong)) saturate(220%);
  -webkit-backdrop-filter:blur(var(--glass-blur-strong)) saturate(220%);
  border:1px solid var(--glass-border-strong);
  box-shadow:inset 0 1px 0 var(--glass-highlight),var(--shadow-lg);position:relative
}
.tab-bar::before{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,var(--glass-highlight) 0%,transparent 40%);opacity:.4;pointer-events:none}
.tab-item{flex:1 1 0;min-width:0;background:transparent;border:none;color:var(--text-3);font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 2px;cursor:pointer;border-radius:18px;transition:color .2s,background .2s;overflow:hidden;position:relative}
.tab-item .tab-icon{font-size:20px;line-height:1;transition:transform .25s var(--spring-soft)}
.tab-item .tab-label{font-size:9px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;line-height:1}
.tab-item.active{color:var(--brand);background:linear-gradient(135deg,color-mix(in srgb,var(--brand) 22%,transparent),color-mix(in srgb,var(--brand-2) 18%,transparent))}
.tab-item.active .tab-icon{transform:scale(1.18)}

.app-main{position:relative;z-index:2;max-width:760px;margin:0 auto;width:100%;padding:14px;padding-bottom:calc(72px + var(--safe-bottom) + 72px)!important;min-height:calc(100dvh - 110px)}
.page{animation:pageIn .35s var(--spring-snap) both}
.workspace-entry{animation:workspaceRise .28s ease both;transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease}.workspace-entry:active{transform:scale(.985)}.workspace-entry:hover{border-color:var(--glass-border-strong);box-shadow:0 12px 30px rgba(0,0,0,.18)}@keyframes workspaceRise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
button,.card,.icon-btn,.tab-item{transition-duration:.22s;transition-timing-function:cubic-bezier(.2,.8,.2,1)}
@keyframes pageIn{0%{opacity:0;transform:translate3d(0,12px,0) scale(.98)}100%{opacity:1;transform:translate3d(0,0,0) scale(1)}}
.quick-tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 92px);z-index:50;display:flex;gap:6px;overflow-x:auto;padding:8px 4px;margin:-6px -4px 12px;background:linear-gradient(180deg,color-mix(in srgb,var(--bg) 85%,transparent) 60%,transparent);backdrop-filter:blur(var(--glass-blur)) saturate(180%);-webkit-backdrop-filter:blur(var(--glass-blur)) saturate(180%);scrollbar-width:none}
.quick-tabs::-webkit-scrollbar{display:none}
.quick-tab{flex-shrink:0;padding:8px 14px;border-radius:var(--r-full);background:linear-gradient(135deg,var(--glass-2),var(--glass-1));border:1px solid var(--glass-border);color:var(--text-2);font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:inherit;transition:all .2s;box-shadow:inset 0 1px 0 var(--glass-highlight),0 2px 8px rgba(0,0,0,.25)}
.quick-tab.active{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 20px var(--brand-glow)}
.title-xl{font-size:26px;font-weight:800;line-height:1.15;margin-bottom:14px;letter-spacing:-.03em}
.footnote{font-size:12px}.caption{font-size:11px}.subhead{font-size:13px}
.text-secondary{color:var(--text-2)}.text-tertiary{color:var(--text-3)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:11px 20px;border-radius:var(--r-full);border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;-webkit-appearance:none;transition:transform .15s var(--spring-soft);position:relative;overflow:hidden;text-align:center;line-height:1.2}
.btn::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.18) 0%,transparent 50%);opacity:.7;pointer-events:none;border-radius:inherit}
.btn:active:not(:disabled){transform:scale(.94)}
.btn-primary{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 8px 24px var(--brand-glow)}
.btn-success{background:linear-gradient(135deg,var(--success),#059669);color:#000;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 8px 24px rgba(61,220,151,.4)}
.btn-warning{background:var(--warning);color:#000}
.btn-danger{background:linear-gradient(135deg,var(--danger),#c0392b);color:#fff}
.btn-ghost{background:linear-gradient(135deg,var(--glass-2),var(--glass-1));color:var(--text);border:1px solid var(--glass-border);box-shadow:inset 0 1px 0 var(--glass-highlight),0 4px 12px rgba(0,0,0,.25)}
.btn-sm{min-height:38px;padding:8px 16px;font-size:13px}
.btn-xs{min-height:30px;padding:6px 12px;font-size:12px}
.btn-block{width:100%;display:flex}
.btn-icon{width:44px;height:44px;min-height:44px;padding:0;border-radius:50%}
.btn-row{display:flex;gap:6px;flex-wrap:wrap;align-items:stretch}
.btn.active{background:linear-gradient(135deg,var(--brand),var(--brand-2))!important;color:#fff!important;border-color:transparent!important}

.field{margin-bottom:14px}
.field-label{display:block;font-size:11px;font-weight:700;color:var(--text-2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em}
input[type="text"],input[type="number"],input[type="datetime-local"],input[type="date"],input[type="time"],input[type="password"],input[type="email"],input[type="url"],input[type="search"],input[type="tel"],select,textarea{
  width:100%;min-height:46px;padding:12px 18px;
  background:linear-gradient(135deg,var(--glass-2),var(--glass-1));
  border:1.5px solid var(--glass-border);border-radius:var(--r-lg);
  color:var(--text);font-family:inherit;font-size:15px;font-weight:500;
  -webkit-appearance:none;appearance:none;
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  box-shadow:inset 0 1px 0 var(--glass-highlight),0 2px 8px rgba(0,0,0,.15);
  transition:border-color .15s,background .15s,box-shadow .15s
}
input:focus,select:focus,textarea:focus{outline:none;background:linear-gradient(135deg,var(--glass-3),var(--glass-2));border-color:var(--brand);box-shadow:inset 0 1px 0 var(--glass-highlight),0 0 0 4px color-mix(in srgb,var(--brand) 25%,transparent)}
textarea{resize:vertical;min-height:90px;line-height:1.55;padding-top:12px}
input[type="range"]{-webkit-appearance:none;width:100%;height:46px;background:transparent;padding:0;margin:0;border:none}
input[type="range"]::-webkit-slider-runnable-track{height:8px;background:linear-gradient(90deg,var(--glass-3),var(--glass-2));border-radius:var(--r-full);border:1px solid var(--glass-border)}
input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand-2));box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 4px 16px var(--brand-glow);margin-top:-12px;border:3px solid rgba(255,255,255,.9);cursor:pointer}
input[type="checkbox"]{-webkit-appearance:none;appearance:none;width:22px;height:22px;border-radius:6px;border:1.5px solid var(--glass-border);background:var(--glass-2);cursor:pointer;position:relative;vertical-align:middle}
input[type="checkbox"]:checked{background:linear-gradient(135deg,var(--brand),var(--brand-2));border-color:var(--brand)}
input[type="checkbox"]:checked::after{content:'✓';position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px}

.card{background:linear-gradient(135deg,var(--glass-2),var(--glass-1));backdrop-filter:blur(var(--glass-blur-strong)) saturate(200%);-webkit-backdrop-filter:blur(var(--glass-blur-strong)) saturate(200%);border:1px solid var(--glass-border);border-radius:var(--r-lg);padding:18px;margin-bottom:14px;position:relative;overflow:hidden;box-shadow:inset 0 1px 0 var(--glass-highlight),inset 0 -1px 0 rgba(0,0,0,.12),var(--shadow-md)}
.card::before{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(135deg,var(--glass-highlight) 0%,transparent 45%);opacity:.35;pointer-events:none}
.card::after{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--glass-highlight),transparent);opacity:.6;pointer-events:none}
.card > *{position:relative;z-index:1}
.card-gradient{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;border:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 12px 40px var(--brand-glow)}
.card h2{font-size:17px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.list-row{display:flex;align-items:center;gap:12px;padding:13px 15px;background:linear-gradient(135deg,var(--glass-2),var(--glass-1));backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1px solid var(--glass-border);border-radius:var(--r-md);margin-bottom:8px;cursor:pointer;min-height:62px;box-shadow:inset 0 1px 0 var(--glass-highlight),0 2px 12px rgba(0,0,0,.2);transition:transform .15s var(--spring-soft);position:relative;overflow:hidden}
.list-row:active{transform:scale(.98)}
.list-icon{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex-shrink:0;font-size:20px;background:linear-gradient(135deg,var(--glass-3),var(--glass-2));border:1px solid var(--glass-border);box-shadow:inset 0 1px 0 var(--glass-highlight)}
.list-body{flex:1;min-width:0}
.list-title{font-size:14px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-subtitle{font-size:11px;color:var(--text-2);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-value{font-size:14px;color:var(--text-2);font-weight:600;flex-shrink:0}
.list-chevron{color:var(--text-4);flex-shrink:0;font-size:20px}
.task-item{background:linear-gradient(135deg,var(--glass-2),var(--glass-1));backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1.5px solid var(--glass-border);border-radius:var(--r-md);padding:13px 15px;margin-bottom:8px;display:flex;align-items:center;gap:12px;cursor:pointer;box-shadow:inset 0 1px 0 var(--glass-highlight),0 2px 12px rgba(0,0,0,.2);transition:transform .15s var(--spring-soft)}
.task-item:active{transform:scale(.98)}
.task-item.completed{opacity:.55}
.task-item.completed .task-title{text-decoration:line-through}
.task-checkbox{width:28px;height:28px;border-radius:50%;border:2px solid var(--text-3);background:transparent;display:grid;place-items:center;cursor:pointer;flex-shrink:0;padding:0;color:transparent;font-size:14px;font-weight:700}
.task-checkbox.checked{background:linear-gradient(135deg,var(--success),#059669);border-color:var(--success);color:#000;box-shadow:0 0 12px rgba(61,220,151,.5)}
.task-content{flex:1;min-width:0}
.task-title{font-size:14px;font-weight:600;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task-meta{display:flex;gap:6px;font-size:11px;color:var(--text-2);align-items:center;flex-wrap:wrap}
.priority-bar{width:3px;height:36px;border-radius:2px;flex-shrink:0}
.priority-bar.high{background:var(--danger);box-shadow:0 0 8px var(--danger)}
.priority-bar.medium{background:var(--warning)}
.priority-bar.low{background:var(--success)}
.progress{height:8px;background:var(--glass-2);border-radius:var(--r-full);overflow:hidden;border:1px solid var(--glass-border);box-shadow:inset 0 1px 2px rgba(0,0,0,.3)}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-2));border-radius:var(--r-full);transition:width .4s var(--ease);box-shadow:0 0 12px var(--brand-glow)}
.progress-ring-hero{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:18px 8px;background:linear-gradient(135deg,var(--glass-2),var(--glass-1));backdrop-filter:blur(var(--glass-blur-strong)) saturate(200%);-webkit-backdrop-filter:blur(var(--glass-blur-strong)) saturate(200%);border:1px solid var(--glass-border);border-radius:var(--r-lg);margin-bottom:14px;box-shadow:inset 0 1px 0 var(--glass-highlight),var(--shadow-md)}
.ring-item{display:flex;flex-direction:column;align-items:center;gap:6px}
.ring-center{position:relative;width:64px;height:64px}
.ring-svg{width:64px;height:64px;transform:rotate(-90deg)}
.ring-track{fill:none;stroke:var(--glass-3);stroke-width:6}
.ring-fill{fill:none;stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .8s var(--spring-soft)}
.ring-value{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:var(--text);line-height:1}
.ring-label{font-size:9px;font-weight:700;color:var(--text-2);text-transform:uppercase;text-align:center}

/* КРУГ 7 СФЕР */
.spheres-circle-wrap{display:flex;justify-content:center;padding:20px 0;margin-bottom:14px;position:relative}
.spheres-circle{width:280px;height:280px;position:relative}
.spheres-circle svg{width:100%;height:100%;transform:rotate(-90deg)}
.sphere-sector{transition:all .3s var(--spring-soft);cursor:pointer}
.sphere-sector:hover{filter:brightness(1.3)}
.sphere-center-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.sphere-center-value{font-size:36px;font-weight:800;line-height:1;color:var(--text)}
.sphere-center-text{font-size:11px;color:var(--text-2);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-top:4px}

/* КАЛЕНДАРЬ И РАСПИСАНИЕ */
.cal-toolbar{display:flex;align-items:center;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.cal-nav-btn{width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,var(--glass-3),var(--glass-2));border:1px solid var(--glass-border);color:var(--text);font-size:20px;cursor:pointer;display:grid;place-items:center;font-family:inherit}
.cal-today-btn{height:38px;padding:0 15px;border-radius:13px;background:linear-gradient(135deg,var(--glass-3),var(--glass-2));border:1px solid var(--glass-border);color:var(--text);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.cal-title{flex:1;text-align:center;font-size:16px;font-weight:800;min-width:120px}
.cal-month{background:linear-gradient(135deg,var(--glass-2),var(--glass-1));border:1px solid var(--glass-border);border-radius:var(--r-lg);padding:8px;margin-bottom:14px;box-shadow:inset 0 1px 0 var(--glass-highlight)}
.cal-month-head{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px}
.cal-month-head-cell{text-align:center;font-size:11px;font-weight:800;color:var(--text-3);padding:6px 0;text-transform:uppercase}
.cal-month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-month-cell{aspect-ratio:1;background:linear-gradient(135deg,var(--glass-2),var(--glass-1));border:1px solid transparent;border-radius:11px;padding:6px 4px;cursor:pointer;display:flex;flex-direction:column;position:relative;min-height:46px;box-shadow:inset 0 1px 0 var(--glass-highlight)}
.cal-month-cell:active{background:var(--glass-3)}
.cal-month-cell.cal-today{border-color:var(--brand);background:linear-gradient(135deg,color-mix(in srgb,var(--brand) 25%,transparent),color-mix(in srgb,var(--brand) 12%,transparent))}
.cal-month-cell.cal-other-month{opacity:.35}
.cal-day-num{font-size:12px;font-weight:800;text-align:center;margin-bottom:2px}
.cal-day-events{display:flex;flex-wrap:wrap;gap:2px;justify-content:center}
.cal-event-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.cal-color-picker{display:grid;grid-template-columns:repeat(11,1fr);gap:6px;margin-top:6px}
.cal-color-btn{aspect-ratio:1;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:transform .15s}
.cal-color-btn.active{border-color:var(--text);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--text)}

/* РАСПИСАНИЕ ДНЯ */
.schedule-grid{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.schedule-slot{display:flex;align-items:center;gap:10px;padding:10px 12px;background:linear-gradient(135deg,var(--glass-2),var(--glass-1));border:1px solid var(--glass-border);border-radius:var(--r-md);box-shadow:inset 0 1px 0 var(--glass-highlight)}
.schedule-slot.active{border-color:var(--brand);background:linear-gradient(135deg,color-mix(in srgb,var(--brand) 18%,transparent),color-mix(in srgb,var(--brand) 8%,transparent))}
.schedule-icon{font-size:22px;flex-shrink:0}
.schedule-body{flex:1;min-width:0}
.schedule-label{font-size:13px;font-weight:700}
.schedule-time{font-size:11px;color:var(--text-2);margin-top:2px}
.schedule-time-input{width:auto;padding:6px 10px;font-size:13px;min-height:auto;font-weight:700;text-align:center}

/* ОВЕРЛЕЙ */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);z-index:1000;display:flex;align-items:flex-end;justify-content:center;animation:overlayIn .15s ease}
@keyframes overlayIn{from{opacity:0}to{opacity:1}}
.modal{background:linear-gradient(135deg,var(--glass-3),var(--glass-2));backdrop-filter:blur(var(--glass-blur-strong)) saturate(220%);-webkit-backdrop-filter:blur(var(--glass-blur-strong)) saturate(220%);border:1px solid var(--glass-border-strong);border-bottom:none;width:100%;max-width:600px;max-height:92dvh;border-radius:32px 32px 0 0;padding:18px;padding-bottom:calc(22px + var(--safe-bottom));overflow-y:auto;box-shadow:inset 0 1px 0 var(--glass-highlight),0 -20px 80px rgba(0,0,0,.6);animation:modalIn .3s var(--spring-snap);position:relative}
.modal::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--glass-highlight),transparent);opacity:.7;pointer-events:none}
@keyframes modalIn{from{transform:translate3d(0,100%,0)}to{transform:translate3d(0,0,0)}}
.modal-handle{width:40px;height:4px;background:var(--glass-4);border-radius:3px;margin:0 auto 14px;box-shadow:0 0 8px var(--glass-highlight)}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;position:sticky;top:0;padding-bottom:6px;z-index:1}
.modal-title{font-size:20px;font-weight:800}
.modal-close{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--glass-3),var(--glass-2));border:1px solid var(--glass-border);color:var(--text-2);display:grid;place-items:center;cursor:pointer;font-size:15px}

.toast-container{position:fixed;top:calc(110px + var(--safe-top));left:50%;transform:translateX(-50%);z-index:2000;display:flex;flex-direction:column;gap:8px;pointer-events:none;width:90%;max-width:440px}
.toast{background:linear-gradient(135deg,var(--glass-4),var(--glass-3));backdrop-filter:blur(var(--glass-blur-strong)) saturate(220%);-webkit-backdrop-filter:blur(var(--glass-blur-strong)) saturate(220%);border:1px solid var(--glass-border-strong);color:#fff;border-radius:var(--r-md);padding:14px 20px;box-shadow:inset 0 1px 0 var(--glass-highlight),var(--shadow-lg);display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;pointer-events:auto;animation:toastIn .3s var(--spring-snap)}
@keyframes toastIn{from{opacity:0;transform:translate3d(0,-16px,0)}to{opacity:1;transform:translate3d(0,0,0)}}
.toast.success{background:linear-gradient(135deg,rgba(61,220,151,.95),rgba(5,150,105,.95));color:#000}
.toast.error{background:linear-gradient(135deg,rgba(255,107,107,.95),rgba(200,50,50,.95))}
.toast.warning{background:linear-gradient(135deg,rgba(255,169,64,.95),rgba(220,130,30,.95));color:#000}

.segmented{display:flex;background:linear-gradient(135deg,var(--glass-2),var(--glass-1));border:1px solid var(--glass-border);border-radius:var(--r-full);padding:4px;gap:2px;overflow-x:auto;scrollbar-width:none}
.segmented::-webkit-scrollbar{display:none}
.segmented-item{flex:1;min-height:38px;padding:7px 14px;background:transparent;border:none;border-radius:var(--r-full);font-family:inherit;font-size:12px;font-weight:700;color:var(--text-2);cursor:pointer;white-space:nowrap;min-width:fit-content}
.segmented-item.active{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 4px 12px var(--brand-glow)}
.search-bar{display:flex;align-items:center;gap:8px;padding:11px 18px;background:linear-gradient(135deg,var(--glass-2),var(--glass-1));backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1px solid var(--glass-border);border-radius:var(--r-full);margin-bottom:12px;box-shadow:inset 0 1px 0 var(--glass-highlight)}
.search-bar input{flex:1;padding:0;background:transparent;border:none;font-size:15px;color:var(--text);min-height:auto}

.chat{display:flex;flex-direction:column;gap:10px;padding:8px 0}

.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat-item{text-align:center;padding:15px 8px;background:linear-gradient(135deg,var(--glass-2),var(--glass-1));backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1px solid var(--glass-border);border-radius:var(--r-md);box-shadow:inset 0 1px 0 var(--glass-highlight)}
.stat-value{font-size:20px;font-weight:800;line-height:1;margin-bottom:5px}

.group-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}

.compact-item{display:flex;align-items:center;gap:10px;padding:13px 15px;background:linear-gradient(135deg,var(--glass-2),var(--glass-1));backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1px solid var(--glass-border);border-radius:var(--r-md);cursor:pointer;font-size:13px;font-weight:600;box-shadow:inset 0 1px 0 var(--glass-highlight);transition:transform .15s var(--spring-soft)}

.method-card{background:linear-gradient(135deg,var(--glass-2),var(--glass-1));backdrop-filter:blur(var(--glass-blur-strong)) saturate(200%);-webkit-backdrop-filter:blur(var(--glass-blur-strong)) saturate(200%);border:1px solid var(--glass-border);border-radius:var(--r-md);padding:15px;margin-bottom:10px;cursor:pointer;box-shadow:inset 0 1px 0 var(--glass-highlight),var(--shadow-md);transition:transform .15s var(--spring-soft);position:relative;overflow:hidden}

.method-header{display:flex;align-items:center;gap:10px;margin-bottom:8px}

.lesson-row{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:var(--r-sm);margin-bottom:4px;background:linear-gradient(135deg,var(--glass-2),var(--glass-1));border:1px solid transparent;cursor:pointer;box-shadow:inset 0 1px 0 var(--glass-highlight)}

.lesson-num{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;font-size:11px;font-weight:700;background:linear-gradient(135deg,var(--glass-3),var(--glass-2));color:var(--text-2);box-shadow:inset 0 1px 0 var(--glass-highlight)}
.lesson-row.done .lesson-num{background:var(--success);color:#000}

.lesson-title{font-size:13px;font-weight:600;flex:1}

.detox-progress-hero{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;border-radius:var(--r-lg);padding:20px;margin-bottom:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 12px 40px var(--brand-glow)}

.detox-progress-hero .big{font-size:44px;font-weight:800;line-height:1}

.welcome-screen{position:fixed;inset:0;background:var(--bg);z-index:5000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;overflow-y:auto}
.welcome-logo{width:100px;height:100px;border-radius:30px;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:grid;place-items:center;font-size:52px;margin-bottom:24px;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 16px 48px var(--brand-glow);animation:welcomeFloat 3s ease-in-out infinite}

.survey-container{max-width:440px;width:100%;text-align:left}

.achieve-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.level-hero{background:linear-gradient(135deg,var(--glass-2),var(--glass-1));border:1px solid var(--glass-border);border-radius:var(--r-lg);padding:18px;margin-bottom:14px;box-shadow:inset 0 1px 0 var(--glass-highlight)}

.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px}

.mt-1{margin-top:4px}.mt-2{margin-top:8px}.mt-3{margin-top:12px}.mt-4{margin-top:16px}.mt-5{margin-top:20px}

:root{color-scheme:dark;scroll-behavior:smooth}body{min-width:320px}
button,input,select,textarea{font:inherit}button{touch-action:manipulation}
.app-main{width:100%;max-width:1120px;margin:0 auto;padding:18px 22px calc(92px + var(--safe-bottom))}
.app-header .header-inner{max-width:1120px;margin:0 auto;padding-left:22px;padding-right:22px}
.tab-bar-wrap{padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}
.card,.group-card,.insight-card{backface-visibility:hidden;transition:transform .22s var(--ease),border-color .22s var(--ease),box-shadow .22s var(--ease)}
.btn,.tab-item,.icon-btn,.avatar-btn{transition:transform .18s var(--spring-soft),filter .18s var(--ease),background .18s var(--ease)}
.btn:active,.tab-item:active,.icon-btn:active{transform:scale(.97)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--brand);outline-offset:3px}
input,select,textarea{max-width:100%;min-width:0}.workspace-page{animation:pageEnter .28s var(--ease) both}
@keyframes pageEnter{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
.update-banner{position:fixed;z-index:9999;left:50%;bottom:calc(86px + var(--safe-bottom));transform:translateX(-50%);width:min(520px,calc(100% - 24px));display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid var(--glass-border-strong);border-radius:18px;background:var(--bg-2);color:var(--text);box-shadow:var(--shadow-lg);backdrop-filter:blur(20px)}
.update-banner button{border:0;border-radius:12px;padding:10px 14px;background:var(--brand);color:#07111e;font-weight:800;white-space:nowrap;cursor:pointer}
@media(min-width:760px){.app-main{padding-top:28px;padding-bottom:40px}.tab-bar-wrap{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:min(760px,calc(100% - 36px));border:1px solid var(--glass-border);border-radius:22px;background:color-mix(in srgb,var(--bg-2) 88%,transparent);box-shadow:var(--shadow-lg);backdrop-filter:blur(24px);padding:6px;z-index:300}.tab-bar{display:flex;justify-content:space-around}.tab-item{min-width:84px;border-radius:16px}.tab-item.active{background:var(--glass-3)}.app-header{padding-top:12px}.app-header .header-inner{min-height:64px}.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}.card:hover,.group-card:hover{transform:translateY(-2px);border-color:var(--glass-border-strong)}}
@media(min-width:1100px){.app-main{padding-left:30px;padding-right:30px}.page{max-width:100%}}
@media(max-width:759px){.app-main{padding-left:14px;padding-right:14px}.app-header{padding-top:calc(var(--safe-top) + 10px)}.tab-bar-wrap{padding-bottom:var(--safe-bottom)}}

<script>
(function(){
  function updateLifeOSViewport(){
    var h=0;
    try{
      var tg=window.Telegram&&window.Telegram.WebApp;
      if(tg&&Number(tg.viewportHeight)>0)h=Number(tg.viewportHeight);
    }catch(e){}
    if(!h&&window.visualViewport&&Number(window.visualViewport.height)>0)h=Number(window.visualViewport.height);
    if(!h)h=window.innerHeight||document.documentElement.clientHeight||0;
    if(h>0)document.documentElement.style.setProperty('--lifeos-viewport-height',Math.round(h)+'px');
    var header=document.getElementById('appHeader');
    if(header){
      var hh=Math.ceil(header.getBoundingClientRect().height);
      if(hh>0)document.documentElement.style.setProperty('--lifeos-header-height',hh+'px');
    }
  }
  window.lifeosScrollToTop=function(){
    var root=document.getElementById('app');
    if(root)root.scrollTo({top:0,left:0,behavior:'auto'});
  };
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',updateLifeOSViewport,{once:true});
  else updateLifeOSViewport();
  window.addEventListener('resize',updateLifeOSViewport,{passive:true});
  if(window.visualViewport)window.visualViewport.addEventListener('resize',updateLifeOSViewport,{passive:true});
  try{
    var tg=window.Telegram&&window.Telegram.WebApp;
    if(tg&&tg.onEvent)tg.onEvent('viewportChanged',updateLifeOSViewport);
  }catch(e){}
  if(window.ResizeObserver){
    var header=document.getElementById('appHeader');
    if(header)new ResizeObserver(updateLifeOSViewport).observe(header);
  }
  setTimeout(updateLifeOSViewport,100);
  setTimeout(updateLifeOSViewport,500);
})();
</script>

<script>
(function(){
  var failed=[];
  ['content.js','lifeos-detox-details.js','content2.js','content3.js','lifeos-curriculum.js','jarvis-core.js','app.js','lifeos-workspaces.js','lifeos-systems.js','lifeos-learning-experience.js','lifeos-learning-plan.js','lifeos-learning-content.js','lifeos-search.js'].forEach(function(name){
    var script=document.querySelector('script[src^="'+name+'?"]')||document.querySelector('script[src="'+name+'"]');
    if(script) script.addEventListener('error',function(){failed.push(name);show('Не загрузился файл: '+name+'. Проверьте публикацию и доступность файлов.');});
  });
  function show(message){
    var app=document.getElementById('app');
    if(app) app.innerHTML='<div style="margin:24px;padding:20px;border:1px solid #ff6b6b;border-radius:16px;color:#fff;background:#241014;font:14px/1.5 system-ui"><b>Life OS не запустился</b><br>'+message+'</div>';
  }
  window.addEventListener('error',function(e){
    if(e && e.message) show('JavaScript: '+e.message+(e.filename?' ('+e.filename.split('/').pop()+':'+e.lineno+')':''));
  });
  window.addEventListener('unhandledrejection',function(e){
    var reason=e && e.reason;
    show('Ошибка Promise: '+(reason && reason.message ? reason.message : String(reason||'неизвестно')));
  });
  setTimeout(function(){
    if(!window.__LIFE_OS_BOOTED && !failed.length) show('Скрипты не завершили запуск. Вероятно, app.js не выполнился или остановился до init().');
  },8000);
})();
</script>
