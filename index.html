.toast-container{position:fixed;top:calc(var(--header-h) + var(--safe-top) + 10px);left:50%;transform:translateX(-50%);z-index:2000;display:flex;flex-direction:column;gap:8px;pointer-events:none;width:90%;max-width:440px}
.toast{background:var(--glass-3);backdrop-filter:blur(24px);border:1px solid var(--glass-border-strong);color:#fff;border-radius:var(--r-md);padding:12px 18px;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;pointer-events:auto;animation:toastIn .3s var(--spring-snap)}
@keyframes toastIn{from{opacity:0;transform:translate3d(0,-16px,0)}to{opacity:1;transform:translate3d(0,0,0)}}
.toast.success{background:linear-gradient(135deg,rgba(61,220,151,.95),rgba(5,150,105,.95));color:#000}
.toast.error{background:linear-gradient(135deg,rgba(255,107,107,.95),rgba(200,50,50,.95))}
.toast.warning{background:linear-gradient(135deg,rgba(255,169,64,.95),rgba(220,130,30,.95));color:#000}
.segmented{display:flex;background:var(--glass-2);border:1px solid var(--glass-border);border-radius:var(--r-full);padding:4px;gap:2px;overflow-x:auto;scrollbar-width:none}
.segmented::-webkit-scrollbar{display:none}
.segmented-item{flex:1;min-height:36px;padding:7px 14px;background:transparent;border:none;border-radius:var(--r-full);font-family:inherit;font-size:12px;font-weight:700;color:var(--text-2);cursor:pointer;white-space:nowrap;min-width:fit-content}
.segmented-item.active{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff}
.search-bar{display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--glass-2);border:1px solid var(--glass-border);border-radius:var(--r-full);margin-bottom:12px}
.search-bar input{flex:1;padding:0;background:transparent;border:none;font-size:15px;color:var(--text);min-height:auto}
.search-bar input:focus{outline:none;background:transparent;box-shadow:none}
.chat{display:flex;flex-direction:column;gap:10px;padding:8px 0}
.msg{max-width:86%;padding:12px 16px;border-radius:20px;font-size:14px;line-height:1.5;word-wrap:break-word}
.msg-user{align-self:flex-end;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;border-bottom-right-radius:6px}
.msg-bot{align-self:flex-start;background:var(--glass-2);color:var(--text);border:1px solid var(--glass-border);border-bottom-left-radius:6px}
.typing{display:flex;gap:4px;padding:14px 18px;align-self:flex-start;background:var(--glass-2);border-radius:20px;border:1px solid var(--glass-border)}
.typing span{width:6px;height:6px;background:var(--text-3);border-radius:50%;animation:typing 1.4s infinite}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}
@keyframes typing{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat-item{text-align:center;padding:14px 8px;background:var(--glass-1);border:1px solid var(--glass-border);border-radius:var(--r-md)}
.stat-value{font-size:20px;font-weight:800;line-height:1;margin-bottom:5px}
.stat-label{font-size:9px;color:var(--text-2);text-transform:uppercase;font-weight:700}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--divider)}
.stat-row:last-child{border-bottom:none}
.stat-row-label{font-size:13px;color:var(--text-2)}
.stat-row-value{font-size:14px;font-weight:700;color:var(--text)}
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:var(--r-full);font-size:10px;font-weight:700;background:var(--glass-2);color:var(--text-2);border:1px solid var(--glass-border)}
.badge-success{background:rgba(61,220,151,.2);color:var(--success);border-color:rgba(61,220,151,.3)}
.badge-brand{background:rgba(91,158,255,.2);color:var(--brand);border-color:rgba(91,158,255,.3)}
.group-card{background:var(--glass-1);border:1px solid var(--glass-border);border-radius:var(--r-md);padding:14px;margin-bottom:10px}
.group-title{font-size:12px;font-weight:800;color:var(--text-2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
.group-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.group-item{padding:12px 8px;border-radius:var(--r-sm);background:var(--glass-2);border:1px solid var(--glass-border);text-align:center;cursor:pointer}
.group-item-icon{font-size:22px;margin-bottom:4px}
.group-item-label{font-size:10px;font-weight:600;color:var(--text);line-height:1.2}
.compact-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.compact-item{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--glass-1);border:1px solid var(--glass-border);border-radius:var(--r-md);cursor:pointer;font-size:13px;font-weight:600}
.compact-icon{font-size:22px;flex-shrink:0}
.method-card,.course-card{background:var(--glass-1);border:1px solid var(--glass-border);border-radius:var(--r-md);padding:14px;margin-bottom:8px;cursor:pointer}
.method-header,.course-header{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.method-emoji,.course-emoji{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--glass-2);border:1px solid var(--glass-border);flex-shrink:0}
.method-title,.course-title{font-size:14px;font-weight:700;margin-bottom:2px}
.method-cat,.course-meta{font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em;font-weight:700}
.method-desc{font-size:12px;color:var(--text-2);line-height:1.4}
.level-card{background:var(--glass-1);border:2px solid var(--glass-border);border-radius:var(--r-lg);padding:16px;margin-bottom:12px;cursor:pointer}
.level-card.locked{opacity:.5;cursor:not-allowed}
.level-card.active{border-color:var(--brand)}

.level-header{display:flex;align-items:center;gap:12px;margin-bottom:10px}

.level-info{flex:1;min-width:0}
.level-title{font-size:16px;font-weight:800;margin-bottom:2px}
.level-subtitle{font-size:12px;color:var(--text-2)}
.level-desc{font-size:12px;color:var(--text-2);line-height:1.4;margin-bottom:10px}
.module-card{background:var(--glass-1);border:1px solid var(--glass-border);border-radius:var(--r-md);padding:14px;margin-bottom:8px;cursor:pointer}
.module-card.locked{opacity:.5;cursor:not-allowed}
.module-card.completed{border-color:var(--success)}
.module-header{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.module-icon{width:40px;height:40px;border-radius:12px;background:var(--glass-2);border:1px solid var(--glass-border);display:grid;place-items:center;flex-shrink:0;font-size:20px}

.module-title{font-size:14px;font-weight:700;margin-bottom:2px}
.module-meta{font-size:11px;color:var(--text-2)}
.module-desc{font-size:12px;color:var(--text-2);line-height:1.4}
.lesson-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-sm);margin-bottom:4px;background:var(--glass-1);border:1px solid transparent;cursor:pointer}
.lesson-row.locked{opacity:.4;cursor:not-allowed}
.lesson-row.done{background:rgba(61,220,151,.1);border-color:rgba(61,220,151,.3)}
.lesson-row.current{border-color:var(--brand);background:rgba(91,158,255,.08)}
.lesson-num{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;font-size:11px;font-weight:700;background:var(--glass-2);color:var(--text-2)}
.lesson-row.done .lesson-num{background:var(--success);color:#000}
.lesson-row.current .lesson-num{background:var(--brand);color:#fff}
.lesson-title{font-size:13px;font-weight:600;flex:1}
.lesson-section{background:var(--glass-1);border-radius:var(--r-md);padding:14px;margin-bottom:10px;border-left:3px solid var(--brand)}
.lesson-section.practice{border-left-color:var(--success)}
.lesson-section.reflection{border-left-color:var(--warning)}
.lesson-section.memory{border-left-color:var(--coach)}
.lesson-section.video{border-left-color:#ff0000}
.lesson-section-title{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--brand);margin-bottom:8px}
.lesson-section.practice .lesson-section-title{color:var(--success)}
.lesson-section.reflection .lesson-section-title{color:var(--warning)}
.lesson-section.video .lesson-section-title{color:#ff0000}
.lesson-content{font-size:14px;line-height:1.6;color:var(--text)}
.lesson-content strong{color:var(--brand-2);font-weight:700}
.lesson-content ul{list-style:none;padding:0;margin:0}
.lesson-content li{padding:3px 0 3px 18px;position:relative}
.lesson-content li::before{content:'•';position:absolute;left:6px;color:var(--brand);font-weight:800}
.path-step{display:flex;gap:12px;padding:12px;border-radius:var(--r-md);margin-bottom:8px;background:var(--glass-1);border:1px solid var(--glass-border);cursor:pointer}
.path-step.locked{opacity:.4;cursor:not-allowed}
.path-step.completed{border-color:var(--success);background:rgba(61,220,151,.1)}
.path-step.active{border-color:var(--brand)}
.path-step-num{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;font-weight:800;font-size:13px;background:var(--glass-2);color:var(--text-2)}
.path-step.completed .path-step-num{background:var(--success);color:#000}
.path-step.active .path-step-num{background:var(--brand);color:#fff}
.path-step-body{flex:1}
.path-step-title{font-weight:700;font-size:14px;margin-bottom:3px}
.path-step-desc{font-size:12px;color:var(--text-2);line-height:1.4}
.domain-card{background:var(--glass-1);border:1px solid var(--glass-border);border-radius:var(--r-md);padding:14px;margin-bottom:8px;cursor:pointer}
.domain-header{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.domain-icon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex-shrink:0}
.domain-title{font-size:14px;font-weight:700;margin-bottom:2px}
.domain-score{font-size:11px;color:var(--text-2)}
.domain-bar{height:5px;background:var(--glass-2);border-radius:var(--r-full);overflow:hidden;margin-top:8px;border:1px solid var(--glass-border)}
.domain-bar-fill{height:100%;border-radius:var(--r-full);transition:width .4s var(--ease)}
.matrix-grid-2x2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.matrix-quadrant{border-radius:var(--r-md);padding:14px 10px;background:var(--glass-1);border:1.5px solid var(--glass-border);cursor:pointer;min-height:100px;display:flex;flex-direction:column}
.matrix-q-title{font-size:10px;font-weight:800;margin-bottom:8px;text-transform:uppercase}
.matrix-q-count{font-size:28px;font-weight:800;line-height:1;margin-bottom:4px}
.matrix-q-sub{font-size:10px;color:var(--text-2)}
.matrix-q1{border-color:rgba(255,107,107,.4)}.matrix-q1 .matrix-q-title{color:var(--danger)}
.matrix-q2{border-color:rgba(91,158,255,.4)}.matrix-q2 .matrix-q-title{color:var(--brand)}
.matrix-q3{border-color:rgba(255,169,64,.4)}.matrix-q3 .matrix-q-title{color:var(--warning)}
.matrix-q4{border-color:rgba(255,255,255,.15)}.matrix-q4 .matrix-q-title{color:var(--text-3)}
.habit-row{display:flex;align-items:center;gap:10px;padding:12px;background:var(--glass-1);border:1.5px solid var(--glass-border);border-radius:var(--r-md);margin-bottom:6px;cursor:pointer}
.habit-icon{font-size:22px;flex-shrink:0}
.habit-body{flex:1}
.habit-title{font-size:13px;font-weight:600}
.habit-streak{font-size:11px;color:var(--warning);font-weight:700;margin-top:2px}
.detox-day-card{background:var(--glass-1);border:1.5px solid var(--glass-border);border-radius:var(--r-lg);padding:16px;margin-bottom:12px;cursor:pointer}
.detox-day-card.completed{border-color:var(--success);background:rgba(61,220,151,.08)}
.detox-day-card.current{border-color:var(--brand)}
.detox-day-card.locked{opacity:.5}
.detox-day-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.detox-day-number{display:inline-flex;align-items:center;justify-content:center;min-width:50px;height:32px;padding:0 12px;border-radius:var(--r-full);background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;font-weight:800;font-size:13px}
.detox-day-card.completed .detox-day-number{background:linear-gradient(135deg,var(--success),#059669)}
.detox-day-title{font-size:17px;font-weight:800;margin-bottom:8px;line-height:1.2}
.detox-day-subtitle{font-size:11px;color:var(--text-3);font-weight:600;text-transform:uppercase;margin-bottom:10px}
.detox-section{background:var(--glass-2);border-radius:var(--r-sm);padding:12px 14px;margin-bottom:8px;border-left:3px solid var(--brand)}
.detox-section.why{border-left-color:var(--brand-3)}
.detox-section.do{border-left-color:var(--success)}
.detox-section.effect{border-left-color:var(--warning)}
.detox-section-title{font-size:10px;font-weight:800;text-transform:uppercase;margin-bottom:6px;color:var(--brand)}
.detox-section.do .detox-section-title{color:var(--success)}
.detox-section.effect .detox-section-title{color:var(--warning)}
.detox-section-content{font-size:13px;line-height:1.55;color:var(--text)}
.detox-section-content ul{list-style:none;padding:0;margin:0}
.detox-section-content li{padding:3px 0 3px 18px;position:relative}
.detox-section-content li::before{content:'•';position:absolute;left:6px;color:var(--brand);font-weight:800}
.detox-progress-hero{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;border-radius:var(--r-lg);padding:18px;margin-bottom:12px}
.detox-progress-hero h2{font-size:18px;font-weight:800;margin-bottom:8px}
.detox-progress-hero .big{font-size:40px;font-weight:800;line-height:1}
.detox-progress-hero .small{font-size:12px;opacity:.9;margin-top:6px}
.welcome-screen{position:fixed;inset:0;background:var(--bg);z-index:5000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;overflow-y:auto}
.welcome-logo{width:96px;height:96px;border-radius:28px;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:grid;place-items:center;font-size:50px;margin-bottom:22px;animation:welcomeFloat 3s ease-in-out infinite}
@keyframes welcomeFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.welcome-title{font-size:28px;font-weight:800;margin-bottom:10px}
.welcome-sub{font-size:15px;color:var(--text-2);margin-bottom:24px;max-width:400px;line-height:1.6}
.welcome-input{width:100%;max-width:380px;text-align:center;font-size:18px!important;font-weight:700!important}
.survey-container{max-width:440px;width:100%;text-align:left}
.survey-progress{display:flex;gap:3px;margin-bottom:16px;justify-content:center}
.survey-dot{width:8px;height:8px;border-radius:50%;background:var(--glass-3)}
.survey-dot.active{background:var(--brand)}
.survey-dot.done{background:var(--success)}
.survey-question{font-size:18px;font-weight:800;margin-bottom:6px;line-height:1.3}
.survey-option{padding:12px 16px;border-radius:12px;background:var(--glass-2);border:1.5px solid transparent;margin-bottom:6px;cursor:pointer;font-size:14px;display:flex;align-items:center;gap:10px}
.survey-option.selected{border-color:var(--brand);background:rgba(91,158,255,.15)}
.survey-option-emoji{font-size:20px;flex-shrink:0}
.ent-card{background:var(--glass-1);border:1px solid var(--glass-border);border-radius:var(--r-md);padding:14px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start}
.ent-poster{width:60px;height:88px;border-radius:10px;background:var(--glass-2);border:1px solid var(--glass-border);display:grid;place-items:center;font-size:28px;flex-shrink:0}
.ent-body{flex:1;min-width:0}
.ent-title{font-size:14px;font-weight:700;margin-bottom:3px}
.ent-meta{font-size:11px;color:var(--text-2);margin-bottom:4px}
.ent-desc{font-size:12px;color:var(--text-2);line-height:1.4}
.ent-rating{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:6px;background:rgba(255,169,64,.2);color:var(--warning);font-size:11px;font-weight:700;margin-top:5px}
.resource-card{background:var(--glass-1);border:1px solid var(--glass-border);border-radius:var(--r-md);padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.resource-favicon{width:36px;height:36px;border-radius:10px;background:var(--glass-2);display:grid;place-items:center;font-size:16px;flex-shrink:0}
.resource-body{flex:1;min-width:0}
.resource-title{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.resource-url{font-size:11px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.video-wrap{position:relative;width:100%;padding-bottom:56.25%;border-radius:var(--r-md);overflow:hidden;background:#000;margin:10px 0}
.video-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none}
.achieve-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.achieve-item{text-align:center;padding:12px 6px;background:var(--glass-1);border:1px solid var(--glass-border);border-radius:var(--r-md)}
.achieve-item.locked{opacity:.5;filter:grayscale(.5)}
.achieve-item.unlocked{border-color:var(--brand)}
.achieve-icon{font-size:22px;margin-bottom:5px}
.achieve-name{font-size:9px;font-weight:700;text-transform:uppercase;color:var(--text-2);line-height:1.2;margin-bottom:4px}
.achieve-progress{height:2px;background:var(--glass-3);border-radius:var(--r-full);overflow:hidden;margin:3px 3px 0}
.achieve-progress-fill{height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-2))}
.achieve-progress-text{font-size:8px;color:var(--text-3);font-weight:700;margin-top:2px}
.level-hero{background:var(--glass-1);border:1px solid var(--glass-border);border-radius:var(--r-lg);padding:16px;margin-bottom:12px}
.level-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:var(--r-full);background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;font-weight:800;font-size:12px}
.xp-bar{height:8px;background:var(--glass-3);border-radius:var(--r-full);overflow:hidden;margin-top:10px}
.xp-bar-fill{height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-2));border-radius:var(--r-full);transition:width .6s var(--spring-soft)}
.xp-text{font-size:11px;color:var(--text-2);margin-top:5px;font-weight:600}
.live-panel{position:fixed;inset:0;z-index:1500;pointer-events:none;opacity:0;transition:opacity .2s}
.live-panel.open{opacity:1;pointer-events:auto}
.live-panel-inner{position:absolute;top:0;right:0;bottom:0;width:min(420px,90vw);transform:translate3d(100%,0,0);transition:transform .3s var(--spring-snap);border-radius:28px 0 0 28px;border-right:none;overflow-y:auto;padding:18px;padding-top:calc(18px + var(--safe-top));padding-bottom:calc(18px + var(--safe-bottom));background:var(--glass-2);backdrop-filter:blur(var(--glass-blur-strong)) saturate(200%);-webkit-backdrop-filter:blur(var(--glass-blur-strong)) saturate(200%);border:1px solid var(--glass-border-strong)}
.live-panel.open .live-panel-inner{transform:translate3d(0,0,0)}
.live-panel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.live-panel-title{font-size:18px;font-weight:800}
.live-panel-body{display:flex;flex-direction:column;gap:8px}
.live-panel-item{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--glass-2);border:1px solid var(--glass-border);border-radius:var(--r-md);cursor:pointer;min-height:50px}
.live-panel-item-icon{font-size:20px;flex-shrink:0;width:26px;text-align:center}
.live-panel-item-label{flex:1;font-size:13px;font-weight:600}
.tap-ripple{position:relative;overflow:hidden}
.tap-ripple::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at var(--rx,50%) var(--ry,50%),rgba(255,255,255,.3) 0%,transparent 60%);opacity:0;transform:scale(.4);pointer-events:none}
.tap-ripple.rippling::after{animation:rippleFade .5s ease-out forwards}
@keyframes rippleFade{0%{opacity:.9;transform:scale(.5)}100%{opacity:0;transform:scale(1.5)}}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.divider{height:1px;background:var(--divider);margin:14px 0}
.mt-1{margin-top:4px}.mt-2{margin-top:8px}.mt-3{margin-top:12px}.mt-4{margin-top:16px}.mt-5{margin-top:20px}
.mb-2{margin-bottom:8px}.mb-3{margin-bottom:12px}.mb-4{margin-bottom:16px}.mb-5{margin-bottom:20px}
.empty{text-align:center;padding:40px 20px;color:var(--text-2)}
.empty-icon{font-size:52px;opacity:.35;margin-bottom:14px}
.empty-title{font-size:17px;font-weight:700;color:var(--text);margin-bottom:8px}
.empty-text{font-size:13px;line-height:1.5}
.insight-card{background:linear-gradient(135deg,rgba(91,158,255,.14),rgba(167,139,250,.14));border:1px solid rgba(91,158,255,.3);border-radius:var(--r-lg);padding:16px;margin-bottom:12px}
.insight-title{font-size:12px;font-weight:800;margin-bottom:8px;color:var(--brand-2);text-transform:uppercase;letter-spacing:.06em}
.insight-text{font-size:14px;line-height:1.55}
.insight-author{font-size:11px;color:var(--text-3);margin-top:8px;font-style:italic}
.insight-apply{font-size:12px;color:var(--brand-3);margin-top:6px;padding-top:6px;border-top:1px dashed var(--divider)}
.motivation-card{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;border-radius:var(--r-lg);padding:18px;margin-bottom:12px;position:relative;overflow:hidden}
.motivation-quote{font-size:16px;font-weight:700;line-height:1.45;position:relative;z-index:1}
.motivation-author{font-size:12px;opacity:.85;margin-top:10px;position:relative;z-index:1}
.challenge-card{background:linear-gradient(135deg,rgba(255,169,64,.15),rgba(255,107,107,.1));border:1px solid rgba(255,169,64,.35);border-radius:var(--r-lg);padding:16px;margin-bottom:12px;position:relative;overflow:hidden;cursor:pointer}
.challenge-card.done{background:linear-gradient(135deg,rgba(61,220,151,.15),rgba(91,158,255,.1));border-color:rgba(61,220,151,.4)}
.challenge-badge{position:absolute;top:12px;right:12px;font-size:11px;font-weight:800;padding:3px 8px;background:var(--warning);color:#000;border-radius:var(--r-full)}
.challenge-card.done .challenge-badge{background:var(--success)}
.challenge-title{font-size:15px;font-weight:800;margin-bottom:6px;padding-right:50px}
.challenge-desc{font-size:13px;color:var(--text-2);line-height:1.5}
.mode-card{background:var(--glass-1);border:2px solid var(--glass-border);border-radius:var(--r-lg);padding:12px;margin-bottom:6px;cursor:pointer}
.mode-card.active{border-color:var(--brand);box-shadow:0 0 20px var(--brand-glow)}
.profile-hero{text-align:center;padding:24px;background:var(--glass-1);border:1px solid var(--glass-border);border-radius:24px;margin-bottom:16px}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--glass-3);border-radius:3px}
::selection{background:var(--brand-glow);color:var(--text)}
@media(max-width:480px){
.app-main{padding:12px;padding-bottom:calc(var(--tabbar-h) + var(--safe-bottom) + 60px)!important}
.title-xl{font-size:24px}
.ring-svg,.ring-center{width:56px;height:56px}
.ring-value{font-size:11px}
.ring-label{font-size:8px}
.tab-item .tab-icon{font-size:18px}
.tab-item .tab-label{font-size:8px}
}
@media (prefers-reduced-motion: reduce){
*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body class="theme-dark">
<div class="bg-aurora"></div>
<div class="theme-effect" id="themeEffect"></div>

<header class="app-header">
<div class="header-inner">
<div class="header-left">
<div class="brand">
<div class="brand-logo">🧠</div>
<div class="brand-text">
<span class="brand-name">AI Health</span>
<span class="brand-version">v33</span>
</div>
</div>
</div>
<div class="header-actions">
<button class="icon-btn" onclick="openLiveControl()" aria-label="Пульт">🎛</button>
<button class="icon-btn" onclick="openStatsQuick()" aria-label="Статистика">📊</button>
<button class="icon-btn" onclick="openThemePicker()" aria-label="Тема">🎨</button>
<button class="avatar-btn" id="headerAvatar" onclick="navigate('profile')" aria-label="Профиль">👤</button>
</div>
</div>
</header>

<main class="app-main" id="app"></main>

<div class="tab-bar-wrap"><nav class="tab-bar" id="tabBar"></nav></div>

<div class="toast-container" id="toasts"></div>

<div class="live-panel" id="livePanel">
<div class="live-panel-inner">
<div class="live-panel-header">
<span class="live-panel-title">🎛 Пульт</span>
<button class="icon-btn-sm" onclick="closeLiveControl()">✕</button>
</div>
<div class="live-panel-body" id="livePanelBody"></div>
</div>
</div>

<script src="content.js"></script>
<script src="english.js"></script>
<script src="skills.js"></script>
<script src="entertainment.js"></script>
<script src="app.js"></script>
</body>
</html>
