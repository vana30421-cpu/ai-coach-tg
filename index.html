<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Life OS</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://telegram.org/js/telegram-web-app.js?56"></script>
<style>
:root {
  --bg: #000; --bg-1: #0b0b10; --bg-2: #14141b;
  --text: #fff; --text-2: rgba(255,255,255,0.74);
  --brand: #5b9eff; --brand-2: #a78bfa;
  --glass-1: rgba(255,255,255,0.06); --glass-2: rgba(255,255,255,0.12);
  --border: rgba(255,255,255,0.16);
  --icon-radius: 14px; --btn-radius: 20px;
}
/* Тема Мальдивы */
body.theme-maldives { --bg: #001f2e; --bg-1: #003044; --bg-2: #004a6a; --text: #e0ffff; --brand: #00e5ff; --brand-2: #00b4d8; --icon-radius: 50%; --btn-radius: 16px; }

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100dvh; transition: background 0.4s; }
.app-header { padding-top: env(safe-area-inset-top); position: sticky; top: 0; z-index: 100; background: var(--bg); }
.header-inner { display: flex; gap: 10px; padding: 10px; justify-content: center; }
.icon-btn { width: 44px; height: 44px; border-radius: var(--icon-radius); background: var(--glass-2); border: 1px solid var(--border); color: var(--text); display: grid; place-items: center; font-size: 20px; transition: transform 0.15s; }
.icon-btn:active { transform: scale(0.9); }
.avatar-btn { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, var(--brand), var(--brand-2)); display: grid; place-items: center; font-size: 20px; cursor: pointer; }
.app-main { padding: 15px; padding-bottom: 100px; }
.tab-bar-wrap { position: fixed; bottom: 0; left: 0; right: 0; padding: 10px; z-index: 100; background: linear-gradient(0deg, var(--bg) 60%, transparent); }
.tab-bar { display: flex; background: var(--glass-2); border-radius: 20px; border: 1px solid var(--border); height: 64px; padding: 4px; backdrop-filter: blur(20px); }
.tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border: none; background: none; color: var(--text-2); font-size: 10px; transition: all 0.2s; border-radius: 16px; cursor: pointer; }
.tab-item.active { color: var(--text); background: var(--glass-1); }
.tab-icon { font-size: 22px; margin-bottom: 2px; }
.card, .list-row { background: var(--glass-2); border: 1px solid var(--border); border-radius: var(--btn-radius); padding: 16px; margin-bottom: 12px; animation: slideUp 0.3s cubic-bezier(0.34,1.56,0.64,1) both; }
@keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
.list-row { display: flex; align-items: center; gap: 12px; cursor: pointer; }
.list-row:active { transform: scale(0.96); }
.btn { padding: 12px 20px; border-radius: var(--btn-radius); border: none; font-weight: bold; cursor: pointer; transition: all 0.2s; width: 100%; display: flex; justify-content: center; gap: 8px; }
.btn:active { transform: scale(0.96); }
.btn-primary { background: linear-gradient(135deg, var(--brand), var(--brand-2)); color: #fff; }
.btn-danger { background: #ff6b6b; color: #fff; }
.progress { height: 8px; background: var(--glass-1); border-radius: 10px; overflow: hidden; margin-top: 8px; }
.progress-fill { height: 100%; background: var(--brand); transition: width 0.6s cubic-bezier(0.34,1.56,0.64,1); }
.field { margin-bottom: 14px; }
.field-label { display: block; font-size: 11px; font-weight: 700; color: var(--text-2); margin-bottom: 6px; text-transform: uppercase; }
input, select, textarea { width: 100%; min-height: 46px; padding: 12px; background: var(--glass-1); border: 1px solid var(--border); border-radius: var(--btn-radius); color: var(--text); font-family: inherit; font-size: 15px; }
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); z-index: 1000; display: flex; align-items: flex-end; animation: fadeIn 0.2s; }
.modal { background: var(--bg-1); width: 100%; border-radius: 24px 24px 0 0; padding: 20px; max-height: 90vh; overflow-y: auto; animation: slideModal 0.4s cubic-bezier(0.16,1.3,0.3,1) both; }
@keyframes slideModal { from { transform: translateY(100%); } to { transform: translateY(0); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.title-xl { font-size: 26px; font-weight: 800; margin-bottom: 15px; }
.text-secondary { color: var(--text-2); font-size: 13px; }
</style>
</head>
<body class="theme-dark">
<header class="app-header">
  <div class="header-inner">
    <button class="avatar-btn" id="headerAvatar" onclick="navigate('profile')">👤</button>
    <button class="icon-btn" onclick="navigate('stats')">📊</button>
    <button class="icon-btn" onclick="openThemePicker()">🎨</button>
  </div>
</header>
<main class="app-main" id="app"></main>
<div class="tab-bar-wrap"><nav class="tab-bar" id="tabBar"></nav></div>
<div id="toasts" style="position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999;"></div>

<script src="content5.js"></script>
<script src="content6.js"></script>
<script src="content7.js"></script>
<script src="content8.js"></script>
<script src="integration.js"></script>
<script src="app.js"></script>

<script src="app-render.js"></script>

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() { navigator.serviceWorker.register('sw.js'); });
  }
</script>
</body>
</html>
